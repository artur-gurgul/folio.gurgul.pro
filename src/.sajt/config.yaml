site:
  title: folio - {{article.title}}
  url: https://folio.gurgul.pro
# files the build writes for the whole site: the side panel is built from
# nav.json (static/js/site.js), so no page repeats it; sitemap + robots.txt
# tell search engines every page there is
generate:
  nav: /nav.json
  sitemap: /sitemap.xml
  robots: /robots.txt
tex:
  # the list of folios has its own page; the front page only says what folio is
  list: /folios.html
  # bookkeeping labels, not shown as chips: discussion=<n> is the folio's one
  # thread in GitHub Discussions (the "Discuss this folio" link opens it)
  hideLabels: [round, new, discussion]
