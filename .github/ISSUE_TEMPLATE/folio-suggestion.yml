name: Suggest a folio
description: A subject that deserves its own one-page folio.
title: "[folio] "
labels: ["folio-idea"]
body:
  - type: input
    id: subject
    attributes:
      label: Subject
      description: One subject — narrow enough to fit densely on one A4 page.
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: The facts worth keeping
      description: The key facts a reader should remember, as short bullets — no explanations.
    validations:
      required: true
  - type: textarea
    id: visual
    attributes:
      label: Picture
      description: What could be drawn — a flow, layers, a comparison table, a timeline?
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Where the facts can be checked.
    validations:
      required: true
