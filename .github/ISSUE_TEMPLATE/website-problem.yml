name: Website problem
description: Something on the site looks wrong or does not work.
title: "[site] "
labels: ["website"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      description: e.g. Firefox 131 on a laptop, Safari on an iPhone, printed PDF.
