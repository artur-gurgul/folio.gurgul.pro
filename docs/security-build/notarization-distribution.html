<p class="sheet-kicker">security-build · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> The <strong>channel</strong> decides who may install and who vouches: App Store, TestFlight,
Custom and Unlisted apps go through <strong>App Review</strong> and are <strong>re-signed by Apple</strong>; Ad Hoc
and Enterprise run on <strong>your</strong> signature + profile; a Mac app outside the store is signed
with <strong>Developer ID</strong>, uses the <strong>hardened runtime</strong> and is <strong>notarized</strong> — an
automated malware + signing scan whose <strong>ticket</strong> Gatekeeper checks at first launch.
“Notarization” for <em>iOS</em> (EU, via alternative marketplaces or the web) is a different thing: a
baseline App Review.</p>
<p class="sheet-tools"><a class="sheet-download" href="notarization-distribution.pdf" download>Download PDF</a> <a href="notarization-distribution.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/security-build/notarization-distribution.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="notarization-distribution-fig1.svg" width="624" height="93" class="wide" alt="Notarization &amp; distribution channels — figure 1" loading="lazy"></figure>
<p><table class="sheet-table">
<thead>
<tr><th><strong>Channel</strong></th><th><strong>Signing</strong></th><th><strong>Who can install</strong></th><th><strong>Review</strong></th><th><strong>Know this</strong></th></tr>
</thead>
<tbody>
<tr><td>App Store</td><td>Apple Distribution <span class="math">→</span> Apple re-signs</td><td>public</td><td>App Review</td><td>store builds unaffected by your cert expiring</td></tr>
<tr><td>TestFlight</td><td>same build + profile</td><td>internal / external testers</td><td>Beta App Review (external)</td><td>the <em>same</em> <code>.ipa</code> is promoted to the store</td></tr>
<tr><td>Ad Hoc</td><td>Apple Distribution + ad hoc profile</td><td>registered UDIDs only</td><td>none</td><td><strong>100 devices per product family per membership year</strong>; disabling frees no slot — reset only at renewal</td></tr>
<tr><td>Enterprise / In-House</td><td>In-House cert + profile</td><td>own employees only (MDM)</td><td>none</td><td>Enterprise Program $299/yr, 100+ employees; customer use breaks the agreement; revoked/expired cert <span class="math">→</span> <strong>every install stops launching</strong></td></tr>
<tr><td>Custom app</td><td>Apple Distribution, App Store record set <em>Private</em></td><td>named orgs via Apple Business / School Manager</td><td>App Review</td><td>Apple’s preferred path for internal apps; distribution method fixed once approved</td></tr>
<tr><td>Unlisted app</td><td>App Store record + request</td><td>anyone with the link</td><td>App Review</td><td>not in search/charts; also assignable via ABM/ASM</td></tr>
<tr><td>Developer ID (macOS)</td><td>Developer ID Application / Installer</td><td>anyone who downloads</td><td>notarization (automated)</td><td>expired cert: signed + timestamped builds keep running; <strong>revoked</strong>: no new installs</td></tr>
<tr><td>Mac App Store</td><td>Mac App Distribution + Mac Installer Distribution</td><td>public</td><td>App Review</td><td>App Sandbox required</td></tr>
<tr><td>EU alt. marketplace / Web Distribution</td><td>Apple encrypts + signs after notarization</td><td>EU users, iOS 17.4+ (web: 17.5+)</td><td>iOS Notarization (guideline subset, automated + human)</td><td>installed only from an authorised marketplace or your registered domain</td></tr>
</tbody>
</table></p>
<h3 class="sheet-hd"><span class="c-sheetblue">How macOS notarization works</span></h3>
<ul>
<li><strong>Requirements</strong>: every executable signed with <strong>Developer ID</strong> (not  Development/Distribution/ad hoc) + <strong>hardened runtime</strong> + <strong>secure
 timestamp</strong>; no <code>get-task-allow</code>; SDK <span class="math">≥</span> 10.9; ASCII-XML entitlements.  <strong>Mandatory</strong> since macOS 10.15 (software built after 1 June 2019).</li>
<li><strong>Hardened runtime</strong> blocks JIT, <code>DYLD_*</code> env vars, foreign dylibs, debugger  attach — each re-enabled only by a <code>com.apple.security.cs.*</code> entitlement  (<code>allow-jit</code>, <code>disable-library-validation</code>…).</li>
<li><strong>What is scanned</strong>: malicious content + code-signing problems; an audit trail per  signing key is kept.</li>
<li><strong>Tools</strong>: <code>notarytool</code> (Xcode 13+). Apple stopped accepting <code>altool</code> and  Xcode 13- uploads on <strong>1 Nov 2023</strong>. Auth: keychain profile (Apple ID +  app-specific password + Team ID) or an App Store Connect API key (<code>--key --key-id
 --issuer</code>).</li>
<li><strong>Packaging</strong>: notarize the thing you ship; a <code>.zip</code> can’t be stapled (staple the  app, then re-zip). DMG: sign the app, build the DMG, sign the DMG, notarize + staple the  DMG. Installer: <code>pkgbuild</code> (component) / <code>productbuild</code> (product archive), signed  with <strong>Developer ID Installer</strong>; custom installers = two rounds (payload, then  installer).</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">iOS outside the App Store — EU (and Japan)</span></h3>
<ul>
<li>Reviewed under the <strong>Notarization Review Guidelines</strong> only (security, privacy,  device integrity) <span class="math">→</span> alternative channels only; full App Review <span class="math">→</span> both.</li>
<li>Apple <strong>encrypts and signs</strong> every alternatively distributed app; install checks  for tampering and an authorised source; known malware <span class="math">→</span> won’t launch, installs blocked.</li>
<li>Marketplaces need Apple’s authorisation (USD 1 M letter of credit). Japan: iOS  Notarization too.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Remember</span></h3>
<h3 class="sheet-hd">“Sign inside-out with a timestamp and the runtime, notarize the outermost thing,
staple what you ship.”</h3>
<h3 class="sheet-hd"><span class="c-sheetblue">Example — Developer ID release of a DMG</span></h3>
<pre class="sheet-code"><code class="hljs language-bash">ID=<span class="hljs-string">&quot;Developer ID Application: Alice (ABCDE12345)&quot;</span>
codesign -s <span class="hljs-string">&quot;<span class="hljs-variable">$ID</span>&quot;</span> -o runtime --timestamp -f App.app   <span class="hljs-comment"># after nested code</span>
hdiutil create -volname App -srcfolder App.app -ov -format UDZO App.dmg
codesign -s <span class="hljs-string">&quot;<span class="hljs-variable">$ID</span>&quot;</span> --timestamp App.dmg
xcrun notarytool store-credentials AC --apple-id alice@example.com \
      --team-id ABCDE12345            <span class="hljs-comment"># prompts for an app-specific password</span>
xcrun notarytool submit App.dmg --keychain-profile AC --<span class="hljs-built_in">wait</span>
xcrun notarytool <span class="hljs-built_in">log</span> &lt;submission-id&gt; --keychain-profile AC  <span class="hljs-comment"># if Invalid</span>
xcrun stapler staple App.dmg &amp;&amp; xcrun stapler validate App.dmg
spctl -a -vvv -t <span class="hljs-built_in">exec</span> App.app     <span class="hljs-comment"># accepted, source=Notarized Developer ID</span>
productbuild --component App.app /Applications \
      --sign <span class="hljs-string">&quot;Developer ID Installer: Alice (ABCDE12345)&quot;</span> App.pkg</code></pre>
<h3 class="sheet-hd"><span class="c-sheetblue">Certificate facts that decide channels</span></h3>
<ul>
<li>One certificate <em>of each distribution type</em> per team — except Developer ID; only  the Account Holder or an Admin can create distribution certificates.</li>
<li>Developer ID <strong>Application</strong> expired: existing builds still install and run;  <strong>Installer</strong> expired: pkgs install only if timestamped; <strong>revoked</strong>: no installs.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap"><strong>Notarized <span class="math">≠</span> reviewed</strong>: macOS notarization is automated malware/signing  scanning; App Review is a different process.</li>
<li class="trap">Signing a DMG with <em>Developer ID Installer</em>, or a pkg with <em>Application</em> — each  container has its own certificate type.</li>
<li class="trap"><code>codesign --deep</code> “fixes” the notary’s nested-code complaint but stamps the app’s  entitlements on every helper — sign each item.</li>
<li class="trap">Missing <code>--timestamp</code>: the notary rejects it (“does not include a secure  timestamp”); for a pkg the timestamp is what keeps it installable after the  Installer cert expires.</li>
<li class="trap">Enterprise cert for customers/betas — revoked <span class="math">→</span> every copy dies; use Custom apps.</li>
</ul>
