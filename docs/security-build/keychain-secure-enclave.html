t folio-page"><h1 class="title">Keychain · Secure Enclave · biometrics</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">security · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> The <strong>Keychain</strong> is an encrypted database <em>outside</em> your
sandbox (<code>securityd</code>); its rows open with <strong>class keys</strong> that
depend on lock state. The <strong>Secure Enclave</strong> is a separate chip: keys
<em>born</em> there <strong>never leave</strong> — data in, signature out. Biometrics are
secure only when they <strong>gate a key</strong>, never when they return a <code>Bool</code>.</p>
<p class="sheet-tools"><a class="sheet-download" href="keychain-secure-enclave.pdf" download>Download PDF</a> <a href="keychain-secure-enclave.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/security-build/keychain-secure-enclave.tex">LaTeX source</a></p>
<section class="sheet-section">
<h2>Keychain</h2>
<ul>
<li><code>SecItemAdd</code> · <code>SecItemCopyMatching</code> ·  <code>SecItemUpdate</code> · <code>SecItemDelete</code> — dictionary in,  <code>OSStatus</code> out. <strong>No upsert</strong>: add, and on  <code>errSecDuplicateItem</code> update; absent <span class="math">→</span>  <code>errSecItemNotFound</code>.</li>
<li><code>kSecClass</code>: <code>GenericPassword</code> (tokens; identity =  service + account), <code>InternetPassword</code>, <code>Key</code>,  <code>Certificate</code>, <code>Identity</code>. Reads need  <code>kSecReturnData: true</code> + <code>kSecMatchLimit</code>.</li>
<li><strong>Sharing</strong>: <code>kSecAttrAccessGroup</code>, same Team ID, group in  the Keychain Sharing entitlement. <code>kSecAttrSynchronizable</code> =  iCloud Keychain. Items usually <strong>survive uninstall</strong> — not a  contract; never a “first run” flag.</li>
</ul>
<p><table class="sheet-table">
<thead>
<tr><th><code>kSecAttrAccessible…</code> — choose by <em>when you read</em></th><th></th></tr>
</thead>
<tbody>
<tr><td><code>WhenPasscodeSetThisDeviceOnly</code></td><td>unlocked + passcode; <strong>deleted</strong>
 if the passcode is removed</td></tr>
<tr><td><code>WhenUnlocked</code> (default)</td><td>only while unlocked — UI-driven secrets</td></tr>
<tr><td><code>AfterFirstUnlock</code></td><td>1st unlock <span class="math">→</span> reboot, also locked:
 <strong>background</strong> work</td></tr>
<tr><td><code>…ThisDeviceOnly</code></td><td>never migrates (no iCloud sync, no restore
 to a new device)</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Secure Enclave &amp; biometrics</h2>
<ul>
<li>SE keys: <strong>EC P-256</strong> (signing + ECDH); since iOS 26 CryptoKit  adds <strong>ML-KEM-768/1024</strong> and <strong>ML-DSA-65/87</strong>. No RSA, no  arbitrary blobs: generated and used <em>inside</em>; the app holds an  opaque reference.  CryptoKit <code>SecureEnclave.P256.Signing.PrivateKey</code> — its  <code>dataRepresentation</code> is a wrapped handle only <em>this</em> SE  can use (store it in the Keychain). No SE on the Simulator.</li>
<li>Protect a secret <em>with</em> the SE: encrypt it under an SE-bound  key, or gate its item with a <code>SecAccessControl</code>.</li>
<li>Flags: <code>.biometryCurrentSet</code> (item dies when a face/finger is  enrolled — an attacker adding theirs loses access), <code>.biometryAny</code>,  <code>.userPresence</code> (biometry <em>or passcode</em>),  <code>.privateKeyUsage</code> (SE keys).</li>
<li><code>LAContext.evaluatePolicy</code> = a <code>Bool</code> in hookable code:  UX only. Reuse it via <code>kSecUseAuthenticationContext</code> (one  prompt). Face ID needs <code>NSFaceIDUsageDescription</code>.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Example</h2>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">let</span> id: [<span class="hljs-type">CFString</span>: <span class="hljs-keyword">Any</span>] <span class="hljs-operator">=</span> [kSecClass: kSecClassGenericPassword,
  kSecAttrService: <span class="hljs-string">&quot;api&quot;</span>, kSecAttrAccount: <span class="hljs-string">&quot;token&quot;</span>]
<span class="hljs-keyword">var</span> add <span class="hljs-operator">=</span> id; add[kSecValueData] <span class="hljs-operator">=</span> data
add[kSecAttrAccessible] <span class="hljs-operator">=</span> kSecAttrAccessibleAfterFirstUnlock
<span class="hljs-keyword">var</span> st <span class="hljs-operator">=</span> <span class="hljs-type">SecItemAdd</span>(add <span class="hljs-keyword">as</span> <span class="hljs-type">CFDictionary</span>, <span class="hljs-literal">nil</span>)
<span class="hljs-keyword">if</span> st <span class="hljs-operator">==</span> errSecDuplicateItem {                   <span class="hljs-comment">// no upsert</span>
  <span class="hljs-keyword">let</span> new <span class="hljs-operator">=</span> [kSecValueData: data] <span class="hljs-keyword">as</span> <span class="hljs-type">CFDictionary</span>
  st <span class="hljs-operator">=</span> <span class="hljs-type">SecItemUpdate</span>(id <span class="hljs-keyword">as</span> <span class="hljs-type">CFDictionary</span>, new) }
<span class="hljs-keyword">let</span> acl <span class="hljs-operator">=</span> <span class="hljs-type">SecAccessControlCreateWithFlags</span>(<span class="hljs-literal">nil</span>,
  kSecAttrAccessibleWhenUnlockedThisDeviceOnly,
  [.privateKeyUsage, .biometryCurrentSet], <span class="hljs-literal">nil</span>)<span class="hljs-operator">!</span>
<span class="hljs-keyword">let</span> key <span class="hljs-operator">=</span> <span class="hljs-keyword">try</span> <span class="hljs-type">SecureEnclave</span>.<span class="hljs-type">P256</span>.<span class="hljs-type">Signing</span>
                .<span class="hljs-type">PrivateKey</span>(accessControl: acl)
<span class="hljs-keyword">let</span> sig <span class="hljs-operator">=</span> <span class="hljs-keyword">try</span> key.signature(for: nonce)  <span class="hljs-comment">// Face ID, signed in SE</span></code></pre>
</section>

<h2>The trust boundary</h2>
<figure class="sheet-figure"><img src="keychain-secure-enclave-fig1.svg" width="290" height="154" alt="Keychain · Secure Enclave · biometrics — figure 1" loading="lazy"></figure>

<section class="sheet-section">
<h2>Data Protection — files, same idea</h2>
<p><table class="sheet-table">
<tbody>
<tr><td><code>.complete</code></td><td>unlocked only; key dropped 10 s after lock (Require Password: Immediately)</td></tr>
<tr><td><code>.completeUnlessOpen</code></td><td>open files keep working when locked; new
 files can be created</td></tr>
<tr><td><code>.completeUntilFirstUserAuthentication</code></td><td><strong>default</strong> — the
 twin of <code>AfterFirstUnlock</code></td></tr>
<tr><td><code>.none</code></td><td>UID-key only, always readable</td></tr>
</tbody>
</table></p>
<p><code>data.write(to:options: .completeFileProtection)</code>; SQLite: the <code>-wal</code>/<code>-shm</code> files too. <strong>No passcode <span class="math">⇒</span> no
passcode-derived keys</strong>: every class degrades to <code>.none</code><span class="unverified">(unverified)</span>.</p>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap">Background upload fails at 3 am <span class="math">→</span> token is <code>WhenUnlocked</code>;  locked read = <code>errSecInteractionNotAllowed</code>. Use <code>AfterFirstUnlock</code>.</li>
<li class="trap">“Put the JWT in the Secure Enclave” — impossible; it holds keys.</li>
<li class="trap"><code>if faceIDOK { showVault() }</code> is a UI gate, not security.</li>
<li class="trap"><code>.complete</code> Core Data store + background launch = crash.</li>
<li class="trap">Tokens in <code>UserDefaults</code> — a plain plist in the container.</li>
<li class="trap">Add succeeds, read says <code>errSecItemNotFound</code> <span class="math">→</span> query  differs (service/account/access group) or no <code>kSecReturnData</code>.</li>
<li class="trap"><code>…ThisDeviceOnly</code> + <code>kSecAttrSynchronizable</code> —  contradictory; synced items cannot be device-only.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<p><strong>“Keychain for secrets, class for <em>when</em>, enclave for keys,
biometry on the key — never on a Bool.”</strong></p>
</section>
