oin="round"></path></svg></summary></details></nav></div><div class="scroll"></div></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">Signing failures — symptom → check → fix</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">security-build · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> Every signing error is a <strong>mismatch between four things</strong> that must agree —
the <strong>identity</strong> (certificate <em>+ private key</em> in a reachable keychain), the
<strong>profile</strong> (App ID, certificates, entitlements, devices, expiry), the <strong>signed
entitlements</strong> and the <strong>bundle</strong> (every nested binary signed, nothing changed after). First
ask <em>when</em> it fails — build, CI only, install, upload, launch — then <strong>decode both
sides and diff them</strong> instead of toggling Xcode settings.</p>
<p class="sheet-tools"><a class="sheet-download" href="signing-troubleshooting.pdf" download>Download PDF</a> <a href="signing-troubleshooting.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/security-build/signing-troubleshooting.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="signing-troubleshooting-fig1.svg" width="591" height="167" class="wide" alt="Signing failures — symptom → check → fix — figure 1" loading="lazy"></figure>
<p><table class="sheet-table">
<thead>
<tr><th><strong>Message (abridged)</strong></th><th><strong>Real cause</strong></th><th><strong>Fix</strong></th></tr>
</thead>
<tbody>
<tr><td>No signing certificate “Apple Distribution” found</td><td>identity not in a searched keychain, or the cert is there <em>without</em> its private key</td><td>import the <code>.p12</code> from the Mac that made the CSR (or <code>match</code>); revoking + recreating breaks other machines</td></tr>
<tr><td>Provisioning profile “X” doesn’t include the <code>aps-environment</code> entitlement</td><td>capability in <code>.entitlements</code> but not enabled on the App ID, or the profile predates it</td><td>enable on the App ID <span class="math">→</span> regenerate profile <span class="math">→</span> download (automatic signing does all three)</td></tr>
<tr><td>… doesn’t include signing certificate “Apple Development: Alice (…)”</td><td>profile lists other certs (new Mac, cert renewed)</td><td>regenerate the profile with your cert selected</td></tr>
<tr><td>profile / cert from another team</td><td><code>DEVELOPMENT_TEAM</code> <span class="math">≠</span> profile’s TeamIdentifier (often an extension target)</td><td>one team per target set; check every target</td></tr>
<tr><td>certificate expired or revoked</td><td>1-year Development/Distribution cert ran out, or a teammate revoked it</td><td>new cert <span class="math">→</span> new profiles; App Store builds already live are unaffected</td></tr>
<tr><td>A valid provisioning profile for this executable was not found</td><td>at install: expired profile, device missing, or profile/cert mismatch</td><td>decode <code>embedded.mobileprovision</code> inside the <code>.ipa</code> and compare</td></tr>
<tr><td>resource fork, Finder information, or similar detritus not allowed</td><td>extended attributes on files in the bundle (iCloud Drive / Dropbox folder, downloaded assets)</td><td><code>xattr -cr App.app</code>, build outside synced folders</td></tr>
<tr><td>code object is not signed at all — In subcomponent: <code>…/Frameworks/X.framework</code></td><td>nested binary unsigned: “Embed Without Signing”, a Mach-O in <code>Resources/</code>, a patched vendor binary</td><td>Embed &amp; Sign; put code where code goes; re-sign inside-out</td></tr>
<tr><td>ITMS-90035 Invalid Signature</td><td>dev/ad hoc identity, sealed resource missing/invalid, odd filenames, script files in the bundle</td><td>distribution identity, Release config, clean build, rename files</td></tr>
<tr><td>ITMS-90164 / ITMS-90046</td><td>signed entitlements not all in the profile / not valid on iOS (wildcard associated domain, malformed <code>application-identifier</code>)</td><td>diff <code>codesign -d --entitlements</code> vs the profile; explicit values only</td></tr>
<tr><td>unsupported architectures [x86_64, i386] (ITMS-90087<span class="unverified">(unverified)</span>)</td><td>simulator slices in a fat vendor framework</td><td>ship an <code>.xcframework</code>, or strip before signing</td></tr>
</tbody>
</table></p>
<h3 class="sheet-hd"><span class="c-sheetblue">Example — decode both sides and diff</span></h3>
<pre class="sheet-code"><code class="hljs language-bash">unzip -q App.ipa &amp;&amp; APP=Payload/App.app
security cms -D -i <span class="hljs-variable">$APP</span>/embedded.mobileprovision &gt; prof.plist
/usr/libexec/PlistBuddy -c <span class="hljs-string">&#x27;Print :Entitlements&#x27;</span> prof.plist    <span class="hljs-comment"># allowed</span>
/usr/libexec/PlistBuddy -c <span class="hljs-string">&#x27;Print :ProvisionedDevices&#x27;</span> prof.plist
codesign -d --entitlements :- <span class="hljs-variable">$APP</span>                  <span class="hljs-comment"># actually signed</span>
codesign -dvvv <span class="hljs-variable">$APP</span> 2&gt;&amp;1 | grep -E <span class="hljs-string">&#x27;Authority|TeamIdentifier&#x27;</span>
security find-identity -v -p codesigning            <span class="hljs-comment"># SHA-1 of your certs</span>
xcodebuild -showBuildSettings | grep -E <span class="hljs-string">&#x27;CODE_SIGN|PROVISIONING|TEAM&#x27;</span>
codesign --verify --deep --strict -vvv <span class="hljs-variable">$APP</span>         <span class="hljs-comment"># nested damage</span></code></pre>
<h3 class="sheet-hd"><span class="c-sheetblue">Where things live</span></h3>
<ul>
<li>Profiles: <strong>Xcode 16+</strong> <code>~/Library/Developer/Xcode/UserData/Provisioning
 Profiles</code>; Xcode <span class="math">≤</span> 15 <code>~/Library/MobileDevice/Provisioning Profiles</code> —  tools and CI scripts hard-coding the old path need updating.</li>
<li>In the product: <code>embedded.mobileprovision</code> (iOS), <code>embedded.provisionprofile</code>  (macOS). Keys: <code>TeamIdentifier</code>, <code>Entitlements</code>, <code>DeveloperCertificates</code>,  <code>ProvisionedDevices</code>, <code>ExpirationDate</code>.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Automatic vs manual signing</span></h3>
<ul>
<li><strong>Automatic</strong> (<code>CODE_SIGN_STYLE = Automatic</code>): Xcode creates certs, App IDs,  “Xcode Managed” profiles, registers the connected device. On CI:  <code>xcodebuild -allowProvisioningUpdates</code> + an App Store Connect API key  (<code>-authenticationKey{Path,ID,IssuerID}</code>).</li>
<li><strong>Manual</strong>: <code>CODE_SIGN_IDENTITY</code> + <code>PROVISIONING_PROFILE_SPECIFIER</code> per  target; deterministic — usual on CI with match.</li>
<li><strong>Every target signs separately</strong>: each app extension / watch app has its own  App ID and profile; the host’s profile does not cover them.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">On the device</span></h3>
<ul>
<li>iOS 16+: development-signed apps need <strong>Developer Mode</strong> (Settings › Privacy &amp;  Security); TestFlight / App Store builds don’t.</li>
<li>Enterprise builds: the user must trust the developer (Settings › General › VPN &amp;  Device Management) and the first launch verifies online<span class="unverified">(unverified)</span>.</li>
<li>No debugger on a distribution build: no <code>get-task-allow</code>.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap">“Revoke and recreate the certificate” — kills every other machine’s key and CI;  export the <code>.p12</code> instead.</li>
<li class="trap">Capability works in Debug, fails in Release: only the <em>development</em> profile was  regenerated.</li>
<li class="trap">Toggling “Automatically manage signing” hides the real mismatch — diff first.</li>
<li class="trap">Anything that edits the bundle after signing (a script phase, <code>strip</code>,  <code>install_name_tool</code>) invalidates it — sign last.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Remember</span></h3>
<h3 class="sheet-hd">“When does it fail? Decode the profile, dump the entitlements, list the identities —
diff, regenerate, sign inside-out.”</h3>
