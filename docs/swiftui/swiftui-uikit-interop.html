<p class="sheet-kicker">swiftui · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> A <strong>representable</strong> struct wraps a long-lived UIKit object: <code>make</code> runs <strong>once per
identity</strong>, <code>update</code> <strong>on every change</strong>, a <strong>Coordinator</strong> carries callbacks back.
The other way, <strong><code>UIHostingController</code></strong> is a real view controller showing a SwiftUI view.</p>
<p class="sheet-tools"><a class="sheet-download" href="swiftui-uikit-interop.pdf" download>Download PDF</a> <a href="swiftui-uikit-interop.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/swiftui/swiftui-uikit-interop.tex">LaTeX source</a></p>
<section class="sheet-section">
<h2>How it works</h2>
<ul>
<li><strong><code>UIViewRepresentable</code></strong> (<code>UIViewControllerRepresentable</code> when you need VC  lifecycle — pickers, <code>SFSafariViewController</code>). Order: <code>makeCoordinator()</code> →  <code>makeUIView(context:)</code> → <code>updateUIView(_:context:)</code> × N →  <code>static dismantleUIView(_:coordinator:)</code> when the identity goes away.</li>
<li><strong><code>make</code></strong> = one-time setup (view, delegates, targets, gestures, observers).  <strong><code>update</code></strong> = <strong>idempotent sync</strong> of SwiftUI values onto the view, only when they  differ — it runs whenever inputs or anything it reads change.</li>
<li><strong><code>Context</code></strong>: <code>coordinator</code>, <code>environment</code> (apply <code>colorScheme</code>,  <code>isEnabled</code>…), <code>transaction</code> (<code>.animation != nil</code> ⇒ animate the UIKit change).</li>
<li><strong>Coordinator</strong> — <code>NSObject</code> subclass: delegate, data source, <code>@objc</code> target.  <em>Down</em>: properties / <code>@Binding</code> applied in <code>update</code>; <em>up</em>: the coordinator  writes the binding or calls a closure. Made once, but the struct is new each update ⇒ refresh  <code>context.coordinator.parent = self</code>.</li>
<li><strong>Sizing</strong> (16): <code>sizeThatFits(_:uiView:context:) -&gt; CGSize?</code> answers the  <code>ProposedViewSize</code>; <code>nil</code> = default (intrinsic size + hugging/compression  priorities, which is all you had before 16).</li>
<li><strong><code>UIHostingController(rootView:)</code></strong> — push, present, or embed as a <strong>child VC</strong>:  <code>addChild</code> → add <code>host.view</code> + constraints → <code>didMove(toParent:)</code>.  <code>sizingOptions</code> (16): <code>.intrinsicContentSize</code> / <code>.preferredContentSize</code>.  Update via an observable model (or <code>host.rootView = …</code>).</li>
<li><strong><code>UIHostingConfiguration</code></strong> (16) — SwiftUI in a collection/table cell:  <code>cell.contentConfiguration = UIHostingConfiguration { Row(item) }</code>; self-sizing,  <code>.margins</code>, no host VC per cell.</li>
<li><strong>Environment</strong>: a hosting controller starts a <em>new</em> environment — traits (colour scheme,  Dynamic Type) flow in, your <code>.environment(model)</code> / <code>.environmentObject</code> do  <strong>not</strong>: re-inject on <code>rootView</code>. <code>UITraitBridgedEnvironmentKey</code> (17) bridges  custom traits.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Example — two-way text field</h2>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Field</span>: <span class="hljs-title class_ inherited__">UIViewRepresentable</span> {
  <span class="hljs-meta">@Binding</span> <span class="hljs-keyword">var</span> text: <span class="hljs-type">String</span>
  <span class="hljs-keyword">func</span> <span class="hljs-title function_">makeCoordinator</span>() -&gt; <span class="hljs-type">Coordinator</span> { <span class="hljs-type">Coordinator</span>(<span class="hljs-keyword">self</span>) }
  <span class="hljs-keyword">func</span> <span class="hljs-title function_">makeUIView</span>(<span class="hljs-params">context</span>: <span class="hljs-type">Context</span>) -&gt; <span class="hljs-type">UITextField</span> {
    <span class="hljs-keyword">let</span> tf <span class="hljs-operator">=</span> <span class="hljs-type">UITextField</span>()              <span class="hljs-comment">// once per identity</span>
    tf.delegate <span class="hljs-operator">=</span> context.coordinator; <span class="hljs-keyword">return</span> tf }
  <span class="hljs-keyword">func</span> <span class="hljs-title function_">updateUIView</span>(<span class="hljs-keyword">_</span> <span class="hljs-params">tf</span>: <span class="hljs-type">UITextField</span>, <span class="hljs-params">context</span>: <span class="hljs-type">Context</span>) {
    context.coordinator.parent <span class="hljs-operator">=</span> <span class="hljs-keyword">self</span>   <span class="hljs-comment">// fresh binding</span>
    <span class="hljs-keyword">if</span> tf.text <span class="hljs-operator">!=</span> text { tf.text <span class="hljs-operator">=</span> text } }  <span class="hljs-comment">// guard: no echo</span>
  <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Coordinator</span>: <span class="hljs-title class_ inherited__">NSObject</span>, <span class="hljs-title class_ inherited__">UITextFieldDelegate</span> {
    <span class="hljs-keyword">var</span> parent: <span class="hljs-type">Field</span>
    <span class="hljs-keyword">init</span>(<span class="hljs-keyword">_</span> <span class="hljs-params">p</span>: <span class="hljs-type">Field</span>) { parent <span class="hljs-operator">=</span> p }
    <span class="hljs-keyword">func</span> <span class="hljs-title function_">textFieldDidChangeSelection</span>(<span class="hljs-keyword">_</span> <span class="hljs-params">tf</span>: <span class="hljs-type">UITextField</span>) {
      parent.text <span class="hljs-operator">=</span> tf.text <span class="hljs-operator">??</span> <span class="hljs-string">&quot;&quot;</span> } } }  <span class="hljs-comment">// up: UIKit -&gt; binding</span></code></pre>
</section>
<section class="sheet-section">
<h2>Lifecycle and the update loop</h2>
<figure class="sheet-figure"><img src="swiftui-uikit-interop-fig1.svg" width="329" height="258" alt="SwiftUI ↔ UIKit interop — figure 1" loading="lazy"></figure>
<p><strong>The other direction</strong> — SwiftUI as a child VC inside a <code>UIViewController</code>:</p>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">let</span> host <span class="hljs-operator">=</span> <span class="hljs-type">UIHostingController</span>(rootView: <span class="hljs-type">Card</span>().environment(model))
host.sizingOptions <span class="hljs-operator">=</span> .intrinsicContentSize      <span class="hljs-comment">// iOS 16</span>
addChild(host); view.addSubview(host.view)      <span class="hljs-comment">// 1. contain</span>
host.view.translatesAutoresizingMaskIntoConstraints <span class="hljs-operator">=</span> <span class="hljs-literal">false</span>
<span class="hljs-type">NSLayoutConstraint</span>.activate([ <span class="hljs-comment">/* pin edges */</span> ]) <span class="hljs-comment">// 2. lay out</span>
host.didMove(toParent: <span class="hljs-keyword">self</span>)                    <span class="hljs-comment">// 3. finish</span></code></pre>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap">Setup in <code>updateUIView</code> (adding gestures, subviews, observers) — duplicated on every  update. <code>make</code> sets up, <code>update</code> syncs.</li>
<li class="trap">Representable behind a changing <code>.id</code> or unstable <code>ForEach</code> id — <code>makeUIView</code>  runs again: scroll position, first responder, player state lost.</li>
<li class="trap"><code>UIHostingController</code> in a cell — wrong/zero height; use  <code>UIHostingConfiguration</code>, or <code>sizingOptions = .intrinsicContentSize</code> + pinned edges.</li>
<li class="trap">Retain cycles: a closure stored on a long-lived UIKit object capturing the coordinator (and it the  view). UIKit <code>delegate</code> properties are <code>weak</code>, so plain delegation is safe.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<p><strong>“Make once, update often, coordinate back.”</strong> <code>update</code> must be safe to call 100 times in a row.</p>
</section>
