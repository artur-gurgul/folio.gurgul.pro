<p class="sheet-kicker">swiftui · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> Since iOS 16 navigation is <strong>data</strong>: a <code>NavigationStack</code> renders a <strong>path</strong> (an
array of <code>Hashable</code> values) that <em>you</em> own; <code>navigationDestination(for:)</code> maps each value
<em>type</em> to a screen. Push = append, pop = remove, deep link = assign a whole path.</p>
<p class="sheet-tools"><a class="sheet-download" href="swiftui-navigation.pdf" download>Download PDF</a> <a href="swiftui-navigation.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/swiftui/swiftui-navigation.tex">LaTeX source</a></p>
<section class="sheet-section">
<h2>How it works</h2>
<ul>
<li><strong><code>NavigationStack(path: root:)</code></strong> (16) — the path is <code>[Route]</code> (one type) or  <strong><code>NavigationPath</code></strong>: a <em>type-erased</em> list of <code>Hashable</code> values, so one stack  can hold <code>Item</code>, <code>User</code>, <code>Int</code>…, each routed by its own destination.</li>
<li><strong><code>NavigationLink(_:value:)</code></strong> pushes a <em>value</em>, not a view — lazy, decoupled,  programmatic. <code>NavigationLink { Dest() } label: {}</code> (view-based) still works but cannot be  driven from the path.</li>
<li><strong><code>.navigationDestination(for: T.self) { v in … }</code></strong> — <strong>one</strong> per type per stack,  inside the stack, on a view that is always there (not in a lazy row).  iOS 17 adds <code>navigationDestination(item:)</code>; <code>(isPresented:)</code> is 16.</li>
<li><strong>Programmatic</strong>: push <code>path.append(x)</code>; pop <code>path.removeLast()</code>;  pop-to-root <code>path = []</code> / <code>path.removeAll()</code> for an array, or  <code>path.removeLast(path.count)</code> / <code>path = NavigationPath()</code> — <code>NavigationPath</code>  has <em>no</em> <code>removeAll</code>.</li>
<li><strong>Restoration</strong>: if every element is <code>Codable</code>, <code>path.codable</code> gives a  <code>NavigationPath.CodableRepresentation</code> (else <code>nil</code>); encode to <code>@SceneStorage</code>  / disk, rebuild with <code>NavigationPath(rep)</code>.</li>
<li><strong><code>NavigationSplitView</code></strong> (16) — 2 columns (<code>sidebar</code>, <code>detail</code>) or 3  (+<code>content</code>); selection drives the next column; <code>columnVisibility</code> binding;  on compact width it <strong>collapses into a stack</strong> (<code>preferredCompactColumn</code>, 17).</li>
<li><strong>Modals</strong>: <code>.sheet</code> (card, swipe-dismiss, <code>.presentationDetents([.medium,
 .large])</code> 16); <code>.fullScreenCover</code> (no swipe-dismiss); <code>.popover</code> (bubble on iPad/Mac,  a sheet on compact unless <code>.presentationCompactAdaptation</code>, 16.4). Each takes  <code>isPresented:</code> (<code>Bool</code>) or <code>item:</code> (<code>Identifiable?</code> — preferred when  content depends on data). Block swipe: <code>.interactiveDismissDisabled()</code>.</li>
<li><strong><code>@Environment(\.dismiss)</code></strong> (15) — pops the pushed view <em>or</em> closes the  sheet/cover that presented this view: the <em>nearest</em> context.</li>
<li><strong>Tabs</strong>: one <code>NavigationStack</code> <em>per tab</em>, each with its own path.</li>
<li><strong>Router</strong>: an <code>@Observable</code> object owning <code>path</code> (+ sheet state), put in the  environment, so any view calls <code>router.show(.x)</code> and <code>.onOpenURL</code> maps a URL to routes.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Example — router + deep link</h2>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">enum</span> <span class="hljs-title class_">Route</span>: <span class="hljs-title class_ inherited__">Hashable</span>, <span class="hljs-title class_ inherited__">Codable</span> { <span class="hljs-keyword">case</span> item(<span class="hljs-type">Int</span>), user(<span class="hljs-type">String</span>) }

}
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">Root</span>: <span class="hljs-title class_ inherited__">View</span> {

  <span class="hljs-keyword">var</span> body: <span class="hljs-keyword">some</span> <span class="hljs-type">View</span> {

</section>
<section class="sheet-section">
<h2>The stack <em>is</em> the path</h2>
<figure class="sheet-figure"><img src="swiftui-navigation-fig1.svg" width="306" height="235" alt="SwiftUI navigation — figure 1" loading="lazy"></figure>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap"><code>NavigationLink(isActive:)</code> / <code>(tag:selection:)</code> are <strong>deprecated</strong> (iOS 16), and so  is <code>NavigationView</code>: one <code>Bool</code> per link, buggy pops, no restoration.</li>
<li class="trap"><code>navigationDestination</code> inside a <code>List</code>/<code>LazyVStack</code> row, or two for one type  — “no matching destination” or the wrong screen. Declare once, on a stable ancestor.</li>
<li class="trap"><code>.sheet(isPresented:)</code> + separate <code>@State var selected</code> — can present stale/<code>nil</code>  data. Use <code>.sheet(item: $selected)</code>.</li>
<li class="trap"><code>dismiss()</code> inside a <code>NavigationStack</code> <em>within</em> a sheet pops the inner stack,  it does not close the sheet — pass a closure/binding or read <code>dismiss</code> at sheet level.</li>
<li class="trap"><code>.navigationTitle</code> goes on the <em>content</em>, not on <code>NavigationStack</code>; a split view  tested only on iPad shows a blank detail when collapsed on iPhone.</li>
<li class="trap">Nesting a <code>NavigationStack</code> in a pushed screen = two bars / broken back stack.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<p><strong>“Push values, not views.”</strong> Path = <code>[Hashable]</code>; destination = <em>per type</em>; <code>item:</code> beats <code>isPresented:</code>; <code>dismiss</code> = nearest context.</p>
</section>
