v class="content folio-page"><h1 class="title">Lists, lazy stacks &amp; scrolling</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">swiftui · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> <code>VStack</code> builds <em>every</em> child now; <code>LazyVStack</code> builds a row only as it nears
the viewport (<strong>no reuse</strong>); <code>List</code> reuses platform cells but collects <strong>all ids up front</strong>.
<strong><code>ForEach</code> ids</strong> decide which state, animation and callbacks belong to which datum — and since
iOS 17/18 the scroll view <em>reports</em> position, snapping, geometry and visibility declaratively.</p>
<p class="sheet-tools"><a class="sheet-download" href="swiftui-lists-scroll-lazy.pdf" download>Download PDF</a> <a href="swiftui-lists-scroll-lazy.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/swiftui/swiftui-lists-scroll-lazy.tex">LaTeX source</a></p>
<section class="sheet-section">
<h2>How it works</h2>
<ul>
<li><strong>Creation</strong>: <code>VStack</code> = exact layout, all children loaded at once. <code>LazyV/HStack</code>,  <code>LazyV/HGrid</code> (14) create rows on demand; unseen rows’ sizes are <em>estimated</em>. Apple:  plain stack first, lazy when profiling says so.</li>
<li><strong><code>List</code></strong> visits the whole collection first: <em>rows = elements <span class="math">×</span> views per
 element</em> (WWDC23). A variable count (<code>if</code> in <code>ForEach</code>) or <code>AnyView</code> forces it to  <strong>build every row</strong> just to count them — filter the <em>data</em>, not the views.</li>
<li><strong>Ids</strong>: <code>Identifiable</code> or <code>id: \.key</code>. <code>id: \.self</code>  hashes the whole value <span class="math">⇒</span> editing a field = new id = row destroyed + re-inserted.  Indices shift on insert/delete <span class="math">⇒</span> state lands on the wrong row. Duplicate ids = undefined.</li>
<li><strong>Row lifecycle</strong>: <code>onAppear</code> / <code>.task</code> run when a row is shown;  <code>onDisappear</code> + <em>task cancelled</em> when it leaves; <strong>again on every scroll-back</strong>.  Keeping an off-screen row’s <code>@State</code> is an implementation detail — durable row state  lives in the model, keyed by id.</li>
<li><strong>Position</strong> (17): <code>.scrollPosition(id: $topID, anchor:)</code> — two-way: reads the  top-most target’s id, write it to scroll; <strong>needs <code>.scrollTargetLayout()</code></strong> on the stack.  18: <code>ScrollPosition</code> value + <code>.scrollPosition($pos)</code>: <code>scrollTo(id:)</code>,  <code>scrollTo(edge: .bottom)</code>, <code>viewID(type:)</code>. Older: <code>ScrollViewReader</code>.</li>
<li><strong>Snapping</strong> (17): <code>.scrollTargetBehavior(.paging)</code> = container-sized pages;  <code>.viewAligned</code> = settle on views of the <code>scrollTargetLayout</code>; or your own  <code>ScrollTargetBehavior</code>.</li>
<li><strong>Observing</strong> (18): <code>onScrollGeometryChange(for:of:action:)</code> maps  <code>ScrollGeometry</code> (<code>contentOffset</code>, <code>contentSize</code>, <code>contentInsets</code>,  <code>containerSize</code>, <code>visibleRect</code>) to an <code>Equatable</code>; <code>action(old, new)</code> fires  <strong>only when that value changes</strong>. <code>onScrollVisibilityChange(threshold: 0.5)</code> per view;  <code>onScrollPhaseChange</code>: <code>idle / interacting / decelerating / animating</code>.</li>
<li><strong>Look</strong> (17): <code>contentMargins(_:_:for: .scrollContent | .scrollIndicators)</code> insets  content inside the scroll area (still scrolls edge to edge); <code>scrollTransition { c, phase in }</code>  (<code>.topLeading / .identity / .bottomTrailing</code>); <code>visualEffect { c, proxy in }</code> —  both return a <code>VisualEffect</code>: <strong>no layout pass</strong>, no <code>GeometryReader</code>.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Example — snapping, paged feed</h2>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-type">ScrollView</span> {
  <span class="hljs-type">LazyVStack</span>(spacing: <span class="hljs-number">8</span>) {
    <span class="hljs-type">ForEach</span>(feed.items) { item <span class="hljs-keyword">in</span>          <span class="hljs-comment">// stable entity id</span>
      <span class="hljs-type">Row</span>(item: item)
        .onScrollVisibilityChange { seen <span class="hljs-keyword">in</span>  <span class="hljs-comment">// 18, &gt; 50 %</span>
          <span class="hljs-keyword">if</span> seen { log.impression(item.id) } }
    }
    <span class="hljs-keyword">if</span> feed.hasMore {                      <span class="hljs-comment">// sentinel row</span>
      <span class="hljs-type">ProgressView</span>()
        .task(id: feed.items.count) { <span class="hljs-keyword">await</span> feed.loadNext() }
    }
  }
  .scrollTargetLayout()                    <span class="hljs-comment">// rows = targets</span>
}
.scrollPosition(id: <span class="hljs-variable">$topID</span>)                <span class="hljs-comment">// 17, read + write</span>
.scrollTargetBehavior(.viewAligned)
.contentMargins(.horizontal, <span class="hljs-number">16</span>, for: .scrollContent)
.onScrollGeometryChange(for: <span class="hljs-type">Bool</span>.<span class="hljs-keyword">self</span>) { g <span class="hljs-keyword">in</span>
  g.contentOffset.y <span class="hljs-operator">&gt;</span> <span class="hljs-number">800</span> } action: { <span class="hljs-keyword">_</span>, far <span class="hljs-keyword">in</span> showTop <span class="hljs-operator">=</span> far }</code></pre>
</section>

<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap"><code>ForEach(items, id: \.self)</code> on editable structs, <code>UUID()</code> created in <code>body</code>,  or <code>indices</code> — lost row state, wrong row animates, duplicate-id warnings.</li>
<li class="trap"><code>if item.visible { Row }</code> inside a <code>List</code>’s <code>ForEach</code>, or <code>AnyView</code> rows —  every row built to learn the count. Filter the array.</li>
<li class="trap"><code>.onAppear { load() }</code> on rows = duplicate requests on scroll-back; guard  <code>isLoading</code> + cursor, dedupe appended ids.</li>
<li class="trap">Sentinel with plain <code>.task</code> may stay mounted after a page lands — no re-fire;  <code>.task(id: items.count)</code>.</li>
<li class="trap"><code>scrollPosition(id:)</code> without <code>scrollTargetLayout()</code> — binding never updates.</li>
<li class="trap">A <code>GeometryReader</code> per row to read offsets — a layout pass each; use  <code>onScrollGeometryChange</code> / <code>visualEffect</code>. <code>onScrollGeometryChange</code> watches the  <em>first</em> scroll view only.</li>
<li class="trap">Transform returns raw <code>contentOffset</code> <span class="math">⇒</span> <code>action</code> every frame; map to a <code>Bool</code> / page.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<h3 class="sheet-hd">“Lazy builds late, List counts early; ask the scroll view, don’t measure it.”</h3>
</section>
