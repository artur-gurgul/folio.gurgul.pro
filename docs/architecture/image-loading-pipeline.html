><div class="scroll"></div></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">Image loading pipeline — memory, disk, network, decode</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">architecture · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> A request walks <strong>memory</strong> (decoded, <em>sized</em> bitmaps) <span class="math">→</span> <strong>disk</strong>
(encoded bytes) <span class="math">→</span> <strong>network</strong> (deduplicated, prioritised, cancellable) and comes back
through <strong>decode + downsample off the main thread</strong>. What matters: the cache <strong>key</strong>,
the <strong>memory maths</strong>, <strong>one download per key</strong> with cancellation only when the
<em>last</em> subscriber leaves, an <strong>identity check</strong> before assigning, and <strong>prefetch</strong>
at low priority.</p>
<p class="sheet-tools"><a class="sheet-download" href="image-loading-pipeline.pdf" download>Download PDF</a> <a href="image-loading-pipeline.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/architecture/image-loading-pipeline.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="image-loading-pipeline-fig1.svg" width="620" height="175" class="wide" alt="Image loading pipeline — memory, disk, network, decode — figure 1" loading="lazy"></figure>

<section class="sheet-section">
<h2>How it works</h2>
<ul>
<li><strong>Key</strong> = URL + target <em>pixel</em> size (+ transforms: crop, rounding, blur). Same  URL at 2 sizes = 2 memory entries; disk keeps one set of bytes per URL.</li>
<li><strong>Memory</strong>: <code>NSCache&lt;Key, UIImage&gt;</code> — thread-safe, keys not copied, evicts  on its own under pressure. Set <code>totalCostLimit</code> with cost = decoded bytes;  <code>countLimit</code> alone lets 10 huge images blow the budget. Apple: eviction order “not  guaranteed”, limit “not strict” — so not an LRU; size it, don’t rely on order.</li>
<li><strong>Disk</strong>: encoded bytes in <code>Caches/</code> (purgeable, not backed up); index of  size + last-access; sweep to a byte cap + max age, off main (launch, background); write  atomically. <strong><code>URLCache</code> vs custom</strong>: <code>URLCache</code> gives HTTP semantics  (<code>Cache-Control</code>, <code>ETag</code> revalidation) but only stores 2xx responses whose  headers allow it and that are <span class="math">≤</span> ~5 % of its disk capacity, and you  do not choose eviction. Custom: your key, LRU, size cap, pinning of prefetched  items. Neither holds a <em>decoded</em> tier.</li>
<li><strong>Network</strong>: <strong>coalesce</strong> — N cells asking for one key share one job;  each caller is a subscriber; cancel the transfer only when the count reaches 0.  <strong>Priority</strong>: <code>URLSessionTask.priority</code> (0–1; <code>lowPriority</code> 0.25,  <code>highPriority</code> 0.75; only a <em>hint</em>) — visible high, prefetch low. Cap concurrency. Ask the CDN  for the size you need (<code>?w=390</code>, <code>Accept: image/webp</code>) — the cheapest byte is  the one never sent.</li>
<li><strong>Decode</strong>: off main on a <em>bounded</em> queue (WWDC18: a serial queue, not  one global-queue block per image <span class="math">→</span> thread explosion). ImageIO  <code>CGImageSourceCreateThumbnailAtIndex</code> + <code>kCGImageSourceThumbnailMaxPixelSize</code>,  or iOS 15 <code>byPreparingThumbnail(ofSize:)</code>. A plain <code>UIImage(data:)</code> decodes  <em>later</em>, full size, on main, in the commit’s prepare phase.</li>
<li><strong>Cancellation</strong>: <code>prepareForReuse</code> / <code>didEndDisplaying</code>; SwiftUI  <code>.task(id: url)</code> cancels on disappear or id change. Then <strong>check identity</strong>  before assigning — a late result must not land in a reused cell.</li>
<li><strong>Prefetch</strong>: <code>UICollectionViewDataSourcePrefetching</code> (iOS 10)  <code>prefetchItemsAt</code> / <code>cancelPrefetchingForItemsAt</code>; it is a <em>hint</em> —  not called for every row on a fast fling, so display must work without it. SwiftUI  lazy stacks have no prefetch hook: warm row <span class="math">n+k</span> from row <span class="math">n</span>’s <code>onAppear</code>.</li>
<li><strong>Placeholders</strong>: dominant colour or <strong>BlurHash</strong> (a ~20–30  char string in the JSON, decoded to a tiny image) <span class="math">→</span> progressive JPEG  (<code>CGImageSourceCreateIncremental</code>) <span class="math">→</span> final. Fade in only on a network load,  never on a memory hit (flicker on every scroll).</li>
<li><strong>Formats</strong>: HEIC iOS 11 · WebP decode iOS 14 · AVIF iOS 16<span class="unverified">(unverified)</span> ·  JPEG XL iOS 17. Check at runtime: <code>CGImageSourceCopyTypeIdentifiers()</code>.  Animated GIF/WebP = one bitmap per frame in memory.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Example — the cell side</h2>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PhotoCell</span>: <span class="hljs-title class_ inherited__">UICollectionViewCell</span> {    <span class="hljs-comment">// @MainActor</span>
  <span class="hljs-keyword">private</span> <span class="hljs-keyword">var</span> load: <span class="hljs-type">Task</span>&lt;<span class="hljs-type">Void</span>, <span class="hljs-type">Never</span>&gt;?; <span class="hljs-keyword">private</span> <span class="hljs-keyword">var</span> shownID: <span class="hljs-type">Photo</span>.<span class="hljs-type">ID</span>?
  <span class="hljs-keyword">func</span> <span class="hljs-title function_">show</span>(<span class="hljs-keyword">_</span> <span class="hljs-params">p</span>: <span class="hljs-type">Photo</span>, <span class="hljs-keyword">_</span> <span class="hljs-params">pipe</span>: <span class="hljs-type">ImagePipeline</span>) {
    shownID <span class="hljs-operator">=</span> p.id; imageView.image <span class="hljs-operator">=</span> p.blurHash  <span class="hljs-comment">// instant</span>
    <span class="hljs-keyword">let</span> px <span class="hljs-operator">=</span> <span class="hljs-built_in">max</span>(bounds.width, bounds.height)
             <span class="hljs-operator">*</span> traitCollection.displayScale      <span class="hljs-comment">// PIXELS</span>
    load <span class="hljs-operator">=</span> <span class="hljs-type">Task</span> {                                 <span class="hljs-comment">// inherits main actor</span>
      <span class="hljs-keyword">let</span> img <span class="hljs-operator">=</span> <span class="hljs-keyword">try?</span> <span class="hljs-keyword">await</span> pipe.image(p.url, maxPixel: px, .high)
      <span class="hljs-keyword">guard</span> <span class="hljs-operator">!</span><span class="hljs-type">Task</span>.isCancelled, shownID <span class="hljs-operator">==</span> p.id, <span class="hljs-keyword">let</span> img <span class="hljs-keyword">else</span> { <span class="hljs-keyword">return</span> }
      imageView.image <span class="hljs-operator">=</span> img }                     <span class="hljs-comment">// right cell, main</span>
  }
  <span class="hljs-keyword">override</span> <span class="hljs-keyword">func</span> <span class="hljs-title function_">prepareForReuse</span>() {
    <span class="hljs-keyword">super</span>.prepareForReuse(); load<span class="hljs-operator">?</span>.cancel(); imageView.image <span class="hljs-operator">=</span> <span class="hljs-literal">nil</span> }
}</code></pre>
<p><code>pipe.image</code> must translate the caller’s cancellation into
“subscriber <span class="math">-</span>1” — cancelling the <em>shared</em> task would kill the other cells’ load.</p>
</section>
<section class="sheet-section">
<h2>Memory maths — say the numbers</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>image</strong></th><th><strong>decoded</strong></th><th><strong>× 60 cells</strong></th></tr>
</thead>
<tbody>
<tr><td>12 MP photo, 4032×3024</td><td>4032·3024·4 = <strong>48.8 MB</strong></td><td>2.9 GB — jetsam</td></tr>
<tr><td>3-col grid, 130 pt @3x = 390 px</td><td>390·390·4 = <strong>608 KB</strong></td><td>36 MB</td></tr>
<tr><td>same, extended range (8 B/px)</td><td>1.2 MB</td><td>73 MB</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap">Memory cache of <em>encoded</em> data or full-size <code>UIImage(data:)</code> — decode on main,  every first display, at full resolution.</li>
<li class="trap">Cancelling the download when <em>one</em> of three cells showing it is reused.</li>
<li class="trap">Prefetch at default priority — it competes with what is on screen.</li>
<li class="trap">50 decodes dispatched at once on global queues — thread explosion, worse latency.</li>
<li class="trap">“Just use <code>URLCache</code>” — no decoded tier, the ~5 % size rule,  eviction you do not control.</li>
<li class="trap">Fade-in animation on a memory hit; no identity check <span class="math">→</span> wrong image flashes.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<p><strong>Key · tier · dedupe · decode small off main · check identity · prefetch low.</strong> Memory = pixels × 4; disk = bytes; network = the size you need.</p>
</section>
