<p class="sheet-kicker">c · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> <strong>Undefined behaviour</strong> is behaviour “for which this document imposes no
requirements” (C23 3.5.3). The optimiser <strong>assumes it never happens</strong>, so checks vanish and
loops change shape — often only at <code>-O2</code>, far from the bug. <strong>Building</strong> = per
<em>translation unit</em> preprocess → compile → assemble to a <code>.o</code>; then the <strong>linker</strong>
resolves every symbol to one definition, places the sections and patches the addresses.</p>

<section class="sheet-section">
<figure class="sheet-figure"><img src="c-undefined-behavior-and-build-fig1.svg" width="631" height="139" class="wide" alt="Undefined behaviour &amp; the C build — preprocess, compile, link — figure 1" loading="lazy"></figure>

<section class="sheet-section">
<h2>Four kinds of behaviour (C23 3.5)</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>kind</strong></th><th><strong>the standard</strong></th><th><strong>its own example</strong></th></tr>
</thead>
<tbody>
<tr><td><strong>undefined</strong></td><td><strong>no requirements</strong>; J.2 lists 221</td><td>null pointer dereference</td></tr>
<tr><td>unspecified</td><td><span class="math">≥</span>2 options, choice not documented</td><td>order of evaluating arguments</td></tr>
<tr><td>impl.-defined</td><td>unspecified, choice documented</td><td><code>&gt;&gt;</code> of a negative value</td></tr>
<tr><td>locale-specific</td><td>per locale, documented</td><td><code>islower</code> beyond a–z</td></tr>
</tbody>
</table></p>
<p>A <em>constraint</em> violation needs a diagnostic even if it is also UB (5.1.1.3); UB alone needs none. C23 note 3: observable behaviour <em>before</em> the UB still happens as specified.</p>
</section>
<section class="sheet-section">
<h2>The catalogue</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>UB</strong><span class="c-sheetgrey"> (clause)</span></th><th><strong>example</strong></th><th><strong>defined instead</strong></th></tr>
</thead>
<tbody>
<tr><td>signed overflow<span class="c-sheetgrey"> 6.5.1</span></td><td><code>INT_MAX + 1</code>, <code>INT_MIN / -1</code></td><td>unsigned wraps; <code>ckd_add</code></td></tr>
<tr><td>shift<span class="c-sheetgrey"> 6.5.8</span></td><td>count <span class="math">&lt;</span>0 or <span class="math">≥</span> width; <code>1 &lt;&lt; 31</code>; <code>-1 &lt;&lt; 1</code></td><td><code>1u &lt;&lt; 31</code></td></tr>
<tr><td>divide by 0<span class="c-sheetgrey"> 6.5.6</span></td><td><code>x / 0</code>, <code>x % 0</code></td><td>float: ±∞, NaN (Annex F)</td></tr>
<tr><td>pointer maths<span class="c-sheetgrey"> 6.5.7</span></td><td>past one-past-the-end, even unread; <code>p - q</code>, <code>p &lt; q</code> across objects</td><td><code>==</code> across objects</td></tr>
<tr><td>lifetime<span class="c-sheetgrey"> 6.2.4</span></td><td>use after <code>free</code>; a returned <code>&amp;local</code></td><td><code>p = NULL</code> after <code>free</code></td></tr>
<tr><td>uninitialised<span class="c-sheetgrey"> 6.3.2.1</span></td><td><code>int x; return x;</code> (no <code>&amp;x</code>)</td><td><code>int x = {};</code></td></tr>
<tr><td>null<span class="c-sheetgrey"> 3.5.3</span></td><td><code>p-&gt;f</code> with <code>p == NULL</code></td><td>test before first use</td></tr>
<tr><td>effective type<span class="c-sheetgrey"> 6.5.1</span></td><td><code>*(uint32_t *)&amp;f</code>; <code>char</code> may alias all</td><td><code>memcpy</code>; a union</td></tr>
<tr><td>misaligned<span class="c-sheetgrey"> 6.3.2.3</span></td><td><code>(uint32_t *)(buf + 1)</code>: the cast</td><td><code>memcpy</code> to a local</td></tr>
<tr><td>unsequenced<span class="c-sheetgrey"> 6.5.1</span></td><td><code>i = ++i + 1;</code> <code>a[i++] = i;</code></td><td>one write per statement</td></tr>
<tr><td>data race<span class="c-sheetgrey"> 5.1.2.5</span></td><td>2 threads, <span class="math">≥</span>1 write, no sync</td><td><code>_Atomic</code>, mutex</td></tr>
<tr><td>string literal<span class="c-sheetgrey"> 6.4.5</span></td><td><code>char *s = &quot;hi&quot;; s[0] = &#39;H&#39;;</code></td><td><code>char s[] = &quot;hi&quot;;</code></td></tr>
<tr><td>2 declarations<span class="c-sheetgrey"> 6.2.7</span></td><td><code>extern long n;</code> vs <code>int n;</code></td><td>one header for both</td></tr>
<tr><td>fn pointer<span class="c-sheetgrey"> 6.3.2.3</span></td><td>call through another function type</td><td>a wrapper</td></tr>
<tr><td>no <code>return</code><span class="c-sheetgrey"> 6.9.2</span></td><td>caller uses the missing value</td><td>only <code>main</code> gets 0</td></tr>
</tbody>
</table></p>
<p><strong>Not UB, same effect</strong>: a loop whose condition is not constant and that does no I/O, <code>volatile</code> or atomic access may be <em>assumed to terminate</em> (6.8.6.1) — empty ones are deleted; <code>while (1)</code> is not.</p>
</section>
<section class="sheet-section">
<h2>What the optimiser does with it</h2>
<figure class="sheet-figure"><img src="c-undefined-behavior-and-build-fig2.svg" width="300" height="41" alt="Undefined behaviour &amp; the C build — preprocess, compile, link — figure 2" loading="lazy"></figure>
<ul>
<li>Overflow “cannot happen” ⇒ <code>x + 1 &gt; x</code> → <code>true</code>, <code>x * 2 / 2</code> → <code>x</code>,  <code>for (i = 0; i &lt;= n; i++)</code> runs exactly <span class="math">n+1</span> times. Type rules ⇒ a <code>float</code> store  cannot change a <code>float *</code>: a store loop becomes one <code>memset</code> (Lattner, 2011).</li>
<li>Linux 2.6.30 <code>tun</code> (CVE-2009-1897): <code>tun-&gt;sk</code> read before <code>if (!tun)</code>; GCC  deleted the test → local privilege gain.</li>
<li>Fine at <code>-O0</code>, broken at <code>-O2</code> or with the next compiler = latent UB. Fix the code;  a lower <code>-O</code> only hides it.</li>
</ul>
<p><table class="sheet-table">
<thead>
<tr><th><strong>GCC flag</strong></th><th><strong>switches the assumption off</strong></th></tr>
</thead>
<tbody>
<tr><td><code>-ftrapv</code></td><td>trap on signed overflow</td></tr>
<tr><td><code>-fwrapv</code> · <code>-fwrapv-pointer</code></td><td>signed <span class="math">+ - ×</span> · pointer <span class="math">+ -</span> wrap</td></tr>
<tr><td><code>-fno-strict-overflow</code></td><td>both of the above</td></tr>
<tr><td><code>-fno-strict-aliasing</code></td><td>no type-based aliasing (on at <code>-O2 -O3 -Os</code>)</td></tr>
<tr><td><code>-fno-delete-null-pointer-checks</code></td><td>keep null tests (deleted by default on most targets)</td></tr>
</tbody>
</table></p>
<p>Linux builds with the last three: a GCC <em>dialect</em>, not C.</p>
</section>
<section class="sheet-section">
<h2>C23: new tools, same rules</h2>
<p>Two’s complement is now the only representation — signed overflow is <strong>still</strong> UB. <code>&lt;stdckdint.h&gt;</code>: <code>ckd_add(&amp;r, a, b)</code> (<code>_sub</code>, <code>_mul</code>) computes as if infinitely wide, stores the wrapped result, returns <code>true</code> on overflow. New: <code>unreachable()</code> (reaching it is UB), <code>nullptr</code>, <code>typeof</code>, <code>memset_explicit</code>, <code>[[nodiscard]]</code>, <code>[[fallthrough]]</code>, <code>[[maybe_unused]]</code>. Newly UB: <code>realloc(p, 0)</code>. Gone: K&amp;R definitions; <code>int f();</code> means <code>f(void)</code>. GCC 15+ defaults to <code>-std=gnu23</code> (Clang 23 still <code>gnu17</code>); GCC 14 turned implicit declarations, implicit <code>int</code>, int-conversion and incompatible pointers into errors (<code>-fpermissive</code> undoes it).</p>
</section>
<section class="sheet-section">
<h2>Catch it</h2>
<p><code>-Wall -Wextra</code> is not “all”: add <code>-Wconversion -Wshadow -Wundef -Wcast-align -Wvla
-Wformat=2 -Wnull-dereference</code> (the last only when optimising). <code>-Wall</code> brings <code>-Wstrict-aliasing=3</code> and (GCC 15) <code>-Wheader-guard</code>. Static analysis: <code>gcc -fanalyzer</code> (GCC 10+), <code>clang --analyze</code>, <code>scan-build make</code>.</p>
<p><table class="sheet-table">
<thead>
<tr><th><code>-fsanitize=</code></th><th><strong>finds — only on paths a run executes</strong></th><th><strong>cost · limits</strong></th></tr>
</thead>
<tbody>
<tr><td><code>address</code></td><td>out of bounds (heap, stack, globals), use after free / return / scope, double free; leaks (Linux)</td><td><span class="math">∼</span>2<span class="math">×</span>; not with <code>thread</code></td></tr>
<tr><td><code>undefined</code></td><td>signed overflow, shift, ÷0, null, misalignment, bounds — not unsigned wrap</td><td>reports, continues; <code>-fsanitize-trap</code></td></tr>
<tr><td><code>thread</code></td><td>data races</td><td>5–15<span class="math">×</span> CPU</td></tr>
<tr><td><code>memory</code></td><td>reads of uninitialised memory</td><td>Clang, 3<span class="math">×</span>; instrument all</td></tr>
</tbody>
</table></p>
<p><strong>Ship hardened</strong> (OpenSSF, Aug 2026): <code>-D_FORTIFY_SOURCE=3</code> (<code>-O1</code>+), <code>-fstack-protector-strong</code>, <code>-fstack-clash-protection</code>, <code>-ftrivial-auto-var-init=zero</code>, <code>-Wl,-z,relro,-z,now</code>, the three <code>-fno-…</code> above; GCC 14+: <code>-fhardened</code>, most in one flag.</p>
</section>
<section class="sheet-section">
<h2>Optimisation levels</h2>
<p><table class="sheet-table">
<tbody>
<tr><td><code>-O0</code></td><td>default: fastest compile, most debuggable · <code>-Og</code>: GCC’s “edit-compile-debug” level, ESP-IDF’s default; Clang: like <code>-O1</code></td></tr>
<tr><td><code>-O2</code></td><td>GCC: all that does not trade size for speed; strict aliasing; loop vectorising</td></tr>
<tr><td><code>-O3</code></td><td>+ slower or larger passes · <code>-Os</code>, <code>-Oz</code>: for size, harder for size</td></tr>
<tr><td><code>-Ofast</code></td><td><code>-O3 -ffast-math</code> — not IEEE; deprecated in Clang 19</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Linkage, archives, shared libraries</h2>
<p><strong>External</strong> (file-scope default): one entity across all TUs. <strong>Internal</strong>: <code>static</code> at file scope. <strong>None</strong>: locals (<code>static</code> there = storage). A used external name needs <strong>exactly one</strong> external definition (6.9.1; C++: the ODR): two → <em>multiple
definition</em>, none → <em>undefined reference</em>.</p>
<ul>
<li>Header <em>declares</em> <code>extern int count;</code>, one <code>.c</code> <em>defines</em> it.  <code>int count;</code> in a header is a <strong>tentative definition</strong> per TU — merged as  “common” until GCC 10 / Clang 11 made <code>-fno-common</code> the default.</li>
<li>C <code>inline</code> with no <code>extern</code> declaration in the TU is only an inline definition:  an un-inlined call (<code>-O0</code>) needs an external one elsewhere. Headers: <code>static inline</code>.</li>
<li><code>__attribute__((weak))</code>: a default any normal definition overrides. LTO  (<code>-flto</code>, <code>=thin</code>): objects carry IR, the link optimises across TUs.</li>
</ul>
<figure class="sheet-figure"><img src="c-undefined-behavior-and-build-fig3.svg" width="279" height="47" alt="Undefined behaviour &amp; the C build — preprocess, compile, link — figure 3" loading="lazy"></figure>
<ul>
<li>Users before providers; cycles need <code>--start-group … --end-group</code> (“significant  performance cost”). lld remembers every archive seen; <code>--warn-backrefs</code> flags lines  GNU ld would reject.</li>
<li><code>.so</code>/<code>.dylib</code>/<code>.dll</code>: mapped by the dynamic loader at run time, shared,  replaceable; <code>-fPIC</code>; <code>-fvisibility=hidden</code> exports only what you mark.</li>
<li>ESP-IDF builds with <code>-ffunction-sections -fdata-sections -Wl,--gc-sections</code>. In ROM:  <code>.data</code> stored in flash (LMA), copied to RAM (VMA) at start-up.  <code>-Wl,-Map=app.map</code>, <code>idf.py size-components</code>: who uses the flash.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Headers &amp; macros</h2>
<pre class="sheet-code"><code class="hljs language-plaintext">#ifndef UART_H                  /* guard: the whole file */
#define UART_H
#define SQ(x) ((x) * (x))       // parenthesise args AND body
#define SWAP(a, b) do { int t_ = (a); (a) = (b); (b) = t_; } while (0)
static inline int sq(int x) { return x * x; }  // typed, x once
#endif</code></pre>
<p><code>SQ(i++)</code>: two unsequenced writes, UB. <code>do{}while(0)</code> lets <code>if (c) SWAP(x, y); else</code> parse. <code>#if FOO</code>, <code>FOO</code> undefined: silently 0 (<code>-Wundef</code>). <code>#pragma once</code> is not in every preprocessor.</p>
<p><strong>Remember: UB is a promise to the optimiser; <code>-O0</code> only hides a broken one.</strong></p>
</section>
