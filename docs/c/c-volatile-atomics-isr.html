">volatile · _Atomic · interrupts — sharing state safely in C</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">c · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> <code>volatile</code> binds only the <strong>compiler</strong>: every access in the source is
performed, none merged or dropped. It gives <strong>no atomicity</strong>, <strong>no ordering</strong> of
other memory and <strong>no CPU barrier</strong>. State shared with an interrupt, a signal handler or
another CPU needs a lock-free <code>_Atomic</code>, a <strong>critical section</strong>, or a lock.</p>
<p class="sheet-tools"><a class="sheet-download" href="c-volatile-atomics-isr.pdf" download>Download PDF</a> <a href="c-volatile-atomics-isr.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/c/c-volatile-atomics-isr.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="c-volatile-atomics-isr-fig1.svg" width="616" height="104" class="wide" alt="volatile · _Atomic · interrupts — sharing state safely in C — figure 1" loading="lazy"></figure>

<section class="sheet-section">
<h2>What <code>volatile</code> guarantees (C23)</h2>
<ul>
<li>A volatile access is a <em>side effect</em> (5.1.2.4): performed strictly as the abstract  machine says — never dropped, merged or added — and part of observable behaviour; what  counts as one access is implementation-defined (6.7.4.1). Meant for memory-mapped I/O  and data changed by an “asynchronously interrupting function”.</li>
<li>Without it <code>while (!done) {}</code> may read <code>done</code> once — nothing in the loop  writes it — and become <code>if (!done) for (;;);</code>.</li>
<li>Also needed: a non-volatile local changed between <code>setjmp</code> and <code>longjmp</code> is  indeterminate after the jump (7.13.2.1).</li>
</ul>
</section>
<section class="sheet-section">
<h2>What it does not do</h2>
<ul>
<li><strong>Atomicity</strong>: <code>v++</code> is load, add, store (above).</li>
<li><strong>Whole values</strong>: Armv7-M is single-copy atomic only for bytes, aligned halfwords  and aligned words; <code>LDRD</code>/<code>LDM</code> are word sequences an exception may abandon and  restart — a 64-bit read can mix two writes.</li>
<li><strong>Ordering</strong>: GCC — “accesses to non-volatile objects are not ordered with respect  to volatile accesses”; <code>buf[i] = x</code> may move past <code>ready = 1</code>.</li>
<li><strong>CPU barrier</strong>: none emitted; another CPU or bus master may see stores in  another order.</li>
<li><strong>Cache bypass</strong>: it stops register caching only. DMA with a D-cache: clean before  the device reads, invalidate before the CPU reads (CMSIS  <code>SCB_CleanDCache_by_Addr</code>, 32-byte lines), or non-cacheable RAM.</li>
<li><strong>Race freedom</strong>: conflicting accesses in two threads, one not atomic, neither  happening before the other = <strong>data race = UB</strong> (5.1.2.5), volatile or not. Linux:  volatile for shared data is “almost never correct”.</li>
</ul>
</section>
<section class="sheet-section">
<h2><code>&lt;stdatomic.h&gt;</code> in C23</h2>
<ul>
<li>Optional: <code>__STDC_NO_ATOMICS__</code> may omit it; <code>__STDC_VERSION_STDATOMIC_H__</code>  = <code>202311L</code>. Declare <code>_Atomic T</code>, <code>_Atomic(T)</code> or <code>atomic_uint</code>.</li>
<li><code>n++</code>, <code>n += k</code> on an atomic are <strong>seq_cst read-modify-writes</strong>  (6.5.3.5, 6.5.17.3); <code>n = n + 1</code> is a seq_cst load, then a seq_cst store (6.2.6.1)  — two steps.</li>
<li><code>atomic_load/store/exchange</code>, <code>atomic_fetch_add/sub/or/xor/and</code>,  <code>atomic_compare_exchange_strong/weak</code>; each has <code>_explicit(…, order)</code>, the  plain form means seq_cst. Signed <code>fetch_add</code> wraps: no UB.</li>
<li><code>compare_exchange_weak</code> may fail spuriously (built for LL/SC machines): use it in a  loop; a failure copies the current value into <code>*expected</code>. Failure order: not  release/acq_rel, not stronger than success.</li>
<li><code>ATOMIC_INT_LOCK_FREE</code> etc.: 0 never · 1 sometimes · 2 always;  <code>atomic_is_lock_free(p)</code> at run time. Only <code>atomic_flag</code> must be lock-free;  otherwise GCC calls an external routine (libatomic).</li>
<li>UB / gone: a member of an atomic struct (6.5.3.4); <code>memcpy</code>/<code>memset</code> over an  atomic leaves it indeterminate; <code>ATOMIC_VAR_INIT</code> is removed — plain initialiser or  <code>atomic_init</code> (itself not atomic).</li>
</ul>
<p><table class="sheet-table">
<thead>
<tr><th><code><strong>order</strong></code></th><th><strong>valid on</strong></th><th><strong>guarantees</strong></th></tr>
</thead>
<tbody>
<tr><td><code>relaxed</code></td><td>all</td><td>indivisible + one modification order per object; nothing else — counters</td></tr>
<tr><td><code>consume</code></td><td>load, RMW</td><td>orders only what depends on the value; GCC compiles it as acquire</td></tr>
<tr><td><code>acquire</code></td><td>load, RMW</td><td>reads a release <span class="math">⇒</span> every write before that release is visible after</td></tr>
<tr><td><code>release</code></td><td>store, RMW</td><td>publishes all earlier writes to an acquire that reads this value</td></tr>
<tr><td><code>acq_rel</code></td><td>RMW</td><td>both — exchange, <code>fetch_add</code>, CAS that hand state over</td></tr>
<tr><td><code>seq_cst</code></td><td>all</td><td>acq/rel + one total order S of all seq_cst ops; the default</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Fences and barriers</h2>
<ul>
<li><code>atomic_thread_fence(o)</code>: acquire / release / both / seq_cst fence, with a CPU  barrier where the target needs one; <code>relaxed</code> = no effect.</li>
<li><code>atomic_signal_fence(o)</code>: same ordering, only against a handler on the same  thread — compiler ordering, no fence instruction.</li>
<li><code>asm volatile(&quot;&quot; ::: &quot;memory&quot;)</code>: GCC compiler barrier; it “does not prevent the  processor from doing speculative reads”.</li>
<li>Arm (CMSIS): <code>__DMB()</code> orders explicit accesses (not completion) ·  <code>__DSB()</code> waits until they complete · <code>__ISB()</code> flushes the pipeline.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Signal handlers (hosted C)</h2>
<p>C’s only model of asynchronous interruption. A handler may touch lock-free atomics and <code>constexpr</code> objects or <em>assign</em> a <code>volatile sig_atomic_t</code> (<code>SIG_ATOMIC_WIDTH</code> <span class="math">≥</span> 8), and call only <code>abort</code>, <code>_Exit</code>, <code>quick_exit</code>, <code>signal</code> for its own signal and lock-free <code>&lt;stdatomic.h&gt;</code> functions — else UB (7.14.1.1).</p>
</section>
<section class="sheet-section">
<h2>Publish with release / acquire</h2>
<figure class="sheet-figure"><img src="c-volatile-atomics-isr-fig2.svg" width="277" height="64" alt="volatile · _Atomic · interrupts — sharing state safely in C — figure 2" loading="lazy"></figure>
</section>
<section class="sheet-section">
<h2>How hardware makes <code>n++</code> indivisible</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>CPU</strong></th><th><strong>mechanism</strong></th><th><strong>notes</strong></th></tr>
</thead>
<tbody>
<tr><td>Cortex-M0/M0+ (Armv6-M)</td><td>none: mask with <code>cpsid i</code> (PRIMASK)</td><td>no <code>LDREX</code>/<code>STREX</code>, no BASEPRI</td></tr>
<tr><td>Armv7-M: M3, M4, M7</td><td><code>LDREX</code> … <code>STREX</code> loop</td><td><code>STREX</code> 0 = stored, 1 = retry; no other store between; granule 1–512 words</td></tr>
<tr><td>AArch64</td><td><code>LDXR</code>/<code>STXR</code>; Armv8.1 LSE: <code>LDADD</code>, <code>CAS</code>, <code>SWP</code></td><td>GCC <code>-moutline-atomics</code> (default) picks at run time</td></tr>
<tr><td>x86</td><td><code>LOCK</code> prefix: <code>XADD</code>, <code>CMPXCHG</code></td><td><code>XCHG</code> with memory is always locked</td></tr>
<tr><td>RISC-V “A”</td><td><code>LR</code>/<code>SC</code> (Zalrsc) + <code>AMOADD</code>, <code>AMOSWAP</code>… (Zaamo)</td><td>an AMO is one instruction, no loop</td></tr>
<tr><td>Xtensa: ESP32, ESP32-S3</td><td><code>S32C1I</code>: store if word = <code>SCOMPARE1</code></td><td>ESP-IDF spinlocks; a single-core target without it masks interrupts</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Cortex-M interrupt priority under FreeRTOS</h2>
<figure class="sheet-figure"><img src="c-volatile-atomics-isr-fig3.svg" width="303" height="37" alt="volatile · _Atomic · interrupts — sharing state safely in C — figure 3" loading="lazy"></figure>
<ul>
<li>In an ISR only <code>…FromISR</code> calls: the others may block, and an ISR has no task to  block. Collect <code>xHigherPriorityTaskWoken</code>, then one <code>portYIELD_FROM_ISR()</code> at the  end. A direct-to-task notification is the cheapest way to unblock a task.</li>
<li>Only the top bits of the 8-bit priority field exist. An API-calling ISR left at the  default 0 sits above any legal MAX_SYSCALL: no critical section can mask it.</li>
<li><code>taskENTER_CRITICAL()</code>: M4F port raises BASEPRI, M0 port <code>cpsid i</code>; nests (a  counter); keep it a few lines. In an ISR: <code>s = taskENTER_CRITICAL_FROM_ISR()</code> …  <code>taskEXIT_CRITICAL_FROM_ISR(s)</code>. <code>vTaskSuspendAll()</code> leaves interrupts on.</li>
<li>No mutex in an ISR (its priority inheritance is about tasks); a binary semaphore has none.  Mars Pathfinder, 1997: inheritance off <span class="math">→</span> inversion <span class="math">→</span> resets.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Two CPUs — ESP-IDF v6.1</h2>
<ul>
<li>SMP: masking interrupts on one CPU is not mutual exclusion.  <code>portENTER_CRITICAL(&amp;mux)</code> masks <em>this</em> CPU up to MAX_SYSCALL, then spins on  <code>mux</code> with compare-and-set; <code>_ISR</code> forms in handlers; <code>portMUX_TYPE mux =
 portMUX_INITIALIZER_UNLOCKED</code>. No FreeRTOS call, nothing blocking inside.  Single-core targets: no spinlock, just the mask.</li>
<li><code>tskNO_AFFINITY</code> tasks run on either CPU — two at the same instant. An interrupt is  allocated on the CPU that calls <code>esp_intr_alloc</code>.</li>
<li><code>ESP_INTR_FLAG_IRAM</code>: handler in IRAM (<code>IRAM_ATTR</code>), its data in DRAM; without it  the ISR is postponed while a flash write/erase has the cache off.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Example — ISR counts, task drains</h2>
<pre class="sheet-code"><code class="hljs language-plaintext">static _Atomic uint32_t events;  static TaskHandle_t worker;
void IRAM_ATTR on_edge(void *arg) {                     // ISR
  atomic_fetch_add_explicit(&amp;events, 1, memory_order_relaxed);
  BaseType_t woken = pdFALSE;
  vTaskNotifyGiveFromISR(worker, &amp;woken);
  portYIELD_FROM_ISR(woken);           // switch now if it outranks us
}
void worker_task(void *arg) {
  for (;;) { ulTaskNotifyTake(pdTRUE, portMAX_DELAY);  // sleep
             handle(atomic_exchange(&amp;events, 0)); }    // read + reset: ONE step
}</code></pre>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap"><code>handle(n); n = 0;</code> drops every increment in between — <code>atomic_exchange</code>.</li>
<li class="trap">A 64-bit <code>_Atomic</code> on a 32-bit MCU may take a lock: <code>ATOMIC_LLONG_LOCK_FREE</code>.</li>
<li class="trap">Interrupts off on one ESP32 CPU <span class="math">≠</span> exclusion. A compiler barrier <span class="math">≠</span> a CPU fence.</li>
</ul>
</section>
