/div></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">Mobile production incident — the playbook</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">debugging · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> <strong>A build already on users’ phones cannot be recalled</strong> — pausing or halting a rollout only
stops it reaching <em>more</em> people. So: <strong>detect</strong> per version, <strong>stop the spread</strong> (pause / halt),
<strong>neutralise the bad path server-side</strong> (kill switch, compatibility shim, OTA JS rollback), <strong>ship a fix</strong>
(hotfix + expedited review, then force-update), <strong>communicate</strong>, and learn in a <strong>blameless postmortem</strong>.</p>
<p class="sheet-tools"><a class="sheet-download" href="mobile-incident-playbook.pdf" download>Download PDF</a> <a href="mobile-incident-playbook.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/debugging/mobile-incident-playbook.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="mobile-incident-playbook-fig1.svg" width="632" height="96" class="wide" alt="Mobile production incident — the playbook — figure 1" loading="lazy"></figure>

<section class="sheet-section">
<h2>Detect — per version, fastest first</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>signal</strong></th><th><strong>basis</strong></th><th><strong>what it says</strong></th></tr>
</thead>
<tbody>
<tr><td>Crashlytics velocity</td><td>30 min, one version</td><td>one crash/ANR type hits a set % of users — not sent until you pick a
 channel (regressed + trending: on by default)</td></tr>
<tr><td>crash-free users</td><td>a period</td><td><span class="math">1 -</span> crashed / all users, aggregated, not averaged; sessions beside it</td></tr>
<tr><td>Play vitals</td><td>28-day avg, daily</td><td>user-perceived crash <strong>1.09 %</strong>, ANR <strong>0.47 %</strong>, <strong>8 %</strong>
 on one phone model; over <span class="math">→</span> Play may cut visibility, warn on the listing</td></tr>
<tr><td>Xcode Crashes organizer</td><td>opt-in users</td><td>TestFlight: all users; <strong>no</strong> watchdog, jetsam, thermal or
 code-signature kills</td></tr>
<tr><td>MetricKit</td><td>on device</td><td>diagnostics delivered immediately (iOS 15+); iOS 27: <code>MetricManager</code></td></tr>
<tr><td>backend · business</td><td>live</td><td>4xx/5xx, latency, payments by an <code>App-Version</code> header · funnel, logins; reviews and
 tickets lag</td></tr>
</tbody>
</table></p>
<p>Units differ: vitals count per daily active user, Crashlytics per session — 1 crash in a user’s 3 sessions = <strong>100 %</strong> vs <strong>33 %</strong>.</p>
</section>
<section class="sheet-section">
<h2>Declare, organise, triage</h2>
<ul>
<li><strong>Declare</strong> if any holds: a second team is needed · customers can see it · unsolved after an hour of  concentrated analysis. Declaring early and closing on a simple fix beats starting hours in.</li>
<li><strong>Stop the bleeding first</strong> — make the system work as well as it can; root cause later.</li>
</ul>
<p><table class="sheet-table">
<thead>
<tr><th><strong>role</strong></th><th><strong>holds</strong></th></tr>
</thead>
<tbody>
<tr><td>IC</td><td>the state and every role not delegated; the <strong>living incident document</strong>; explicit handoff</td></tr>
<tr><td>Ops</td><td>the <em>only</em> hands changing the system — flags, rollout, backend</td></tr>
<tr><td>Comms</td><td>the public face: periodic updates to team + stakeholders (status page, in-app banner)</td></tr>
<tr><td>Planning</td><td>bugs, handoffs, every divergence (flag, shim) so it can be reverted</td></tr>
</tbody>
</table></p>
<ol>
<li><strong>Blast radius</strong>: version/build, OS, device, region, locale, flag arm; % of DAU.</li>
<li><strong>What changed</strong>: release, config/flag, backend deploy, OS release — line up the timelines.</li>
<li><strong>Harm</strong>: data, money, security/privacy — or annoyance? <strong>Workaround?</strong></li>
</ol>
<p><table class="sheet-table">
<thead>
<tr><th><strong>sev</strong></th><th><strong>scale (PagerDuty)</strong></th><th><strong>mobile example</strong></th></tr>
</thead>
<tbody>
<tr><td>SEV-1</td><td>critical, many customers, or customer data exposed; public notice</td><td>launch crash for most; payments down</td></tr>
<tr><td>SEV-2</td><td>many customers cannot use the product</td><td>core flow broken</td></tr>
<tr><td>SEV-3</td><td>partial loss, not most customers; may grow into SEV-2</td><td>one OS or locale broken</td></tr>
<tr><td>SEV-4</td><td>minor; product still usable</td><td>slow screen</td></tr>
<tr><td>SEV-5</td><td>cosmetic</td><td>typo</td></tr>
</tbody>
</table></p>
<p>SEV-1/2 = major incident, IC paged. Unsure? Take the <strong>higher</strong>; argue in the postmortem.</p>
</section>
<section class="sheet-section">
<h2>Who each lever reaches</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>lever</strong></th><th><strong>has it</strong></th><th><strong>more</strong></th><th><strong>catch</strong></th></tr>
</thead>
<tbody>
<tr><td>pause phased</td><td><span class="math">×</span></td><td>part</td><td>auto-updates only: manual downloads, new installs still get it</td></tr>
<tr><td>halt staged / 100 %</td><td><span class="math">×</span></td><td>✓</td><td>Play serves the previous release instead</td></tr>
<tr><td>remove from sale</td><td><span class="math">×</span></td><td>✓</td><td>App Store, whole app, <span class="math">≤</span> 24 h</td></tr>
<tr><td>kill switch / flag</td><td>✓</td><td>✓</td><td>only if built in; at the next config fetch</td></tr>
<tr><td>backend shim</td><td>✓</td><td>✓</td><td>old response shape for build <span class="math">X</span>; server debt</td></tr>
<tr><td>OTA rollback</td><td>✓</td><td>✓</td><td>JS only, same runtime version; next cold start</td></tr>
<tr><td>hotfix + force update</td><td>✓</td><td>✓</td><td>review + adoption; the gate must be in the old build</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Stop the spread — the stores</h2>
<p><table class="sheet-table">
<thead>
<tr><th></th><th><strong>App Store — phased</strong></th><th><strong>Google Play — staged</strong></th></tr>
</thead>
<tbody>
<tr><td>pace</td><td>fixed 1·2·5·10·20·50·100 % over 7 days; random auto-update users</td><td>your %, never rises by itself; random
 new + existing users</td></tr>
<tr><td>for</td><td>version updates</td><td>updates, not the first publish</td></tr>
<tr><td>stop</td><td><strong>pause</strong>: 30 days in total, any number of times; resumes on the same day</td><td><strong>halt</strong>: no
 additional users; resume to any %</td></tr>
<tr><td>leak</td><td>anyone may download it manually</td><td>—</td></tr>
<tr><td>at 100 %</td><td>submit an update, or remove the app</td><td><strong>halt</strong> it too: the previous full release is served to
 new users and all not on it — not a track’s first release</td></tr>
<tr><td>has it</td><td>keeps it</td><td>keeps it</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Fix — hotfix, review, adoption</h2>
<ul>
<li>Smallest diff, cherry-picked to the release branch. App Store: incremental version + incremented build  string; Play: <code>versionCode</code> above every previous one (max 2 100 000 000).</li>
<li><strong>Review</strong>: <span class="math">≥</span> 50 % in <span class="math">&lt;</span> 24 h, 90 % in <span class="math">&lt;</span> 48 h. <strong>Expedited</strong>: only a submission  already sent; critical bug + steps to reproduce on the current version in <em>Notes</em>; granted as  availability allows. A rejected bug-fix with no legal/safety issue may ship, fixed next time — once per  issue. Then phased, or <strong>Release to All Users</strong> at any time.</li>
<li><strong>Force update</strong>: <code>min_supported</code> in config <span class="math">→</span> blocking screen <span class="math">→</span> store. Play in-app updates:  <code>IMMEDIATE</code> (full screen; Play installs + restarts) or <code>FLEXIBLE</code> (background);  <code>inAppUpdatePriority</code> 0–5 set at rollout via the Play Developer API, never changed.</li>
<li><strong>Recovered</strong> = that version’s crash-free / funnel back at <em>baseline</em>, not “PR merged”.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Kill switch — config, timing, crash loops</h2>
<pre class="sheet-code"><code class="hljs language-json"><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;min_supported&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;ios&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;4.12.1&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;android&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">41201</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;kill&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;new_checkout&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;ios&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-string">&quot;4.13.0&quot;</span><span class="hljs-punctuation">]</span> <span class="hljs-punctuation">}</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;banner&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;text&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Payments delayed, fixing now&quot;</span> <span class="hljs-punctuation">}</span> <span class="hljs-punctuation">}</span></code></pre>
<ul>
<li>Firebase Remote Config: default minimum fetch interval <strong>12 h</strong>; values apply on <code>activate</code>.  Real-time listener (Apple SDK 10.7.0+): server invalidation <span class="math">→</span> fetch past the interval, foreground only.</li>
<li><strong>expo-updates</strong> guards JS crash loops: an error before the first render on an update’s first launch  marks it failed, waits 5 s for a newer one, else reloads the last that launched; <span class="math">&gt;</span> 10 s after first  render it is not caught. <code>eas update:rollback</code> <span class="math">→</span> a previous update or the embedded one.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Learn — blameless postmortem</h2>
<ul>
<li><strong>Triggers</strong>: user-visible degradation past a threshold · any data loss · on-call intervention  · resolution time past a threshold · a monitoring failure · any stakeholder asks.</li>
<li><strong>Record</strong>: timeline (UTC; TTD, TTM, TTR), impact in numbers, actions, root cause(s), follow-ups with  owner + date. <strong>Blameless</strong>: causes, not culprits — everyone acted in good faith on what they knew.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap">Launch crash before config loads: no kill switch reaches it — guard crash loops, cache config.</li>
<li class="trap">Removing from sale to stop a phased release: reinstated, the version goes to 100 % at once.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<h3 class="sheet-hd">Stop the spread, kill the path, ship the fix, force the stragglers, write it down.</h3>
</section>
