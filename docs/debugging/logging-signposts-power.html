iv></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">Logging, signposts &amp; power — from code to field data</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">debugging · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> <strong><code>Logger</code></strong> writes <em>words</em> into the OS’s unified log
(binary, levelled, redacted by default), <strong><code>OSSignposter</code></strong> writes
<em>time</em> (intervals and events Instruments draws as tracks), and the OS meters
<em>power</em> per subsystem. Read it live (Xcode console, Console, <code>log</code>),
recorded (Instruments, Power Profiler, <code>xctrace</code>), or aggregated from users a day
later (MetricKit, Organizer).</p>
<p class="sheet-tools"><a class="sheet-download" href="logging-signposts-power.pdf" download>Download PDF</a> <a href="logging-signposts-power.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/debugging/logging-signposts-power.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="logging-signposts-power-fig1.svg" width="539" height="125" class="wide" alt="Logging, signposts &amp; power — from code to field data — figure 1" loading="lazy"></figure>

<section class="sheet-section">
<h2>Unified logging (iOS 10+; <code>Logger</code> iOS 14)</h2>
<ul>
<li><code>Logger(subsystem: &quot;com.acme.app&quot;, category: &quot;network&quot;)</code>: reverse-DNS area +  component, both filter keys. Replaced ASL and syslog.</li>
<li>Stored <strong>binary + compressed</strong>, formatted only when read; a discarded <code>debug</code>  is near-free (the compiler skips building its message). <code>print</code> = stdout, “for  command-line UI”: no level, metadata or redaction.</li>
</ul>
<p><table class="sheet-table">
<thead>
<tr><th><strong>level</strong></th><th><strong>persisted (Apple’s table)</strong></th><th><strong>alias</strong></th><th><strong>shown</strong></th></tr>
</thead>
<tbody>
<tr><td><code>debug</code></td><td>no — memory only</td><td><code>trace</code></td><td></td></tr>
<tr><td><code>info</code></td><td>only if collected with <code>log</code></td><td></td><td></td></tr>
<tr><td><code>notice</code></td><td>yes, to a storage limit (default)</td><td><code>log</code></td><td></td></tr>
<tr><td><code>error</code></td><td>yes + the activity’s process chain</td><td><code>warning</code></td><td>yellow</td></tr>
<tr><td><code>fault</code></td><td>same; the slowest level</td><td><code>critical</code></td><td>red</td></tr>
</tbody>
</table></p>
<ul>
<li><strong>Privacy</strong> (<code>.auto</code>): ints, floats, bools shown; dynamic strings and objects  <strong>redacted</strong>. <code>.public</code> shows; <code>.private</code> = <code>.sensitive</code> redact;  <code>mask: .hash</code> prints a per-process hash instead, so equal values correlate.</li>
<li><strong>Xcode 15+ console</strong>: metadata under each line, tokenised filters, Space =  Quick Look, jump to the source line. <strong>Console.app</strong>: <em>Action &gt; Include
 Info / Debug Messages</em> — live stream only; a <code>.logarchive</code> already has them.</li>
<li><strong>Field</strong>: <code>try OSLogStore(scope:</code> <code>.currentProcessIdentifier)</code> (iOS 15)  reads your own entries back for a report; or a sysdiagnose.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Example</h2>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">import</span> os
<span class="hljs-keyword">extension</span> <span class="hljs-title class_">Logger</span> {
  <span class="hljs-keyword">static</span> <span class="hljs-keyword">let</span> net <span class="hljs-operator">=</span> <span class="hljs-type">Logger</span>(subsystem: <span class="hljs-string">&quot;com.acme.app&quot;</span>,
                          category: <span class="hljs-string">&quot;network&quot;</span>) }
<span class="hljs-type">Logger</span>.net.info(<span class="hljs-string">&quot;GET <span class="hljs-subst">\(url.path, privacy: .public)</span>&quot;</span>)
<span class="hljs-type">Logger</span>.net.error(<span class="hljs-string">&quot;HTTP <span class="hljs-subst">\(code)</span> user <span class="hljs-subst">\(uid,
                 privacy: .private(mask: .hash))</span>&quot;</span>)
<span class="hljs-keyword">let</span> sp <span class="hljs-operator">=</span> <span class="hljs-type">OSSignposter</span>(logger: .net)
<span class="hljs-keyword">func</span> <span class="hljs-title function_">fetch</span>() <span class="hljs-keyword">async</span> <span class="hljs-keyword">throws</span> -&gt; <span class="hljs-type">Feed</span> {
  <span class="hljs-keyword">let</span> st <span class="hljs-operator">=</span> sp.beginInterval(<span class="hljs-string">&quot;Fetch&quot;</span>, id: sp.makeSignpostID())
  <span class="hljs-keyword">defer</span> { sp.endInterval(<span class="hljs-string">&quot;Fetch&quot;</span>, st) }  <span class="hljs-comment">// same StaticString name</span>
  sp.emitEvent(<span class="hljs-string">&quot;CacheMiss&quot;</span>)               <span class="hljs-comment">// a point, not a span</span>
  <span class="hljs-keyword">return</span> <span class="hljs-keyword">try</span> <span class="hljs-keyword">await</span> api.feed()
}</code></pre>
<pre class="sheet-code"><code class="hljs language-bash"><span class="hljs-built_in">log</span> stream --level debug --predicate <span class="hljs-string">&#x27;subsystem == &quot;com.acme.app&quot;&#x27;</span>
<span class="hljs-built_in">log</span> collect --device --start 2026-10-07 --output bug.logarchive
xcrun xctrace record --template <span class="hljs-string">&#x27;Time Profiler&#x27;</span> --time-limit 30s \
  --window 5s --no-prompt --output feed.trace --launch -- MyApp.app</code></pre>
</section>
<section class="sheet-section">
<h2>Signposts — time, not words</h2>
<ul>
<li><strong>Interval</strong>: begin/end with the same static name. The returned  <code>OSSignpostIntervalState</code> enforces one end per begin, same name, same log — a  violation <strong>crashes Debug builds</strong>; Release attaches an error to the end.</li>
<li>ID <code>.exclusive</code> (default) if only one such interval runs at a time, else  <code>makeSignpostID()</code>. <strong>Event</strong> = <code>emitEvent</code>, an instant.</li>
<li><code>.pointsOfInterest</code> category <span class="math">→</span> <em>Points of Interest</em>, auto-included with  Time Profiler. <code>OSSignposter.disabled</code> <span class="math">≈</span> no-op; gate costly metadata on  <code>isEnabled</code>.</li>
<li><strong>Xcode 27</strong>: a track <strong>per signpost name</strong> under its category; os_log  overlaid on Time/CPU Profiler thread tracks; StateReporting states in Points of Interest.</li>
<li>CI: <code>XCTOSSignpostMetric(subsystem:category:name:)</code> in <code>measure(metrics:)</code> —  no result without a begin/end pair. <code>xctrace</code>: <code>--run-name</code> (26);  <code>--recording-options</code>, <code>export</code> straight from <code>.atrc</code>/<code>.logarchive</code>  with <code>--time-start</code>/<code>--time-end</code>/<code>--duration</code> (27).</li>
</ul>
</section>
<section class="sheet-section">
<h2>Power Profiler (Xcode 26; iOS / iPadOS 26)</h2>
<ul>
<li>Blank template + <em>Power Profiler</em>. System track: <strong>% of battery per hour</strong>,  charger, thermal state, brightness, SoC sleep. App lanes: <strong>power impact</strong> of  <strong>CPU · GPU · display · networking</strong> — a score; fix the highest first.  <em>All Processes</em> = system only; app lanes need Launch or Attach.</li>
<li><strong>No Mac</strong>: Settings &gt; Developer &gt; <em>Performance Trace</em> <span class="math">→</span> Power Profiler  mode <span class="math">→</span> tick the app <span class="math">→</span> Control Center control; up to <strong>10 h</strong>; share the  <code>.aar</code> <span class="math">→</span> <code>.atrc</code> <span class="math">→</span> Instruments (+ a lower-rate Time Profiler). Testers too.</li>
</ul>
</section>
<section class="sheet-section">
<h2>One subsystem — metric — fix</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>lane</strong></th><th><strong>MetricKit (iOS 27)</strong></th><th><strong>fix (Apple’s guidance)</strong></th></tr>
</thead>
<tbody>
<tr><td>CPU</td><td><code>CPUTime</code>, <code>CPUInstructionsCount</code></td><td>events, not polling; lowest QoS that fits; 10–100 ms operations</td></tr>
<tr><td>GPU</td><td><code>GPUTime</code></td><td>redraw less (<em>Flash Updated Regions</em>); solid backgrounds over blur</td></tr>
<tr><td>display</td><td><code>PixelLuminance</code> (APL 0–100, OLED)</td><td>brighter pixels cost more: Dark Mode; stop finished animations</td></tr>
<tr><td>network</td><td><code>TotalWiFi…</code>, <code>TotalCellular…</code> up/down</td><td>one <code>URLSession</code>; batch + compress; <code>isDiscretionary</code> (waits for charging or Wi-Fi)</td></tr>
<tr><td>location (no lane)</td><td><code>LocationActivityTime</code></td><td>low <code>desiredAccuracy</code>, <code>distanceFilter</code>; stop when stationary</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Field — MetricKit &amp; Organizer</h2>
<ul>
<li><strong>iOS 27</strong> <code>MetricManager</code> (<code>MX…</code> deprecated in 27.2):  <code>logHandle(category:)</code> + <code>mxSignpost</code> <span class="math">→</span> daily <code>SignpostIntervalMetric</code>  (count, duration histogram, <code>cpuTime</code>, <code>logicalWrites</code>, <code>averageMemory</code> — the  last three only from <code>mxSignpost</code>, not <code>OSSignposter</code>). Custom signposts are capped — critical paths only. Diagnostics list the signposts  active around the event. Test: <em>Debug &gt; MetricKit &gt; Simulate MetricKit Payloads</em>.</li>
</ul>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">let</span> mk <span class="hljs-operator">=</span> <span class="hljs-type">MetricManager</span>()                  <span class="hljs-comment">// iOS 27: keep ONE</span>
<span class="hljs-keyword">let</span> h <span class="hljs-operator">=</span> <span class="hljs-type">MetricManager</span>.logHandle(category: <span class="hljs-string">&quot;Feed&quot;</span>)
mxSignpost(.begin, log: h, name: <span class="hljs-string">&quot;Load&quot;</span>)  <span class="hljs-comment">// ... work ...</span>
mxSignpost(.end, log: h, name: <span class="hljs-string">&quot;Load&quot;</span>)
<span class="hljs-type">Task</span> { <span class="hljs-keyword">for</span> <span class="hljs-keyword">await</span> r <span class="hljs-keyword">in</span> mk.metricReports {  <span class="hljs-comment">// daily, never throws</span>
  <span class="hljs-keyword">for</span> <span class="hljs-keyword">case</span> .signpostInterval(<span class="hljs-keyword">let</span> m)
      <span class="hljs-keyword">in</span> r.intervalEntries.fullDayEntry.values { upload(m) } } }</code></pre>
<ul>
<li><strong>Organizer</strong> (anonymised, consenting users, needs volume). <em>Battery Usage</em>:  on-screen % per 24 h off power, + background, by Audio · Networking · Processing ·  Display · Bluetooth · Location · Camera · Torch · NFC. <em>Energy</em>: exception  reports with a sample stack + 14-day trend.</li>
<li><strong>Xcode 27</strong>: <em>Insights Overview</em>, <em>Hitches</em> (all animations, was  Scrolling), <em>Storage</em>; goals per metric; <em>Generate Recommendations</em>.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap">Support asks for logs and there is nothing: <code>debug</code>/<code>info</code> weren’t  persisted — log what support needs at <code>notice</code>+.</li>
<li class="trap"><code>privacy: .public</code> on a token or email — a PII leak; <code>.hash</code> correlates instead.</li>
<li class="trap">Power profiled on a charger (cable or MagSafe) reads <strong>0</strong> — pair wirelessly.  Impact scores from two device models don’t compare.</li>
<li class="trap">Thousands of signposts/s recorded <em>immediately</em> skip OS buffering — use <code>--window</code>.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<h3 class="sheet-hd">Logger = words · signposts = time · Power Profiler = %/h per subsystem · MetricKit /
Organizer = the field, a day late.</h3>
</section>
