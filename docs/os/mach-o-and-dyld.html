ry></details></nav></div><div class="scroll"></div></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">Mach-O &amp; dyld — the file, the fixups, the loader</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">os · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> A <strong>Mach-O</strong> is a <strong>header</strong>, a list of <strong>load commands</strong> (what to map,
which dylibs, where <code>main</code> is, the signature) and the <strong>segments</strong> they describe. The
kernel maps the executable and <strong>dyld</strong>; dyld loads every dependent dylib, writes
<strong>fixups</strong> into DATA — <em>rebase</em> (add the ASLR slide) and <em>bind</em> (another image’s
symbol) — runs initializers bottom-up and calls <code>main</code>. Code (<code>__TEXT</code>) is never written:
calls into a dylib go through a stub that loads a pointer from DATA.</p>
<p class="sheet-tools"><a class="sheet-download" href="mach-o-and-dyld.pdf" download>Download PDF</a> <a href="mach-o-and-dyld.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/os/mach-o-and-dyld.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="mach-o-and-dyld-fig1.svg" width="620" height="183" class="wide" alt="Mach-O &amp; dyld — the file, the fixups, the loader — figure 1" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">Header</span></h3>
<ul>
<li><code>MH_MAGIC_64</code> <code>0xfeedfacf</code> (32-bit <code>0xfeedface</code>). <code>cputype</code>  <code>CPU_TYPE_ARM64</code> = ARM 12 | ABI64 <code>0x01000000</code> = <code>0x0100000c</code>; x86_64  <code>0x01000007</code>; <strong>arm64e</strong> is <code>cpusubtype</code> 2, not a cputype.</li>
<li><code>filetype</code>: OBJECT 1 · <strong>EXECUTE 2</strong> · <strong>DYLIB 6</strong> · DYLINKER 7 · BUNDLE 8 ·  DSYM <code>0xa</code> · FILESET <code>0xc</code>. <code>flags</code>: TWOLEVEL <code>0x80</code> (binds name their  library) · <strong>PIE</strong> <code>0x200000</code> (load at a random address; default since 10.7) ·  APP_EXTENSION_SAFE · DYLIB_IN_CACHE.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Load commands</span></h3>
<p>Each = <code>cmd</code> + <code>cmdsize</code> + payload. <strong>R</strong> = <code>| 0x80000000</code> (<code>LC_REQ_DYLD</code>): dyld refuses an image with an R command it does not know; other unknown ones are ignored.</p>
<p><table class="sheet-table">
<tbody>
<tr><td><code>SEGMENT_64 0x19</code></td><td>name, vmaddr/vmsize, fileoff/filesize, max/init prot, flags, sections</td></tr>
<tr><td><code>SYMTAB 0x2 · DYSYMTAB 0xb</code></td><td>symbols + strings; indirect table for stubs and GOT</td></tr>
<tr><td><code>LOAD_DYLINKER 0xe</code></td><td><code>/usr/lib/dyld</code> — the kernel loads it</td></tr>
<tr><td><code>LOAD_DYLIB 0xc</code></td><td>install name + current/compat version; <code>_WEAK_</code> 0x18|R may be missing; REEXPORT 0x1f|R</td></tr>
<tr><td><code>ID_DYLIB 0xd · RPATH 0x1c|R</code></td><td>a dylib’s own install name · a run-path entry</td></tr>
<tr><td><code>MAIN 0x28|R</code></td><td>offset of <code>main</code> (replaced UNIXTHREAD); dyld reads it, the kernel does not</td></tr>
<tr><td><code>UUID 0x1b</code></td><td>128-bit build id — the symbolication key</td></tr>
<tr><td><code>BUILD_VERSION 0x32</code></td><td>platform, minOS, SDK, tools</td></tr>
<tr><td><code>DYLD_INFO_ONLY 0x22|R</code></td><td>old format: rebase / bind / weak / lazy opcodes + export trie</td></tr>
<tr><td><code>DYLD_CHAINED_FIXUPS 0x34|R</code></td><td>chain starts + imports (exports: EXPORTS_TRIE 0x33|R)</td></tr>
<tr><td><code>CODE_SIGNATURE 0x1d</code></td><td>offset/size of the blob at the end of <code>__LINKEDIT</code></td></tr>
<tr><td><code>ENCRYPTION_INFO_64 0x2c</code></td><td>cryptoff · cryptsize · cryptid (below)</td></tr>
</tbody>
</table></p>
<p>Newest in <code>loader.h</code>: ATOM_INFO 0x36 · FUNCTION_VARIANTS 0x37 (+_FIXUPS 0x38) · TARGET_TRIPLE 0x39 · LAZY_LOAD_DYLIB_INFO 0x3A. macOS 15 / iOS 18 read <code>dylib_use_command</code>: one LOAD_DYLIB with flags weak · re-export · upward · <strong>delayed-init</strong>.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Segments and sections</span></h3>
<ul>
<li><strong>Segment</strong> = page-aligned VM range with one protection (page = 4 or 16 KB by  arch); <strong>section</strong> = named sub-range (<code>__TEXT,__text</code>) with a type:  <code>S_ZEROFILL</code> (<code>__bss</code>: <code>vmsize</code> &gt; <code>filesize</code>), <code>S_SYMBOL_STUBS</code>,  <code>S_NON_LAZY_SYMBOL_POINTERS</code> (<code>__got</code>), <code>S_MOD_INIT_FUNC_POINTERS</code>,  <code>S_INIT_FUNC_OFFSETS</code> (32-bit offsets, in <code>__TEXT</code>).</li>
<li><code>__PAGEZERO</code>: ld’s default is 4 GB on 64-bit; xnu <em>refuses</em> an arm64  executable whose hard page zero does not cover the whole low 32-bit address space.</li>
<li><strong>Clean</strong> pages (<code>__TEXT</code>, <code>__LINKEDIT</code>) are evictable and re-read from  the file; <strong>dirty</strong> ones (<code>__DATA</code>, fixed-up <code>__DATA_CONST</code>) cost RAM.  <code>SG_READ_ONLY</code> <code>0x10</code> = “made read-only after fixups”.</li>
<li>Runtimes find metadata by section: Swift scans <code>__TEXT,__swift5_proto</code>  (conformances), <code>_swift5_types</code>, <code>_swift5_protos</code> per image; ObjC lists  (<code>__objc_classlist</code>, <code>__objc_selrefs</code>, …) sit in <code>__DATA*</code> or <code>__AUTH*</code>.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Fat files and encrypted text</span></h3>
<p><code>fat_header</code> is <strong>big-endian</strong>: <code>0xcafebabe</code> (<code>_64</code>: <code>0xcafebabf</code>), then one <code>fat_arch</code> per slice: cputype, cpusubtype, offset, size, align (<span class="math">2<sup>n</sup></span>). Slices are keyed by CPU only — device and simulator arm64 collide; the platform (iOS 2, iOS simulator 7) lives in <code>LC_BUILD_VERSION</code>, hence XCFrameworks. <code>LC_ENCRYPTION_INFO_64</code>: xnu maps a <code>cryptid 1</code> range through a decrypting pager (<code>com.apple.unfree</code>); no decrypter <span class="math">→</span> exec fails. <code>cryptid 0</code> = plain.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Example — take a binary apart</span></h3>
<pre class="sheet-code"><code class="hljs language-bash">lipo -archs App               <span class="hljs-comment"># slices: arm64 x86_64 ...</span>
otool -l App                  <span class="hljs-comment"># every load command and section</span>
otool -L App                  <span class="hljs-comment"># dylibs + compat / current versions</span>
vtool -show-build App         <span class="hljs-comment"># platform, minos, sdk</span>
dyld_info -fixups App         <span class="hljs-comment"># every rebase / bind and its target</span>
dyld_info -imports -exports Lib.dylib   <span class="hljs-comment"># works on cache images too</span>
dyld_info -inits App          <span class="hljs-comment"># initializers dyld will run</span>
DYLD_PRINT_LIBRARIES=1 DYLD_PRINT_INITIALIZERS=1 ./tool
<span class="hljs-built_in">sudo</span> dyld_usage App           <span class="hljs-comment"># live trace (kernel tracing: root)</span></code></pre>
<h3 class="sheet-hd"><span class="c-sheetblue">Fixups — the only writes dyld makes</span></h3>
<ul>
<li><strong>Rebase</strong>: a pointer into its own image, stored as if loaded at 0; dyld adds the  slide. <strong>Bind</strong>: the target is a name (<code>_malloc</code>) looked up in one library’s  <strong>exports trie</strong> — two-level: the import’s <strong>lib ordinal</strong> picks the library  (0 self · <span class="math">-1</span> main executable · <span class="math">-2</span> flat lookup · <span class="math">-3</span> weak).</li>
<li><strong>Opcode format</strong> (<code>LC_DYLD_INFO_ONLY</code>): lists of locations, plus  <strong>lazy binding</strong> (<code>__stub_helper</code> + <code>__la_symbol_ptr</code>, bound on first call).</li>
<li><strong>Chained fixups</strong>: runtime from iOS 13.4; the default output since macOS 12 /  iOS 15. Smaller <code>__LINKEDIT</code>; <strong>no lazy binding</strong> — every bind at load, so  <code>RTLD_LAZY</code> = <code>RTLD_NOW</code>, and <code>-undefined dynamic_lookup</code> that relied on  lazy binds breaks.</li>
<li><strong>Page-in linking</strong> (WWDC22, iOS 16 generation): dyld skips the fixups and the  <strong>kernel</strong> applies a DATA page’s chain as it faults in. Needs chained fixups;  launch only (a <code>dlopen</code>ed image is fixed by dyld); <code>__DATA_CONST</code> stays  <strong>clean</strong>. Shared-cache dylibs have had it “for over a decade”. Apple’s demo:  15 ms launch, 1 ms of it fixups.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">dyld4 — when the prebuilt path is used</span></h3>
<p>At most two PrebuiltLoaderSets per process: the dyld cache’s (every OS dylib) and the program’s. A program’s set is cloned from its JustInTimeLoaders after loading, <em>before</em> initializers, saved under a name from its <strong>cdhash</strong> + a hash of its path, and <strong>never used after a
reboot</strong> (no persistence for an attacker). None is built with <code>DYLD_INSERT_LIBRARIES</code>, <code>DYLD_*_PATH</code>, <code>DYLD_IMAGE_SUFFIX</code> or interposing. <code>DYLD_USE_CLOSURES</code>: 0 JIT · 1 JIT + save · 2 prebuilt or fail.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Timeline — linker and loader</span></h3>
<p><table class="sheet-table">
<tbody>
<tr><td>WWDC17</td><td>dyld3: cache the parse / load / lookup work (a launch closure)</td></tr>
<tr><td>iOS 13</td><td>dyld3 for third-party iOS apps (macOS apps stay on dyld2); 13.4: chained-fixup runtime</td></tr>
<tr><td>macOS 11.0.1</td><td>system dylibs only in the built-in cache — no files on disk</td></tr>
<tr><td>macOS 12 · iOS 15</td><td>dyld4 (in macOS 12 crash logs), no dyld2 fallback; chained fixups the default; from “the 2021 releases” the cache is split into several files</td></tr>
<tr><td>Xcode 14 · iOS 16</td><td>faster, parallel ld64 · page-in linking (WWDC22)</td></tr>
<tr><td>Xcode 15</td><td>new linker by default (classic via <code>-ld64</code>); mergeable libraries — metadata <span class="math">≈</span> doubles a dylib, Debug re-exports instead of merging</td></tr>
<tr><td>Xcode 16</td><td><code>-ld_classic</code> deprecated</td></tr>
<tr><td>macOS 15 / iOS 18</td><td><code>dylib_use_command</code> (delayed-init dylibs)</td></tr>
<tr><td><strong>Xcode 27</strong></td><td><strong>ld64 removed</strong>; <code>-ld_classic</code> no longer supported</td></tr>
</tbody>
</table></p>
<h3 class="sheet-hd"><span class="c-sheetblue">Initializers — the exact order</span></h3>
<p>dyld walks the graph <strong>bottom-up</strong>: every dependency before its client, <em>upward</em> links afterwards. Per image: ObjC <code>+load</code> first (“done before C++ initializers”), then C++ static constructors, <code>__attribute__((constructor))</code>, <code>-init</code>. A <strong>delay-init</strong> dylib (<code>-delay_library</code>) is in the graph, but its initializers are skipped while it stays in the delay-init state.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Finding a dylib · the shared cache</span></h3>
<ul>
<li>dyld does <strong>not search</strong>: an install name is a path. <code>@executable_path</code> = the  main executable’s directory; <code>@loader_path</code> = that of the image holding the load  command; <code>@rpath</code> = tried with each entry of the <strong>run-path list</strong>, built from the  <code>LC_RPATH</code>s along the dependency chain.</li>
<li><code>DYLD_LIBRARY_PATH</code>, <code>_FRAMEWORK_PATH</code>, <code>_INSERT_LIBRARIES</code> are ignored  for SIP-protected, set[ug]id or entitled binaries; hardened runtime needs  <code>com.apple.security.cs.allow-dyld-environment-variables</code> (+ disable-library-validation  for another team’s code).</li>
<li>Cache mappings: TEXT r-x · DATA_CONST · DATA · LINKEDIT r, plus AUTH / AUTH_CONST  on arm64e (DATA / DATA_CONST with signed pointers), spaced so the read-only parts share  kernel page tables (32 MB granule on arm64, 1 GB on x86_64).</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap"><code>-weak_framework</code> without declaring the functions weak: clang may delete your  <code>if (fn)</code> NULL check.</li>
<li class="trap">Probing for <code>/usr/lib/libz.dylib</code> as a file on macOS 11+ — it is not there;  <code>dlopen()</code> it.</li>
<li class="trap"><code>-ld_classic</code> still in <code>OTHER_LDFLAGS</code> — no longer supported from Xcode 27.</li>
</ul>
