t folio-page"><h1 class="title">Core ML · Core AI · Vision — machine learning on the device</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">ai · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> A trained model ships as a <strong>file</strong>; its first load <strong>specialises</strong> it for
this chip and OS and caches the result; it runs on <strong>CPU, GPU and Neural Engine</strong>.
<strong>Core ML</strong> (iOS 11) runs any model type, <strong>Core AI</strong> (iOS 27) modern neural nets;
<strong>Vision</strong>, <strong>Speech</strong>, <strong>Natural Language</strong> and <strong>Foundation Models</strong> put
Apple’s own models behind task APIs.</p>

<section class="sheet-section">
<h2>Files</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>file</strong></th><th><strong>what it is</strong></th><th><strong>OS</strong></th></tr>
</thead>
<tbody>
<tr><td><code>.mlmodel</code></td><td>one file, <em>neuralnetwork</em> type (layers + weights inside)</td><td>11</td></tr>
<tr><td><code>.mlpackage</code></td><td>folder: <strong>ML Program</strong> (typed ops) + separate weights; FP16 compute by
default (<code>compute_precision=FLOAT32</code> to opt out); <code>ct.convert</code>’s default since coremltools 7</td><td>15</td></tr>
<tr><td><code>.mlmodelc</code></td><td>compiled — the thing that loads. <code>compileModel(at:)</code> writes to a
<em>temporary</em> dir: move it to Application Support to reuse</td><td>—</td></tr>
<tr><td><code>.aimodel</code></td><td>Core AI asset from <code>coreai-torch</code>; still specialised on each device</td><td>27</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Load once — it is a compile</h2>
<ul>
<li><code>try await MLModel.load(contentsOf:configuration:)</code>: compile (fast) <span class="math">→</span> instantiate  <span class="math">→</span> <strong>device specialisation</strong> (e.g. ANE compile) — seconds, minutes for big  models; cached. The Core ML instrument labels each load <em>prepare and cache</em> or  <em>cached</em>. So: load early, off the main thread, keep it loaded.</li>
<li><code>optimizationHints</code>: <code>reshapeFrequency = .infrequent</code> (17.4) lets a  flexible-shape model stay on the ANE (enumerated shapes are fastest);  <code>specializationStrategy = .fastPrediction</code> (18) buys latency with longer  specialisation, more memory and disk.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Compute units</h2>
<figure class="sheet-figure"><img src="coreml-vision-on-device-fig2.svg" width="272" height="59" alt="Core ML · Core AI · Vision — machine learning on the device — figure 2" loading="lazy"></figure>
<p><code>MLModel.availableComputeDevices</code> (17) lists what exists; <code>MLComputePlan</code> (17.4) gives each op’s supported and preferred device and estimated relative cost — the Xcode Core ML performance report shows the same, with hints why an op can’t run on a unit. iOS 26 <code>BGContinuedProcessingTask</code> can ask for <code>.gpu</code> in the background (entitlement; check <code>BGTaskScheduler.supportedResources</code>).</p>
</section>
<section class="sheet-section">
<h2>Predict</h2>
<ul>
<li>Sync <code>prediction(from:)</code> is <strong>not thread-safe</strong> — serialise it. Batch:  <code>predictions(fromBatch:)</code>. Async overload (17): thread-safe, responds to  cancellation, runs concurrently — <strong>cap in-flight calls</strong>: each holds its inputs and  outputs, so peak memory grows.</li>
<li><strong>Stateful</strong> (18): <code>makeState()</code> <span class="math">→</span> <code>MLState</code>, then  <code>prediction(from:using:)</code>; buffers (an LLM’s KV cache) update in place, calls on one  state must be serialised. WWDC24: Mistral 7B, 1.6<span class="math">×</span> faster with state (M3 Max).</li>
<li><code>MLTensor</code> (18): tensor maths on a compute device, dispatched asynchronously —  materialise (<code>shapedArray(of:)</code>) before reading. <strong>Multifunction</strong> (18): several  functions (e.g. adapters) share one set of base weights; pick with  <code>configuration.functionName</code>.</li>
<li><code>MLUpdateTask</code> (13): fine-tune an updatable model on user data, on the device.</li>
<li><strong>Encryption</strong> (14): Xcode makes a per-team <code>.mlmodelkey</code>; <code>--encrypt</code> at  compile; the first load fetches the key over the network, then it is stored — offline  first launch fails with <code>.modelKeyFetch</code>.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Compress — <code>coremltools.optimize</code></h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>technique</strong></th><th><strong>how</strong></th><th><strong>pays off on</strong></th></tr>
</thead>
<tbody>
<tr><td>palettize</td><td>k-means look-up table, {1,2,3,4,6,8} bits (iOS 16); per-grouped-channel + 8-bit LUT (18)</td><td>ANE: memory + latency; GPU: memory</td></tr>
<tr><td>linear quant.</td><td>int8 / int4 weights (per-block int4); <strong>W8A8</strong> = int8 activations too</td><td>W8A8: ANE of A17 Pro / M4; int4: Mac GPU</td></tr>
<tr><td>prune</td><td>zero small weights, store sparse</td><td>latency on ANE, CPU</td></tr>
<tr><td>joint</td><td>sparse + palettized or quantized</td><td>further gains</td></tr>
</tbody>
</table></p>
<p>Three workflows: <strong>data-free</strong> (<code>optimize.coreml</code>, seconds to minutes; 6–8-bit palettes or 8-bit weights rarely cost much accuracy, lower bits drop fast) · <strong>calibration</strong> (<span class="math">∼</span>128 samples, <code>optimize.torch</code>; e.g. 4-bit palettes) · <strong>fine-tuning</strong> (full training pipeline; best at <span class="math">≤</span>4 bits or <span class="math">≥</span>75 % sparsity). coremltools 8.0 (Sep 2024): stateful models, int4, 3-bit, blockwise; 9.0 (Nov 2025): iOS 26 targets, int8 model I/O.</p>
</section>
<section class="sheet-section">
<h2>The stack</h2>
<figure class="sheet-figure"><img src="coreml-vision-on-device-fig3.svg" width="304" height="97" alt="Core ML · Core AI · Vision — machine learning on the device — figure 3" loading="lazy"></figure>
<p><strong>Choose</strong>: an Apple task API if it already solves the task (real time, nothing to ship) <span class="math">→</span> Foundation Models for open-ended language or image reasoning (Apple Intelligence devices only) <span class="math">→</span> your own model in Core ML (any type, iOS 11+) or Core AI (iOS 27+) <span class="math">→</span> a server when the model is too big or needs world knowledge.</p>
</section>
<section class="sheet-section">
<h2>Core AI (iOS 27, WWDC26)</h2>
<ul>
<li>The inference engine behind Apple Intelligence, opened to apps, on every Apple-silicon  platform including watchOS. <code>pip install coreai-torch</code>: <code>torch.export</code> <span class="math">→</span>  <code>TorchConverter()</code> <span class="math">→</span> <code>save_asset(&quot;X.aimodel&quot;)</code>; <code>coreai.runtime</code> runs it from  Python to diff outputs against PyTorch.</li>
<li>Swift: <code>AIModel(contentsOf:)</code> <span class="math">→</span> <code>loadFunction(named:)</code> <span class="math">→</span>  <code>run(inputs:states:)</code>; states (a KV cache) are mutable views written in place;  non-escapable types keep it memory-safe without copies.</li>
<li>Specialisation = segment/plan/optimise (the slow part, can run AOT on your Mac) +  per-unit executables tied to device and OS. <code>AIModelCache</code>: look up, delete, set  retention, share across an app group; <code>AIModel.specialize(contentsOf:)</code> warms it.</li>
<li>Core AI instrument; Core AI Debugger traces a tensor to the Python line that made it;  Core AI Models repo; a Core AI language model plugs into Foundation Models.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Vision</h2>
<ul>
<li><strong>Swift API (iOS 18)</strong>: value-type requests, <code>try await req.perform(on:)</code> <span class="math">→</span>  typed observations; <code>ImageRequestHandler</code> runs several on one image. <code>VN*</code> classes  are the older Objective-C-era API.</li>
<li>Text (26 languages), barcodes, faces, poses, subject masks, classification, feature  prints, saliency, tracking. <code>CoreMLRequest</code> = your model + Vision’s scaling  (<code>cropAndScaleAction</code>) <span class="math">→</span> classification, pixel-buffer or feature-value results.</li>
<li><strong>26</strong>: <code>RecognizeDocumentsRequest</code> (paragraphs, tables, lists, barcodes),  <code>DetectLensSmudgeRequest</code> (A14 / M1+). <strong>27</strong>: tap-to-segment  <code>GenerateIterativeSegmentationRequest</code> (seed point, box or scribble; <span class="math">≤</span>13 points,  11 from a box; model fetched by <code>downloadAssets()</code>), Vision on watchOS, <code>OCRTool</code> +  <code>BarcodeReaderTool</code> for a <code>LanguageModelSession</code> (not in Simulator).</li>
<li>Coordinates are normalised 0–1 with a <strong>lower-left</strong> origin:  <code>rect.toImageCoordinates(size, origin: .upperLeft)</code> for UIKit.</li>
</ul>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">var</span> ocr <span class="hljs-operator">=</span> <span class="hljs-type">RecognizeTextRequest</span>()               <span class="hljs-comment">// iOS 18</span>
ocr.recognitionLevel <span class="hljs-operator">=</span> .accurate
<span class="hljs-keyword">let</span> lines <span class="hljs-operator">=</span> <span class="hljs-keyword">try</span> <span class="hljs-keyword">await</span> ocr.perform(on: cgImage)
  .compactMap { <span class="hljs-variable">$0</span>.topCandidates(<span class="hljs-number">1</span>).first<span class="hljs-operator">?</span>.string }
<span class="hljs-keyword">let</span> m <span class="hljs-operator">=</span> <span class="hljs-keyword">try</span> <span class="hljs-keyword">await</span> <span class="hljs-type">MLModel</span>.load(contentsOf: url, configuration: cfg)
<span class="hljs-keyword">let</span> box <span class="hljs-operator">=</span> <span class="hljs-keyword">try</span> <span class="hljs-type">CoreMLModelContainer</span>(model: m, featureProvider: <span class="hljs-literal">nil</span>)
<span class="hljs-keyword">let</span> out <span class="hljs-operator">=</span> <span class="hljs-keyword">try</span> <span class="hljs-keyword">await</span> <span class="hljs-type">CoreMLRequest</span>(model: box).perform(on: cgImage)</code></pre>
</section>
<section class="sheet-section">
<h2>Speech · Natural Language · Create ML · Foundation Models</h2>
<ul>
<li><strong>Speech</strong> (26): <code>SpeechAnalyzer</code> actor + modules <code>SpeechTranscriber</code>,  <code>DictationTranscriber</code>, <code>SpeechDetector</code>; audio in and results out as  <code>AsyncSequence</code>s; <code>AssetInventory</code> installs the language model. Older:  <code>SFSpeechRecognizer</code>.</li>
<li><strong>NL</strong>: <code>NLLanguageRecognizer</code>, <code>NLTokenizer</code>, <code>NLTagger</code>,  <code>NLEmbedding</code>; <code>NLContextualEmbedding</code> (17, BERT-style; <code>requestAssets</code> first).</li>
<li><strong>Create ML</strong>: image, object, hand-pose, action, style, text, word-tagger, sound,  activity, tabular models, trained on Apple’s feature extractors <span class="math">→</span> small files.</li>
<li><strong>Foundation Models</strong> (26): <code>SystemLanguageModel</code> = the <span class="math">∼</span>3B on-device model  (2 bits/weight, QAT); check <code>availability</code> (device, region, still downloading); the  model changes with the OS (26.0–26.3, 26.4, 27.0). 27: image prompts, any provider via  <code>LanguageModel</code> <span class="math">→</span> <code>llm-features-in-apps</code>.</li>
</ul>
</section>
