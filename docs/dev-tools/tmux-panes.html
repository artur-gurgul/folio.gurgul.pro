 class="title">tmux panes — split, move, resize, join, float</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">dev-tools · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> A <strong>pane</strong> is one pseudo-terminal running one program; panes tile a
<strong>window</strong>, windows make a <strong>session</strong>, and one <strong>server</strong> process owns them
all (socket in <code>$TMUX_TMPDIR</code> or <code>/tmp</code>), so detaching leaves every program running.
Keys are the <strong>prefix</strong> <code>C-b</code>, then the key. Moving a pane moves the terminal itself —
the program never restarts.</p>

<section class="sheet-section">
<h2>Default keys — after the prefix <code>C-b</code></h2>
<p><table class="sheet-table">
<tbody>
<tr><td><code><span class="c-sheetblue"><strong>split · close</strong></span><br>
%</code></td><td>split left | right — <code>split-window -h</code></td></tr>
<tr><td><code>&quot;</code></td><td>split top / bottom — <code>split-window</code> (<code>-v</code> is the default)</td></tr>
<tr><td><code>x</code></td><td>kill the pane after <code>y/n</code>; <code>exit</code> in its shell does the same</td></tr>
<tr><td><code>!</code></td><td>break the pane out into a window of its own</td></tr>
<tr><td><code><span class="c-sheetblue"><strong>focus</strong></span><br>
arrows<sup><span class="c-sheetorange"><strong>r</strong></span></sup></code></td><td>pane above / below / left / right (<code>select-pane -U -D -L -R</code>)</td></tr>
<tr><td><code>o  ;</code></td><td>next pane · last active pane (<code>l</code> last window, <code>L</code> last <em>session</em>)</td></tr>
<tr><td><code>q</code></td><td>number every pane (<code>display-panes</code>); a digit jumps there</td></tr>
<tr><td><code><span class="c-sheetblue"><strong>size</strong></span><br>
C-arrows<sup><span class="c-sheetorange"><strong>r</strong></span></sup></code></td><td>resize by 1 cell · <code>M-</code>arrows<sup><span class="c-sheetorange"><strong>r</strong></span></sup> by 5 cells (<code>resize-pane</code>)</td></tr>
<tr><td><code>z</code></td><td>zoom: the pane fills the window, <code>Z</code> on its tab; again to undo</td></tr>
<tr><td><code><span class="c-sheetblue"><strong>rearrange</strong></span><br>
{  }</code></td><td>swap with the previous / next pane (<code>swap-pane -U / -D</code>)</td></tr>
<tr><td><code>C-o  M-o</code></td><td>rotate every pane forwards / backwards (<code>rotate-window</code>)</td></tr>
<tr><td><code>Space</code></td><td>next preset layout · <code>M-1</code>…<code>M-7</code> pick one · <code>E</code> even out</td></tr>
<tr><td><code>m  M</code></td><td>mark this pane (toggle) · clear the mark; one marked pane at a time</td></tr>
<tr><td><code><span class="c-sheetblue"><strong>more</strong></span><br>
T</code></td><td>set the pane title (3.8) · <code>&gt;</code> pane menu · <code>&lt;</code> window menu</td></tr>
<tr><td><code>*</code></td><td>new floating pane (3.7) · <code>g</code> then 1–4 or an arrow: move it (3.8)</td></tr>
<tr><td><code>[  ]</code></td><td>copy mode (<code>PgUp</code>: enter + scroll) · paste the newest buffer</td></tr>
<tr><td><code>:  ?</code></td><td>command prompt · list every binding</td></tr>
<tr><td><code>C-b</code></td><td>send a literal <code>C-b</code> — reaches a nested, inner tmux</td></tr>
<tr><td><code>d  D</code></td><td>detach this client · choose a client to detach</td></tr>
<tr><td><code>Tab</code></td><td>fuzzy window switcher; <code>S-Tab</code> sessions (3.8)</td></tr>
</tbody>
</table></p>
<p><sup><span class="c-sheetorange"><strong>r</strong></span></sup> = bound with <code>bind -r</code>: repeats <em>without</em> the prefix while presses come within <code>repeat-time</code> (500 ms). Copy keys: vi <code>Space</code> begin, <code>Enter</code> copy; emacs <code>C-Space</code>, <code>M-w</code>.</p>
<p><strong>Mouse</strong> (<code>mouse on</code> — the default since 3.8): click selects a pane · drag a border resizes (<code>resize-pane -M</code>) · drag in a pane selects in copy mode · wheel up enters copy mode unless the program is full-screen or wants the mouse · right-click: pane menu · double / triple click copies a word / line · Ctrl-drag: new floating pane (3.8).</p>
</section>
<section class="sheet-section">
<h2>Pane commands — the flags that matter</h2>
<p><table class="sheet-table">
<tbody>
<tr><td><code>split-window</code></td><td><code>-h</code> side by side · <code>-v</code> stacked · <code>-b</code> before · <code>-f</code> full span · <code>-l 20</code> or <code>-l 30%</code> · <code>-c dir</code> · <code>-d</code> keep focus · <code>-Z</code> zoom it · <code>-I</code> empty pane fed from stdin</td></tr>
<tr><td><code>join-pane</code></td><td>split <code>-t</code> and move <code>-s</code> into the gap; same <code>-h -v -b -f -l -d</code>; the reverse of <code>break-pane</code>; 3.8: tiles a floating pane</td></tr>
<tr><td><code>move-pane</code></td><td>= <code>join-pane</code>; 3.8 adds moving floating panes</td></tr>
<tr><td><code>break-pane</code></td><td><code>-s</code> pane → own window · <code>-d</code> stay here · <code>-n name</code> · <code>-a / -b</code> after / before this index; 3.8: floats a tiled pane</td></tr>
<tr><td><code>resize-pane</code></td><td><code>-U -D -L -R</code> <span class="math">n</span> relative · <code>-x / -y</code> absolute, <span class="math">n</span> or <span class="math">n</span>% · <code>-Z</code> zoom · <code>-M</code> mouse drag · <code>-T</code> trim lines below cursor</td></tr>
<tr><td><code>swap-pane</code></td><td><code>-s -t</code>, or <code>-U / -D</code> neighbour · <code>-d</code> keep the active pane · <code>-Z</code> keep zoom</td></tr>
<tr><td><code>rotate-window</code></td><td><code>-U</code> / <code>-D</code> · <code>-Z</code> keep zoom</td></tr>
<tr><td><code>select-layout</code></td><td>a name, or <code>-n / -p</code> · <code>-E</code> spread this pane and its neighbours · <code>-o</code> undo</td></tr>
<tr><td><code>select-pane</code></td><td><code>-L -R -U -D</code> · <code>-m / -M</code> mark / clear · <code>-T</code> title · <code>-d / -e</code> block / allow input</td></tr>
<tr><td><code>kill-pane</code></td><td><code>-a</code> every pane except <code>-t</code>; the last pane takes its window with it</td></tr>
<tr><td><code>respawn-pane</code></td><td>rerun a dead pane’s command (<code>-k</code> kills a live one first)</td></tr>
<tr><td><code>capture-pane</code></td><td><code>-p</code> to stdout · <code>-S / -E</code> line range, negative = history · <code>-J</code> join wrapped lines · <code>-e</code> keep colours</td></tr>
<tr><td><code>pipe-pane</code></td><td>pipe a pane’s output to a command; <code>-o</code> opens only if none is open, so one key toggles</td></tr>
</tbody>
</table></p>
</section>

<section class="sheet-section">
<h2>Options that shape panes</h2>
<p><table class="sheet-table">
<thead>
<tr><th><code><strong>option</strong></code></th><th><strong>default</strong></th><th><strong>values · note</strong></th></tr>
</thead>
<tbody>
<tr><td><code>base-index</code></td><td>0</td><td>first window number; <code>pane-base-index</code> 0: first pane</td></tr>
<tr><td><code>synchronize-panes</code></td><td>off</td><td>input goes to every pane of the window not in a mode</td></tr>
<tr><td><code>remain-on-exit</code></td><td>off</td><td><code>on</code> · <code>failed</code> · <code>key</code> (3.7) · <code>failed-key</code> (3.8); then <code>respawn-pane</code></td></tr>
<tr><td><code>display-panes-time</code></td><td>1000 ms</td><td>how long the <code>C-b q</code> numbers stay</td></tr>
<tr><td><code>repeat-time</code></td><td>500 ms</td><td><sup><span class="c-sheetorange"><strong>r</strong></span></sup> keys; <code>initial-repeat-time</code> (3.6) 0 = the same</td></tr>
<tr><td><code>escape-time</code></td><td>10 ms</td><td>500 before 3.5: a 0.5 s wait after every <code>Esc</code></td></tr>
<tr><td><code>history-limit</code></td><td>2000</td><td>scrollback lines per pane</td></tr>
<tr><td><code>main-pane-width</code></td><td>80</td><td><code>main-pane-height</code> 24: the main pane of <code>main-*</code></td></tr>
<tr><td><code>pane-border-status</code></td><td>off</td><td><code>top</code> · <code>bottom</code>: a title line on each border</td></tr>
<tr><td><code>pane-border-lines</code></td><td>single</td><td><code>double</code> · <code>heavy</code> · <code>simple</code> · <code>number</code> · <code>spaces</code> (3.6)</td></tr>
<tr><td><code>pane-scrollbars</code></td><td>off</td><td><code>modal</code> · <code>on</code> (3.6) · <code>auto-hide</code> (3.8)</td></tr>
<tr><td><code>mouse</code></td><td>on</td><td><code>off</code> before 3.8</td></tr>
<tr><td><code>focus-follows-mouse</code></td><td>off</td><td>hover selects the pane (3.7; needs <code>mouse</code>)</td></tr>
<tr><td><code>mode-keys</code></td><td>emacs</td><td><code>vi</code> if <code>$VISUAL</code> or <code>$EDITOR</code> contains “vi”</td></tr>
<tr><td><code>renumber-windows</code></td><td>off</td><td>windows keep the gap a closed one leaves</td></tr>

<section class="sheet-section">
<h2>Saving layouts: resurrect + continuum</h2>
<p>Plugins via TPM: <code>set -g @plugin &#39;tmux-plugins/tmux-resurrect&#39;</code>, <code>prefix I</code> installs. <strong>resurrect</strong>: <code>prefix C-s</code> save · <code>prefix C-r</code> restore sessions, windows, panes and their order, layouts, working directories, the active pane; reruns only <code>vi vim nvim emacs
man less more tail top htop irssi weechat mutt</code>; pane text with <code>@resurrect-capture-pane-contents &#39;on&#39;</code>; files in <code>~/.tmux/resurrect</code>; panes that exist are left alone. <strong>continuum</strong>: autosave every 15 min (<code>@continuum-save-interval</code>, <code>0</code> = off), <code>@continuum-restore &#39;on&#39;</code> restores at server start. It hooks <code>status-right</code>: status line on, plugin listed last — a theme that rewrites <code>status-right</code> stops the autosave silently.</p>
</section>
<section class="sheet-section">
<h2>Recipes</h2>
<pre class="sheet-code"><code class="hljs language-plaintext"># terminal on the right, 30 %, same directory
tmux split-window -h -l 30% -c &#x27;#{pane_current_path}&#x27;
# type into every pane of this window (off to stop)
tmux set -w synchronize-panes on
# last 200 lines of pane %3 as text
tmux capture-pane -p -S -200 -t %3
# log a pane to a file; the same key stops it (man page)
bind-key C-p pipe-pane -o &#x27;cat &gt;&gt;~/output.#I-#P&#x27;</code></pre>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap"><code>-h</code> is side by side: tmux names the split by how the panes line up, Vim names the  same split <code>:vsplit</code>.</li>
<li class="trap">A forgotten mark: <code>join-pane</code>, <code>move-pane</code>, <code>swap-pane</code> without <code>-s</code>  take the <strong>marked</strong> pane — <code>C-b M</code> clears it.</li>
<li class="trap"><code>M-</code>keys type symbols on a Mac until Option sends Meta: Terminal <em>Use Option
 as Meta key</em>; iTerm2 Option key <em>Esc+</em>.</li>
<li class="trap">With mouse on, the terminal’s own selection needs <strong>Shift</strong> (many Linux  terminals) or <strong>Option</strong> (iTerm2).</li>
</ul>
</section>
