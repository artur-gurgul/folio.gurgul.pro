etails></nav></div><div class="scroll"></div></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">Where data leaks on a phone — and what to wipe</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">security · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> Putting the token in the Keychain secures <em>one</em> copy. The OS makes more
copies for you: the <strong>keyboard</strong> learns what is typed, the <strong>app switcher</strong> photographs
the screen, <strong>URLCache</strong> writes API responses to <code>Cache.db</code>, <strong>logs</strong>, <strong>backups</strong>,
the <strong>pasteboard</strong>, <strong>notifications</strong>, <strong>Spotlight</strong> and your <strong>SDKs</strong> keep
theirs. MASVS-STORAGE-2 (“prevents leakage”) and PLATFORM-3 (“UI used securely”) are about
<em>those</em> copies — and logout must delete every one.</p>
<p class="sheet-tools"><a class="sheet-download" href="mobile-data-leakage.pdf" download>Download PDF</a> <a href="mobile-data-leakage.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/security/mobile-data-leakage.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="mobile-data-leakage-fig1.svg" width="619" height="196" class="wide" alt="Where data leaks on a phone — and what to wipe — figure 1" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">The mechanisms</span></h3>
<ul>
<li><strong>Keyboard</strong>: autocorrect / predictive text learn from non-secure fields. Secret  <span class="math">→</span> <code>isSecureTextEntry</code> (no copy; system keyboard only; no learning<span class="unverified">(unverified)</span>).  Sensitive but visible (IBAN, card) <span class="math">→</span> <code>autocorrectionType = .no</code>,  <code>spellCheckingType = .no</code>. Block custom keyboards:  <code>shouldAllowExtensionPointIdentifier</code> <span class="math">→</span> <code>false</code> for <code>.keyboard</code>.  Android: <code>flagNoPersonalizedLearning</code>.</li>
<li><strong>Snapshot</strong>: Apple — after the background delegate <em>returns</em>, UIKit takes the  image shown in the switcher and at relaunch. Hide it in <code>sceneDidEnterBackground</code>;  SwiftUI: overlay unless <code>scenePhase</code> is <code>.active</code>.</li>
<li><strong>Capture</strong>: iOS only <em>tells</em> you — <code>userDidTakeScreenshotNotification</code>  (after the fact); <code>UIScreen.isCaptured</code> (iOS 11, deprecated in 27) <span class="math">→</span>  <code>sceneCaptureState</code> trait (iOS 17) for recording + mirroring. Android <code>FLAG_SECURE</code> <em>blocks</em> screenshots,  recording and the Recents thumbnail; 14 detects screenshots, 15 recording.</li>
<li><strong>URLCache</strong>: <code>URLSession.shared</code> caches cacheable responses in memory + on disk.  Fix at the source (<code>no-store</code>), or per session (<code>.ephemeral</code>: nothing on disk), or  per response (<code>willCacheResponse</code> <span class="math">→</span> <code>nil</code>).</li>
<li><strong>Backups</strong>: Documents + Library (not Caches/tmp) go to iCloud / Finder;  Keychain items restore to another device unless <code>…ThisDeviceOnly</code>.  <code>isExcludedFromBackup</code> is for caches/support files — Apple: edits to user documents  can reset it. Android: <code>allowBackup</code> defaults <code>true</code> (Auto Backup, 25 MB/app, Google  Drive); 12+: <code>dataExtractionRules</code> splits <code>&lt;cloud-backup&gt;</code> / <code>&lt;device-transfer&gt;</code>  — <code>allowBackup=&quot;false&quot;</code> may not stop device-to-device transfer.</li>
<li><strong>Pasteboard</strong>: <code>setItems(_:options:)</code> + <code>.localOnly</code> (no Universal  Clipboard) + <code>.expirationDate</code>. iOS 16+ prompts before a programmatic paste  (<code>UIPasteControl</code> doesn’t). Android 13+: <code>EXTRA_IS_SENSITIVE</code> hides the preview.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Example — the logout wipe (server first, then every copy)</span></h3>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">func</span> <span class="hljs-title function_">logOut</span>() <span class="hljs-keyword">async</span> {
  <span class="hljs-keyword">try?</span> <span class="hljs-keyword">await</span> api.revokeSession()   <span class="hljs-comment">// refresh token + push token</span>
  <span class="hljs-type">Keychain</span>.deleteAll(service: <span class="hljs-string">&quot;auth&quot;</span>)          <span class="hljs-comment">// SecItemDelete</span>
  <span class="hljs-type">URLCache</span>.shared.removeAllCachedResponses()   <span class="hljs-comment">// Cache.db</span>
  <span class="hljs-type">HTTPCookieStorage</span>.shared.removeCookies(since: .distantPast)
  <span class="hljs-keyword">await</span> <span class="hljs-type">WKWebsiteDataStore</span>.default().removeData(
    ofTypes: <span class="hljs-type">WKWebsiteDataStore</span>.allWebsiteDataTypes(),
    modifiedSince: .distantPast)               <span class="hljs-comment">// WebView store</span>
  <span class="hljs-type">UserDefaults</span>.standard.removePersistentDomain(
    forName: <span class="hljs-type">Bundle</span>.main.bundleIdentifier<span class="hljs-operator">!</span>)
  <span class="hljs-keyword">try?</span> <span class="hljs-type">FileManager</span>.default.removeItem(at: userDir)  <span class="hljs-comment">// DB, drafts</span>
  imageCache.clearDisk(); memoryCaches.removeAll()
  <span class="hljs-keyword">try?</span> <span class="hljs-keyword">await</span> <span class="hljs-type">CSSearchableIndex</span>.default()
            .deleteAllSearchableItems()        <span class="hljs-comment">// Spotlight</span>
  <span class="hljs-type">UIPasteboard</span>.general.items <span class="hljs-operator">=</span> []   <span class="hljs-comment">// only if WE put a secret there</span>
  router.reset()                    <span class="hljs-comment">// no stale screens in memory</span>
}</code></pre>
<p>Put per-user data under <strong>one directory</strong> (+ one App Group folder for extensions) so “delete the user” is one call — then test it: log out, grep the container.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Also leaks</span></h3>
<p>Android accessibility services read the screen · exported content providers · App Group containers + widgets · WebView form data · the state-restoration archive (same rule as the snapshot).</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap">“The token is in the Keychain, done” — the <em>response</em> that carried it may sit in  <code>Cache.db</code>, a log line, a crash breadcrumb.</li>
<li class="trap">Covering the UI in <code>applicationWillTerminate</code> — not called on suspend; the snapshot  follows <code>sceneDidEnterBackground</code>.</li>
<li class="trap">“We block screenshots on iOS” — you can’t; detect, and hide while captured.</li>
<li class="trap"><code>Library/Caches</code> is not <em>backed up</em> but is still <em>on the device</em> —  a filesystem dump reads it.</li>
<li class="trap">Logout that only drops the in-memory token: the refresh token still works server-side.</li>
<li class="trap">RN: <code>AsyncStorage</code> is a plain unencrypted store — never tokens.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Remember</span></h3>
<p><strong>“Seen, stored, sent.”</strong> Every secret has copies the user <em>sees</em> (screen, keyboard, clipboard), the OS <em>stores</em> (cache, logs, backups) and SDKs <em>send</em>. Logout = server revoke + delete every copy.</p>
</section>
