g></summary></details></nav></div><div class="scroll"></div></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">WebView &amp; JS-bridge security — WKWebView, React Native</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">security · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> A WebView runs <em>someone’s</em> JavaScript inside your app. The <strong>bridge</strong>
(WebKit message handlers, React Native <em>postMessage</em>, Android <em>addJavascriptInterface</em>)
hands that JavaScript native powers — and it is reachable by <strong>every script in every frame</strong>
of whatever page is loaded. Treat each message as untrusted input: <strong>check the origin and
frame, allowlist commands, restrict navigation</strong>, pass data to JS as <em>values</em>, never as code.</p>
<p class="sheet-tools"><a class="sheet-download" href="webview-bridge-security.pdf" download>Download PDF</a> <a href="webview-bridge-security.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/security/webview-bridge-security.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="webview-bridge-security-fig1.svg" width="663" height="182" class="wide" alt="WebView &amp; JS-bridge security — WKWebView, React Native — figure 1" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">iOS</span></h3>
<ul>
<li><strong>UIWebView</strong> (deprecated iOS 12) ran web content <em>in your process</em>; the App  Store refused new apps using it from Apr 2020. <strong>WKWebView</strong>: separate WebContent  process, Safari’s engine + JIT.</li>
<li>Bridge: <code>userContentController.add(handler, name: &quot;app&quot;)</code> <span class="math">→</span> JS  <code>window.webkit.messageHandlers.app.postMessage(obj)</code> (JSON-like types). The handler gets  a <code>WKScriptMessage</code>: <code>body</code>, <code>frameInfo</code> (<code>isMainFrame</code>, <code>request</code>,  <code>securityOrigin</code>), <code>world</code>. Reply: <code>WKScriptMessageHandlerWithReply</code> (iOS 14) —  JS gets a Promise.</li>
<li><strong>Content worlds</strong> (iOS 14): <code>.page</code>, <code>.defaultClient</code>, <code>.world(name:)</code>;  <code>add(_:contentWorld:name:)</code> exposes a handler <em>only</em> in that world.</li>
<li><strong>Native <span class="math">→</span> JS</strong>: <code>evaluateJavaScript(&quot;show(&#39;\(name)&#39;)&quot;)</code> is  injection (a quote in <code>name</code> ends the string).  <code>callAsyncJavaScript(_:arguments:in:contentWorld:)</code> passes <em>values</em>.</li>
<li><strong>Navigation</strong>: <code>decidePolicyFor</code> — allow https + your hosts; others <span class="math">→</span>  Safari; cancel <code>javascript:</code>, <code>file:</code>, <code>data:</code>, custom schemes. iOS 14  <code>WKAppBoundDomains</code> + <code>limitsNavigationsToAppBoundDomains</code> disable script  injection / handlers elsewhere.</li>
<li><strong>Files</strong>: <code>loadFileURL(_:allowingReadAccessTo:)</code> — the narrowest directory,  never the whole container. <strong>Debug</strong>: <code>isInspectable</code> (iOS 16.4, default false) —  keep it off in release.</li>
<li>The controller <strong>retains</strong> its handlers <span class="math">→</span> handler <span class="math">→</span> VC <span class="math">→</span> WebView cycle:  weak proxy, or <code>removeScriptMessageHandler(forName:)</code>.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Android</span></h3>
<p><code>addJavascriptInterface</code>: every <code>@JavascriptInterface</code> method, to every frame and origin (before API 17: reflection <span class="math">→</span> RCE). Prefer AndroidX <code>WebViewCompat.addWebMessageListener</code> with <code>allowedOriginRules</code> — the listener gets <code>sourceOrigin</code> + <code>isMainFrame</code>. <code>setAllowFileAccess</code> defaults <code>false</code> from API 30. <code>shouldOverrideUrlLoading</code> = <code>decidePolicyFor</code>.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Example — a checked bridge (Swift) and RN</span></h3>

  }
}

                    <span class="hljs-keyword">if</span> (m &amp;&amp; <span class="hljs-title function_">allowed</span>(m)) <span class="hljs-title function_">run</span>(m) }}   <span class="hljs-comment">// string in</span>

<h3 class="sheet-hd"><span class="c-sheetblue">React Native WebView — the traps</span></h3>
<ul>
<li><code>onMessage</code> receives <code>window.ReactNativeWebView.postMessage(string)</code> — a  <strong>string only</strong>, with no verified sender: any script the page runs can post.</li>
<li><code>originWhitelist</code> (default <code>http://*</code>, <code>https://*</code>) lists origins the WebView  may <strong>navigate</strong> to; others are handed to the OS. It does <em>not</em> filter messages.</li>
<li><code>onShouldStartLoadWithRequest</code>: <code>false</code> blocks; not called on Android’s first load.</li>
<li><code>injectedJavaScriptObject</code> is visible to <em>all</em> frames;  <code>injectedJavaScriptForMainFrameOnly</code> defaults <code>true</code>.</li>
<li><strong>GHSA-36j3-xxf7-4pqg / CVE-2020-6506</strong> (Sep 2020, moderate): Android WebView before  83.0.4103.106 let a cross-origin <strong>iframe</strong> run code in the top document (UXSS);  <code>react-native-webview</code> <span class="math">≤</span> 10.10.2 exposed, 11.0.0 mitigates —  <code>setSupportMultipleWindows=false</code> re-opens it.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap">“It’s our own page” — until a CDN script, an ad or one XSS runs on it.</li>
<li class="trap">Login / OAuth in an embedded WebView: the app can read the password;  RFC 8252 says use the system browser (<code>ASWebAuthenticationSession</code>).</li>
<li class="trap">Injecting the refresh token into JS for the web part — any page script can read it.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Remember</span></h3>
<p><strong>“Who sent it, may they, is it well-formed?”</strong> — then values out, never code.</p>
