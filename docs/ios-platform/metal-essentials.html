nd" stroke-linejoin="round"></path></svg></summary></details></nav></div><div class="scroll"></div></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">Metal — device, pipelines, command buffers, frames in flight</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">ios-platform · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> Metal is Apple’s low-overhead GPU API. You build the <strong>expensive</strong> objects
<strong>once</strong> — device, command queue, <strong>pipeline states</strong> compiled from MSL shaders, buffers,
textures — and every frame <strong>record</strong> commands into a transient <strong>command buffer</strong> through
<strong>encoders</strong> (render / compute / blit), <code>commit()</code> it, and the GPU runs it
<strong>asynchronously</strong> while the CPU prepares the next frame. Correctness then hinges on one rule:
the CPU must not overwrite data the GPU is still reading.</p>
<p class="sheet-tools"><a class="sheet-download" href="metal-essentials.pdf" download>Download PDF</a> <a href="metal-essentials.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/ios-platform/metal-essentials.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="metal-essentials-fig1.svg" width="659" height="154" class="wide" alt="Metal — device, pipelines, command buffers, frames in flight — figure 1" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">How it works</span></h3>
<ul>
<li><strong>Lifetimes</strong>: device, queue, library, pipeline states (render / compute) and big  resources are long-lived; pipeline compilation is the classic first-use hitch — build at  load (or cache with <code>MTLBinaryArchive</code>). Command buffers and encoders are cheap and  single-use.</li>
<li><strong>Storage modes</strong>: <code>.shared</code> — CPU + GPU, one copy in unified memory;  <code>.private</code> — GPU only, fastest for static meshes and render targets (fill via a blit);  <code>.memoryless</code> — lives only in tile memory during a pass (depth, MSAA): no RAM at all.  Single-use data under <strong>4 KB</strong>: <code>setVertexBytes</code>, no buffer.</li>
<li><strong>Tile-based GPUs</strong>: Apple GPUs shade on-chip tiles, then write out. A pass’s  <code>loadAction</code> (<code>.clear</code> / <code>.dontCare</code> vs <code>.load</code>) and <code>storeAction</code>  (<code>.dontCare</code> vs <code>.store</code>) decide the memory traffic — never load or store what you  do not need.</li>
<li><strong>MSL</strong> is C++-based: <code>vertex</code>, <code>fragment</code> and <code>kernel</code> functions; bindings by  attribute — <code>[[buffer(n)]]</code>, <code>[[texture(n)]]</code>, <code>[[vertex_id]]</code>,  <code>[[stage_in]]</code>, <code>[[position]]</code>, <code>[[thread_position_in_grid]]</code>. Clip space: x, y in <span class="math">-1</span>…<span class="math">1</span> (y up), depth 0…1;  texture coordinates start top-left.</li>
<li><strong>MTKView</strong> (MetalKit) wraps a <code>CAMetalLayer</code>. Modes: timer (default,  <code>preferredFramesPerSecond</code> = 60) · on <code>setNeedsDisplay</code> (<code>isPaused</code> +  <code>enableSetNeedsDisplay</code>) · explicit <code>draw()</code>. Reading  <code>currentRenderPassDescriptor</code> acquires the drawable — do it <strong>as late as
 possible</strong>; the drawable pool is tiny.</li>
<li><strong>Background</strong>: iOS refuses GPU work from a backgrounded app (the command buffer  fails) — pause on resign-active. iOS 26 exception:  <code>BGContinuedProcessingTask</code> + the background-GPU entitlement, where  <code>supportedResources</code> includes <code>.gpu</code>.</li>
<li><strong>Metal 4</strong> (iOS 26, A14 / M1 and later), opt-in beside the classic API:  <code>MTL4CommandQueue</code>; command buffers made by the <em>device</em> with your own  <code>MTL4CommandAllocator</code>; <code>MTL4ArgumentTable</code> for bindings; <code>MTL4Compiler</code> for  explicit shader compilation; residency sets; <code>MTLTensor</code> + an ML encoder; MetalFX  frame interpolation.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Example — the frame loop (MTKViewDelegate)</span></h3>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">func</span> <span class="hljs-title function_">draw</span>(<span class="hljs-params">in</span> <span class="hljs-params">view</span>: <span class="hljs-type">MTKView</span>) {
  inFlight.wait()                          <span class="hljs-comment">// at most 3 frames ahead</span>
  <span class="hljs-keyword">let</span> u <span class="hljs-operator">=</span> uniforms[frame <span class="hljs-operator">%</span> <span class="hljs-number">3</span>]; frame <span class="hljs-operator">+=</span> <span class="hljs-number">1</span>  <span class="hljs-comment">// THIS frame&#x27;s copy only</span>
  write(time: <span class="hljs-type">CACurrentMediaTime</span>(), into: u)
  <span class="hljs-keyword">guard</span> <span class="hljs-keyword">let</span> cb <span class="hljs-operator">=</span> queue.makeCommandBuffer(),
        <span class="hljs-keyword">let</span> rpd <span class="hljs-operator">=</span> view.currentRenderPassDescriptor,   <span class="hljs-comment">// drawable: late</span>
        <span class="hljs-keyword">let</span> enc <span class="hljs-operator">=</span> cb.makeRenderCommandEncoder(descriptor: rpd),
        <span class="hljs-keyword">let</span> drawable <span class="hljs-operator">=</span> view.currentDrawable
  <span class="hljs-keyword">else</span> { inFlight.signal(); <span class="hljs-keyword">return</span> }       <span class="hljs-comment">// never leak a slot</span>
  enc.setRenderPipelineState(pipeline)     <span class="hljs-comment">// built once, at load</span>
  enc.setVertexBuffer(u, offset: <span class="hljs-number">0</span>, index: <span class="hljs-number">0</span>)
  enc.drawPrimitives(type: .triangle, vertexStart: <span class="hljs-number">0</span>, vertexCount: <span class="hljs-number">3</span>)
  enc.endEncoding(); cb.present(drawable)
  cb.addCompletedHandler { [inFlight] <span class="hljs-keyword">_</span> <span class="hljs-keyword">in</span> inFlight.signal() }
  cb.commit()                              <span class="hljs-comment">// GPU starts; CPU moves on</span>
}</code></pre>
<h3 class="sheet-hd"><span class="c-sheetblue">Shaders — vertex, fragment, compute (MSL)</span></h3>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">VOut</span> { float4 pos [[position]]; float4 color; };
vertex <span class="hljs-type">VOut</span> vmain(uint id [[vertex_id]],
                  constant float2 <span class="hljs-operator">*</span>pts [[buffer(<span class="hljs-number">0</span>)]]) {
  <span class="hljs-keyword">return</span> { float4(pts[id], <span class="hljs-number">0</span>, <span class="hljs-number">1</span>), float4(<span class="hljs-number">1</span>, <span class="hljs-number">0.5</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>) }; }
fragment float4 fmain(<span class="hljs-type">VOut</span> <span class="hljs-keyword">in</span> [[stage_in]]) { <span class="hljs-keyword">return</span> <span class="hljs-keyword">in</span>.color; }
kernel void invert(texture2d<span class="hljs-operator">&lt;</span>float, access::read<span class="hljs-operator">&gt;</span>  src [[texture(<span class="hljs-number">0</span>)]],
                   texture2d<span class="hljs-operator">&lt;</span>float, access::write<span class="hljs-operator">&gt;</span> dst [[texture(<span class="hljs-number">1</span>)]],
                   uint2 gid [[thread_position_in_grid]]) {
  <span class="hljs-keyword">if</span> (gid.x <span class="hljs-operator">&gt;=</span> dst.get_width() <span class="hljs-operator">||</span> gid.y <span class="hljs-operator">&gt;=</span> dst.get_height()) <span class="hljs-keyword">return</span>;
  float4 c <span class="hljs-operator">=</span> src.read(gid); dst.write(float4(<span class="hljs-number">1</span> <span class="hljs-operator">-</span> c.rgb, c.a), gid); }</code></pre>
<h3 class="sheet-hd"><span class="c-sheetblue">SwiftUI shaders (iOS 17) — Metal without the setup</span></h3>
<p><code>[[ stitchable ]]</code> MSL functions from <code>ShaderLibrary</code>; SwiftUI passes <code>position</code> (+ colour or layer), you pass <code>.float</code>, <code>.float2</code>, <code>.color</code>, <code>.image</code> arguments:

</tbody>
</table></p>
<pre class="sheet-code"><code class="hljs language-swift">#include <span class="hljs-operator">&lt;</span>metal_stdlib<span class="hljs-operator">&gt;</span>
#include <span class="hljs-operator">&lt;</span><span class="hljs-type">SwiftUI</span><span class="hljs-operator">/</span><span class="hljs-type">SwiftUI_Metal</span>.h<span class="hljs-operator">&gt;</span>
using namespace metal;
[[ stitchable ]] half4 wave(float2 p, SwiftUI::<span class="hljs-type">Layer</span> layer, float t) {
  <span class="hljs-keyword">return</span> layer.sample(float2(p.x, p.y <span class="hljs-operator">+</span> <span class="hljs-number">6</span> <span class="hljs-operator">*</span> sin(p.x <span class="hljs-operator">/</span> <span class="hljs-number">20</span> <span class="hljs-operator">+</span> t))); }
<span class="hljs-type">Text</span>(<span class="hljs-string">&quot;Hello&quot;</span>).layerEffect(<span class="hljs-type">ShaderLibrary</span>.wave(.float(t)),   <span class="hljs-comment">// Swift</span>
                          maxSampleOffset: <span class="hljs-type">CGSize</span>(width: <span class="hljs-number">0</span>, height: <span class="hljs-number">6</span>))</code></pre>
<h3 class="sheet-hd"><span class="c-sheetblue">Where an app developer meets Metal</span></h3>
<p>SwiftUI shaders · Core Image kernels · camera / video frames as textures (<code>CVMetalTextureCache</code>) · MPS, MPSGraph, Core ML on the GPU · SpriteKit, SceneKit, RealityKit, <code>drawingGroup()</code> · games (MetalFX).</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap">Pipeline or queue built per frame — compile stalls.</li>
<li class="trap">CPU rewrites a buffer the GPU still reads — flicker.</li>
<li class="trap">Early <code>return</code> without <code>signal()</code> — frozen after 3 frames.</li>
<li class="trap"><code>waitUntilCompleted()</code> on main — CPU, GPU in series.</li>
<li class="trap"><code>.load</code> / <code>.store</code> on every attachment — wasted bandwidth.</li>
<li class="trap">Sampling off <code>position</code> with no <code>maxSampleOffset</code>.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Remember</span></h3>
<h3 class="sheet-hd">“Compile once, record every frame, commit and let go — three buffers, one semaphore.”</h3>
