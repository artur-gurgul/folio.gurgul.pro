noscript id="page"><div class="content folio-page"><h1 class="title">HealthKit — authorization, data model, queries, sync</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">ios-platform · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> HealthKit is an <strong>on-device, encrypted store</strong> shared by apps, reached via <strong>one long-lived <code>HKHealthStore</code></strong>. Access is <strong>per type and per direction</strong>
(read / share); <strong>read status is never revealed</strong> — a denied read looks like “no data”.
Data = <strong>immutable samples</strong>; totals come from <strong>statistics queries</strong>
(they de-duplicate iPhone + Watch), changes from <strong>observer + anchored</strong> ones.</p>
<p class="sheet-tools"><a class="sheet-download" href="healthkit.pdf" download>Download PDF</a> <a href="healthkit.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/ios-platform/healthkit.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="healthkit-fig1.svg" width="636" height="163" class="wide" alt="HealthKit — authorization, data model, queries, sync — figure 1" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">How it works</span></h3>
<ul>
<li><strong>Setup</strong>: HealthKit capability (+ <em>Clinical Health Records</em> only if used); plist  <code>NSHealthShareUsageDescription</code> (<strong>read</strong>), <code>NSHealthUpdateUsageDescription</code>  (<strong>write</strong>). Xcode adds <code>healthkit</code> to <em>required device capabilities</em> — remove it if optional.</li>
<li><strong>Availability</strong>: <code>isHealthDataAvailable()</code> first. iPhone, Watch, visionOS; iPad only from  <strong>iPadOS 17</strong>; macOS links the framework but gets <code>false</code>. <strong>One store per app</strong>, kept.</li>
<li><strong>Authorization</strong>: <code>requestAuthorization(toShare:read:)</code>, per type. The sheet shows only for  types <em>not yet decided</em>, then returns at once. <strong>Success <span class="math">=</span> processed, not granted</strong>.  <code>authorizationStatus(for:)</code> reports <strong>share only</strong>; <code>getRequestStatusForAuthorization</code>  says whether a prompt would show.</li>
<li><strong>Read denied</strong> <span class="math">⇒</span> you see only <em>your own</em> samples — so “has diabetes data”  cannot leak through an error.</li>
<li><strong>Writing</strong>: build an <code>HKQuantitySample</code>, <code>save</code>. You may <strong>delete only what you
 saved</strong>. To “edit”: <code>HKMetadataKeySyncIdentifier</code> + a higher <code>HKMetadataKeySyncVersion</code>  <span class="math">→</span> HealthKit replaces the old sample. <code>HKMetadataKeyWasUserEntered</code> marks manual entries.</li>
<li><strong>Locked device</strong>: reads fail with <code>errorDatabaseInaccessible</code>; <strong>saves still
 work</strong> — staged, merged on unlock.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Example — steps per day, last 7 days (async, iOS 15.4+)</span></h3>
<pre class="sheet-code"><code class="hljs language-swift"><span class="hljs-keyword">let</span> store <span class="hljs-operator">=</span> <span class="hljs-type">HKHealthStore</span>()             <span class="hljs-comment">// one per app, keep it</span>
<span class="hljs-keyword">let</span> steps <span class="hljs-operator">=</span> <span class="hljs-type">HKQuantityType</span>(.stepCount)
<span class="hljs-keyword">guard</span> <span class="hljs-type">HKHealthStore</span>.isHealthDataAvailable() <span class="hljs-keyword">else</span> { <span class="hljs-keyword">return</span> }
<span class="hljs-keyword">try</span> <span class="hljs-keyword">await</span> store.requestAuthorization(toShare: [], read: [steps])
<span class="hljs-comment">// returning = sheet dismissed, NOT &quot;granted&quot;; denied read = empty</span>
<span class="hljs-keyword">let</span> cal <span class="hljs-operator">=</span> <span class="hljs-type">Calendar</span>.current
<span class="hljs-keyword">let</span> start <span class="hljs-operator">=</span> cal.date(byAdding: .day, value: <span class="hljs-operator">-</span><span class="hljs-number">6</span>, to: cal.startOfDay(for: .now))<span class="hljs-operator">!</span>
<span class="hljs-keyword">let</span> week <span class="hljs-operator">=</span> <span class="hljs-type">HKQuery</span>.predicateForSamples(withStart: start, end: .now)
<span class="hljs-keyword">let</span> q <span class="hljs-operator">=</span> <span class="hljs-type">HKStatisticsCollectionQueryDescriptor</span>(
  predicate: .quantitySample(type: steps, predicate: week),
  options: .cumulativeSum,             <span class="hljs-comment">// merges iPhone + Watch overlap</span>
  anchorDate: start,                   <span class="hljs-comment">// buckets start at midnight</span>
  intervalComponents: <span class="hljs-type">DateComponents</span>(day: <span class="hljs-number">1</span>))
<span class="hljs-keyword">let</span> days <span class="hljs-operator">=</span> <span class="hljs-keyword">try</span> <span class="hljs-keyword">await</span> q.result(for: store)  <span class="hljs-comment">// results(for:) = live updates</span>
days.enumerateStatistics(from: start, to: .now) { s, <span class="hljs-keyword">_</span> <span class="hljs-keyword">in</span>
  <span class="hljs-built_in">print</span>(s.startDate, s.sumQuantity()<span class="hljs-operator">?</span>.doubleValue(for: .count()) <span class="hljs-operator">??</span> <span class="hljs-number">0</span>) }</code></pre>
<h3 class="sheet-hd"><span class="c-sheetblue">Workouts</span></h3>
<p><strong>watchOS</strong>: <code>HKWorkoutSession</code> + <code>HKLiveWorkoutBuilder</code>. <strong>iOS 17</strong>: <code>HKWorkoutSession</code> on iPhone/iPad (a Watch session can <code>startMirroringToCompanionDevice</code>). <strong>iOS 26</strong>: <code>HKLiveWorkoutBuilder</code> on iPhone/iPad — standalone: <code>prepare()</code> (countdown) <span class="math">→</span> <code>startActivity</code> + <code>beginCollection</code> <span class="math">→</span> delegate streams metrics <span class="math">→</span> <code>stopActivity</code>, end, <code>finishWorkout()</code>. Heart rate needs an external strap; the phone locks <span class="math">→</span> show a Live Activity. Logging one after the fact: <code>HKWorkoutBuilder</code>.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Why summing raw samples over-counts</span></h3>
<figure class="sheet-figure"><img src="healthkit-fig2.svg" width="331" height="58" alt="HealthKit — authorization, data model, queries, sync — figure 2" loading="lazy"></figure>
<p><strong>Statistics queries merge overlapping sources</strong>, as Health does; summing raw samples (or <code>.separateBySource</code> totals) double-counts.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">The query family</span></h3>
<p><table class="sheet-table">
<thead>
<tr><th><strong>HK…Query</strong></th><th><strong>Returns</strong></th><th><strong>Use for</strong></th></tr>
</thead>
<tbody>
<tr><td><code>Sample</code></td><td>snapshot; sort, limit</td><td>latest readings</td></tr>
<tr><td><code>Statistics</code></td><td>one sum / avg / min / max</td><td>today’s total</td></tr>
<tr><td><code>StatisticsCollection</code></td><td>a statistic per interval</td><td>steps per day</td></tr>
<tr><td><code>AnchoredObject</code></td><td>adds + deletes + anchor</td><td>server sync</td></tr>
<tr><td><code>Observer</code></td><td>“changed” — no data</td><td>trigger, wake</td></tr>
</tbody>
</table></p>
<p>Async <code>…QueryDescriptor</code> (iOS 15.4+): <code>result(for:)</code> one-shot, <code>results(for:)</code> an <code>AsyncSequence</code> of updates. Persist <code>HKQueryAnchor</code> (<code>NSSecureCoding</code>).</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Clinical records and App Review</span></h3>
<p><code>HKClinicalRecord</code>: FHIR (allergies, meds, labs), <strong>read-only</strong>, own plist key. <strong>5.1.3(i)</strong>: no health data for ads, marketing or data mining; third parties only for health research, with permission. <strong>(ii)</strong>: no false data, <strong>no personal health information in iCloud</strong>. <strong>2.5.1</strong>: health/fitness use, integrate with Health.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap">“Was read denied?” is unknowable — design the empty state instead.</li>
<li class="trap">Observer created in a view controller: a background wake finds no query. Register at launch.</li>
<li class="trap"><code>doubleValue(for:)</code> with an incompatible unit throws an ObjC exception — a crash, not a Swift error.</li>
<li class="trap">Buckets anchored at “now” split days at 14:32 — anchor at midnight.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Remember</span></h3>
<p><strong>Write status is visible, read status never is; statistics merge, samples don’t; the observer says
<em>that</em>, the anchor says <em>what</em>.</strong></p>
