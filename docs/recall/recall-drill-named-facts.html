<div class="content folio-page"><h1 class="title">Named facts — the numbers, names and lists of iOS development</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">recall · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> the exact values, case lists and call orders that UIKit, Foundation, SwiftUI and the
test frameworks fix by definition, and the names that patterns and principles were given by
their authors — each checked against Apple’s documentation, the Swift Book or the originator.
The why behind each lives in the linked folios.</p>
<p class="sheet-tools"><a class="sheet-download" href="recall-drill-named-facts.pdf" download>Download PDF</a> <a href="recall-drill-named-facts.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/recall/recall-drill-named-facts.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="recall-drill-named-facts-fig1.svg" width="631" height="151" class="wide" alt="Named facts — the numbers, names and lists of iOS development — figure 1" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">Auto Layout</span></h3>
<p><table class="sheet-table">
<thead>
<tr><th><strong>name</strong></th><th><strong>value / rule</strong></th></tr>
</thead>
<tbody>
<tr><td>installed priority</td><td>changing it to or from <code>.required</code> after the constraint is added throws</td></tr>
<tr><td>autoresizing mask</td><td><code>translatesAutoresizingMaskIntoConstraints</code>: <code>true</code> for a view made in code, <code>false</code> from Interface Builder; leave it alone on <code>arrangedSubviews</code>, cells, a VC’s <code>view</code></td></tr>
<tr><td>conflict</td><td>engine breaks constraints until the layout is valid, logs; breakpoint <code>UIViewAlertForUnsatisfiable</code><code>Constraints</code>; never required hugging / compression</td></tr>
<tr><td>self-sizing rows</td><td><code>rowHeight</code> <em>and</em> <code>estimatedRowHeight</code> default to <code>.automaticDimension</code>; an IB cell needs <code>rowHeight = .automaticDimension</code> in code; estimate <span class="math">≠</span> 0; <code>heightForRowAt</code> overrides and runs for every row (Apple: hurts at 1000+)</td></tr>
<tr><td>size class</td><td><code>UIUserInterfaceSizeClass</code>: <code>.compact</code> · <code>.regular</code> · <code>.unspecified</code>, per axis; set by device, window, multitasking</td></tr>
</tbody>
</table></p>
<p><table class="sheet-table">
<thead>
<tr><th><strong>UIStackView</strong></th><th><strong>default</strong></th><th><strong>cases</strong></th></tr>
</thead>
<tbody>
<tr><td><code>axis</code></td><td><code>.horizontal</code></td><td><code>.horizontal</code> · <code>.vertical</code></td></tr>
<tr><td><code>distribution</code> (along axis)</td><td><code>.fill</code></td><td><code>.fill</code> · <code>.fillEqually</code> · <code>.fillProportionally</code> · <code>.equalSpacing</code> · <code>.equalCentering</code></td></tr>
<tr><td><code>alignment</code> (across)</td><td><code>.fill</code></td><td><code>.fill</code> · <code>.leading</code> (= <code>.top</code>) · <code>.firstBaseline</code> · <code>.center</code> · <code>.trailing</code> (= <code>.bottom</code>) · <code>.lastBaseline</code></td></tr>
<tr><td><code>spacing</code></td><td><code>0</code></td><td>a minimum for the two <code>equal…</code> kinds; negative overlaps; <code>spacingUseSystem</code> (iOS 11)</td></tr>
</tbody>
</table></p>
<h3 class="sheet-hd"><span class="c-sheetblue">Networking &amp; Codable</span></h3>
<figure class="sheet-figure"><img src="recall-drill-named-facts-fig2.svg" width="302" height="35" alt="Named facts — the numbers, names and lists of iOS development — figure 2" loading="lazy"></figure>
<p>URLSession reports only client-side errors; a 404 arrives as a response
(<code>as? HTTPURLResponse</code>).</p>
<p><table class="sheet-table">
<thead>
<tr><th class="right"><strong><code>URLError.Code</code></strong> (<code>NSURLErrorDomain</code>)</th><th></th><th></th><th></th></tr>
</thead>
<tbody>
<tr><td class="right"><code>-999</code></td><td><code>cancelled</code></td><td class="right"><code>-1009</code></td><td><code>notConnectedToInternet</code></td></tr>
<tr><td class="right"><code>-1000</code></td><td><code>badURL</code></td><td class="right"><code>-1011</code></td><td><code>badServerResponse</code></td></tr>
<tr><td class="right"><code>-1001</code></td><td><code>timedOut</code></td><td class="right"><code>-1020</code></td><td><code>dataNotAllowed</code> (cellular refused)</td></tr>
<tr><td class="right"><code>-1003</code></td><td><code>cannotFindHost</code></td><td class="right"><code>-1022</code></td><td><code>appTransportSecurityRequires</code><code>SecureConnection</code></td></tr>
<tr><td class="right"><code>-1004</code></td><td><code>cannotConnectToHost</code></td><td class="right"><code>-1200</code></td><td><code>secureConnectionFailed</code></td></tr>
<tr><td class="right"><code>-1005</code></td><td><code>networkConnectionLost</code></td><td class="right"><code>-1202</code></td><td><code>serverCertificateUntrusted</code></td></tr>
</tbody>
</table></p>
<p><strong><code>DecodingError</code></strong>: <code>.typeMismatch(type, ctx)</code> · <code>.valueNotFound(type, ctx)</code> (null for
a non-optional) · <code>.keyNotFound(key, ctx)</code> · <code>.dataCorrupted(ctx)</code>; <code>Context</code> =
<code>codingPath</code>, <code>debugDescription</code>, <code>underlyingError</code>. <code>EncodingError</code>: only
<code>.invalidValue</code>.
<strong>Keys</strong>: <code>CodingKeys</code> enum (per key) or <code>keyDecodingStrategy</code>: <code>.useDefaultKeys</code>
(default) · <code>.convertFromSnakeCase</code> — capitalise after each <code>_</code>, drop inner <code>_</code>, keep
leading / trailing ones: <code>base_uri</code> → <code>baseUri</code>, never <code>baseURI</code> · <code>.custom</code>.
<strong>Dates</strong>: default <code>.deferredToDate</code> = <code>Date</code>’s own Codable: a <code>Double</code>, seconds since
<strong>1 Jan 2001</strong> (978 307 200 s after 1970) — Unix time needs <code>.secondsSince1970</code>;
also <code>.millisecondsSince1970</code> · <code>.iso8601</code> · <code>.formatted</code> · <code>.custom</code>.</p>
<p><table class="sheet-table">
<thead>
<tr><th><strong>URLSession</strong></th><th></th></tr>
</thead>
<tbody>
<tr><td>start</td><td>every task is created suspended → <code>resume()</code></td></tr>
<tr><td>callback queue</td><td>delegate calls + completion handlers on <code>delegateQueue</code>; <code>nil</code> → a serial queue the session creates, not main</td></tr>
<tr><td>async</td><td><code>data(from:)</code> (iOS 15) → <code>(Data, URLResponse)</code></td></tr>
<tr><td>configs</td><td><code>.default</code> (disk cache, keychain) · <code>.ephemeral</code> (RAM only) · <code>.background(withIdentifier:)</code> (system process; force-quit cancels)</td></tr>
<tr><td>numbers</td><td>request timeout <strong>60 s</strong>, reset by each arriving byte · resource <strong>7 days</strong> · <strong>6</strong> connections per host, HTTP/1.1 only</td></tr>
<tr><td>ownership</td><td>delegate held <strong>strongly</strong> until <code>invalidate…</code> — else a leak; <code>.shared</code>: no delegate, no custom config, no background</td></tr>
<tr><td>challenge</td><td><code>urlSession(_:didReceive:</code><code>completionHandler:)</code> → <code>.useCredential</code> · <code>.performDefaultHandling</code> · <code>.cancelAuthentication</code><code>Challenge</code> · <code>.rejectProtectionSpace</code></td></tr>
</tbody>
</table></p>
<h3 class="sheet-hd"><span class="c-sheetblue">Lifecycle enums &amp; kill codes</span></h3>
<p><code>UIApplication.State</code> and SwiftUI <code>ScenePhase</code>: <code>.active</code> · <code>.inactive</code> ·
<code>.background</code>. Scenes opt in via <code>UIApplicationSceneManifest</code> (iOS 13); UIKit logs a message
without it from iOS 18.4. TN3187: <code>applicationDidBecomeActive</code> → <code>sceneDidBecomeActive</code>, likewise
<code>WillResignActive</code>, <code>DidEnterBackground</code>, <code>WillEnterForeground</code>. <strong>Hang</strong>: most Apple
tools report a main run loop busy <span class="math">&gt;</span> <strong>250 ms</strong>; <span class="math">&lt;</span> 100 ms is rarely noticed. <code>0x8badf00d</code> watchdog
· <code>0xdead10cc</code> file / SQLite lock held while suspending · <code>0xc00010ff</code> thermal ·
<code>0xbaadca11</code> VoIP push without a CallKit report.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">SOLID — R. C. Martin’s own one-liners</span></h3>
<p><strong>S</strong> A class should have one, and only one, reason to change. · <strong>O</strong> You should be able
to extend a classes behavior, without modifying it. · <strong>L</strong> Derived classes must be
substitutable for their base classes. · <strong>I</strong> Make fine grained interfaces that are client
specific. · <strong>D</strong> Depend on abstractions, not on concretions.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Touches: down to find, up to handle</span></h3>
<figure class="sheet-figure"><img src="recall-drill-named-facts-fig3.svg" width="301" height="39" alt="Named facts — the numbers, names and lists of iOS development — figure 3" loading="lazy"></figure>
<p>A presented VC’s next responder is the presenting VC; the app delegate joins only if it
is a <code>UIResponder</code>. <code>hitTest(_:with:)</code> skips <code>isHidden</code>, <code>isUserInteractionEnabled = false</code>,
<code>alpha &lt; 0.01</code>; a point outside a view’s bounds never hits its subviews, even with
<code>clipsToBounds = false</code>; transparent pixels still hit. Gesture recognizers get touches before the
view; a <code>nil</code>-target action searches the chain.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Memory &amp; value semantics</span></h3>
<p><table class="sheet-table">
<thead>
<tr><th></th><th><code>weak</code></th><th><code>unowned</code></th></tr>
</thead>
<tbody>
<tr><td>form</td><td>always <code>var</code>, Optional</td><td>non-optional or Optional</td></tr>
<tr><td>target dies</td><td>ARC sets <code>nil</code> (no observers fire)</td><td>access = runtime error; <code>unowned(unsafe)</code> is unchecked</td></tr>
<tr><td>use when</td><td>the other lives <strong>shorter</strong></td><td>the other lives as long or <strong>longer</strong></td></tr>
</tbody>
</table>
 
<code>var a = 0, b = 0; let c = { [a] in print(a, b) }; a = 10; b = 10; c()</code> prints <strong>0 10</strong>: list
entries are copied when the closure is <em>created</em>; a class reference copies the reference.
<code>weak var delegate: P?</code> needs <code>protocol P: AnyObject</code>.
<strong>Copy-on-write</strong>: arrays, dictionaries, strings share storage until a copy is modified; own
structs only by hand — <code>isKnownUniquelyReferenced(_:)</code> counts strong refs only, needs
synchronisation. <code>static let</code>: lazy, initialised once even across threads; <code>lazy var</code>: no
such guarantee. No <code>mutating</code> call on a <code>let</code> struct. <code>deinit</code>: classes, actors and
<code>~Copyable</code> structs / enums (SE-0390, Swift 5.9). Apple: structs by default;
classes for Objective-C interop or controlled identity.
<strong>Tools</strong>: Debug Memory Graph (+ scheme Malloc Stack for backtraces) · Allocations, Mark
Generation around one feature · <code>leaks</code>: unreferenced malloc buffers + root cycles · the simulator
never warns or kills for memory.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">SwiftUI state</span></h3>
<p><table class="sheet-table">
<thead>
<tr><th><strong>wrapper</strong></th><th><strong>iOS</strong></th><th><strong>rule</strong></th></tr>
</thead>
<tbody>
<tr><td><code>@State</code></td><td>13</td><td>owned; also holds an <code>@Observable</code> model</td></tr>
<tr><td><code>@Binding</code></td><td>13</td><td>read / write a source of truth elsewhere (<code>$x</code>)</td></tr>
<tr><td><code>@StateObject</code></td><td>14</td><td>created <strong>once</strong> per container lifetime</td></tr>
<tr><td><code>@ObservedObject</code></td><td>13</td><td>an input — never a default value; not for <code>@Observable</code></td></tr>
<tr><td><code>@Observable</code></td><td>17</td><td>macro; a view updates only for properties <code>body</code> reads</td></tr>
<tr><td><code>@Bindable</code></td><td>17</td><td>bindings into an <code>@Observable</code></td></tr>
</tbody>
</table>
 Migration: <code>StateObject</code> → <code>State</code> · <code>EnvironmentObject</code> → <code>Environment</code> +
<code>.environment(_:)</code> · <code>ObservedObject</code> → plain property · <code>@Published</code> → nothing
(<code>@ObservationIgnored</code> opts out). <code>some View</code>: opaque result type, SE-0244, Swift 5.1.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Testing</span></h3>
<p><strong>Pyramid</strong> (Cohn, <em>Succeeding with Agile</em>, 2009): Unit · Service · UI; inverted =
ice-cream cone. <strong>70/20/10</strong> is Google Testing Blog 2015, “as a good first guess” — not Cohn. <strong>Test doubles</strong> (Meszaros, <em>xUnit Test Patterns</em>, 2007): <strong>Dummy</strong> passed
around, never used — fills parameter lists · <strong>Fake</strong> working shortcut implementation (an
in-memory database) · <strong>Stub</strong> canned answers to calls made during the test · <strong>Spy</strong> a stub
that also records how it was called · <strong>Mock</strong> pre-programmed expectations = the specification of
the calls. <strong>XCTest</strong>: class <code>setUp()</code> → per test: <code>setUp() async throws</code> → <code>setUpWithError()</code>
→ <code>setUp()</code> → test → teardown blocks (LIFO) → <code>tearDown()</code> → <code>tearDownWithError()</code> →
<code>tearDown() async throws</code> → class <code>tearDown()</code>; a crash skips teardown. <strong>Swift Testing</strong>
(Swift 6, Xcode 16): <code>#expect</code> records and continues; <code>#require</code> throws
<code>ExpectationFailedError</code>, <code>try #require(opt)</code> unwraps; parallel by default (XCTest: one by
one); traits <code>.disabled</code> <code>.enabled(if:)</code> <code>.bug</code> <code>.tags</code> <code>.timeLimit</code> <code>.serialized</code>;
exit tests Swift 6.2, not on iOS.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Patterns &amp; principles — the authors’ words</span></h3>
<p><strong>GoF</strong> (Gamma, Helm, Johnson, Vlissides, 1994) — 23: <strong>5 creational</strong> Abstract
Factory, Builder, Factory Method, Prototype, Singleton · <strong>7 structural</strong> Adapter, Bridge,
Composite, Decorator, Facade, Flyweight, Proxy · <strong>11 behavioural</strong> Chain of Responsibility,
Command, Interpreter, Iterator, Mediator, Memento, Observer, State, Strategy, Template Method,
Visitor. 
<table class="sheet-table">
<tbody>
<tr><td>Adapter</td><td><em>converts</em> an interface into the one clients expect</td></tr>
<tr><td>Decorator</td><td>same interface, <em>adds</em> responsibilities at run time — vs “an explosion of subclasses to support every combination”</td></tr>
<tr><td>Facade</td><td><em>one higher-level</em> interface over a subsystem</td></tr>
<tr><td>Proxy</td><td>surrogate that <em>controls access</em>: remote · virtual (create on demand) · protection · smart reference</td></tr>
<tr><td>Strategy</td><td>interchangeable algorithms; the <strong>client</strong> picks, so it must know them</td></tr>
<tr><td>State</td><td>object “will appear to change its class”; transitions in the Context or (more flexible) in the states</td></tr>
<tr><td>Factory M.</td><td>subclasses decide which class to instantiate — one product</td></tr>
<tr><td>Abstract F.</td><td>families of related objects, no concrete classes named (“Kit”)</td></tr>
</tbody>
</table>
 Template Method = “Hollywood principle: Don’t call us, we’ll call you” · Mediator:
many-to-many → one-to-many · Command → queue, log, <strong>undo</strong> (<code>UndoManager.registerUndo</code>) ·
Observer: <code>NotificationCenter</code> selector observers need no removal since iOS 9, block observers do;
<code>AnyCancellable</code> cancels on deinit · Builder’s <strong>Director</strong> · Iterator =
<code>IteratorProtocol.next()</code> (<code>nil</code> = end) + <code>Sequence.makeIterator()</code> · Coordinator
(Khanlou, 2015) · “Dependency Injection”: name settled in Fowler’s Jan 2004 article (constructor /
setter / interface injection) — a technique; DIP is a principle.</p>
