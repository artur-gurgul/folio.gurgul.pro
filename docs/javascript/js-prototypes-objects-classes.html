cript id="page"><div class="content folio-page"><h1 class="title">Prototypes, objects and classes</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">javascript · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> Every object has a hidden <code>[[Prototype]]</code> link; a read that misses its <em>own</em>
properties walks the chain to <code>null</code> — objects <strong>delegate</strong> at run time, nothing is
copied. A write lands on the object itself unless a setter or a read-only property up the chain
says no. <code>class</code> wires the same chain and adds real semantics: <code>new</code>-only, fields,
<code>#private</code>, <code>super</code>.</p>
<p class="sheet-tools"><a class="sheet-download" href="js-prototypes-objects-classes.pdf" download>Download PDF</a> <a href="js-prototypes-objects-classes.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/javascript/js-prototypes-objects-classes.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="js-prototypes-objects-classes-fig1.svg" width="626" height="144" class="wide" alt="Prototypes, objects and classes — figure 1" loading="lazy"></figure>
</section>
<section class="sheet-section">
<h2>Lookup and links</h2>
<ul>
<li><strong>Read</strong> <code>o.k</code>: own? else the <code>[[Prototype]]</code>’s, … <code>null</code> <span class="math">→</span>  <code>undefined</code>; a getter found anywhere runs with <code>this</code> = <code>o</code> (the  <em>receiver</em>).</li>
<li><strong>Write</strong>: drawing 3. Class fields, <code>defineProperty</code> and <code>{...o}</code>  <em>define</em>: no setter runs, an inherited read-only <code>k</code> is shadowed.</li>
<li><code>Object.create(p, descriptors)</code> links without a constructor. <code>Object.create(null)</code>  or <code>{__proto__: null}</code>: no inherited keys, no <code>toString</code> (<code>String(o)</code>  <span class="math">→</span> TypeError); <code>Object.groupBy</code> (ES2024) returns one.</li>
<li><code>Object.setPrototypeOf</code>: “very slow” in every engine (MDN); a cycle, a  non-extensible object or <code>Object.prototype</code> <span class="math">→</span> TypeError. <code>o.__proto__</code> is  a <em>Normative Optional, Legacy</em> accessor on <code>Object.prototype</code>.</li>
<li><code>new F()</code> links to <code>F.prototype</code>, or to <code>Object.prototype</code> if that is not an  object. Arrows, methods, <code>async</code> functions: no <code>.prototype</code>, no <code>new</code>;  generators have one, still no <code>new</code>; a bound function has none — <code>new</code> uses  its target’s.</li>
<li><code>o instanceof C</code>: <code>C[Symbol.hasInstance]</code> if defined, else “<code>C.prototype</code> is on  <code>o</code>’s chain” — fooled by <code>Object.create(C.prototype)</code> (a <code>#x in o</code> brand  check is not); false for an iframe’s (other realm’s) array — <code>Array.isArray</code>.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Which operation sees which keys</h2>
<p><table class="sheet-table">
<thead>
<tr><th></th><th class="center"><strong>inherited</strong></th><th class="center"><strong>non-enum.</strong></th><th class="center"><strong>symbol</strong></th><th></th></tr>
</thead>
<tbody>
<tr><td><code>k in o</code></td><td class="center">✓</td><td class="center">✓</td><td class="center">✓</td><td></td></tr>
<tr><td><code>for (k in o)</code></td><td class="center">✓</td><td class="center">—</td><td class="center">—</td><td></td></tr>
<tr><td><code>Object.hasOwn(o, k)</code></td><td class="center">—</td><td class="center">✓</td><td class="center">✓</td><td>ES2022</td></tr>
<tr><td><code>Object.keys/values/entries</code></td><td class="center">—</td><td class="center">—</td><td class="center">—</td><td>as <code>JSON.stringify</code></td></tr>
<tr><td><code>{...o}</code> · <code>Object.assign</code></td><td class="center">—</td><td class="center">—</td><td class="center">✓</td><td>getters run</td></tr>
<tr><td><code>structuredClone(o)</code></td><td class="center">—</td><td class="center">—</td><td class="center">—</td><td>deep, plain</td></tr>
<tr><td><code>getOwnPropertyNames</code></td><td class="center">—</td><td class="center">✓</td><td class="center">—</td><td></td></tr>
<tr><td><code>Reflect.ownKeys</code></td><td class="center">—</td><td class="center">✓</td><td class="center">✓</td><td></td></tr>
</tbody>
</table>
 Own key order: array indices ascending, then strings, then symbols, by creation — <code>Object.keys({b:1, 2:1, a:1, 1:1})</code> is <code>[&quot;1&quot;,&quot;2&quot;,&quot;b&quot;,&quot;a&quot;]</code>.</p>
</section>
<section class="sheet-section">
<h2>Descriptors and integrity</h2>
<p>Data <code>{value, writable, enumerable, configurable}</code> · accessor <code>{get, set, enumerable,
configurable}</code>. Literal, assignment, class field: all <code>true</code>; a <em>new</em> key via <code>defineProperty</code>: omitted <span class="math">→</span> <code>false</code> / <code>undefined</code>; class methods: non-enumerable; a class’s <code>C.prototype</code> is read-only. <code>configurable:false</code>: no delete, no data<span class="math">↔</span>accessor switch; only <code>writable</code> true<span class="math">→</span>false and (while writable) <code>value</code> may change.<br> 
<table class="sheet-table">
<thead>
<tr><th></th><th class="center"><strong>add</strong></th><th class="center"><strong>delete</strong></th><th class="center"><strong>write</strong></th><th><strong>sets on every own property</strong></th></tr>
</thead>
<tbody>
<tr><td><code>preventExtensions</code></td><td class="center">—</td><td class="center">✓</td><td class="center">✓</td><td>—</td></tr>
<tr><td><code>seal</code></td><td class="center">—</td><td class="center">—</td><td class="center">✓</td><td><code>configurable:false</code></td></tr>
<tr><td><code>freeze</code></td><td class="center">—</td><td class="center">—</td><td class="center">—</td><td>+ <code>writable:false</code> (data)</td></tr>
</tbody>
</table>
 All <strong>shallow</strong>; setters still run; <code>#private</code> untouched. A failed assignment is silent in sloppy code, TypeError in strict; array methods throw in both: <code>Object.freeze([]).push(1)</code> <span class="math">→</span> TypeError. Faithful shallow copy (prototype, accessors, attributes, symbols): <code>Object.create(Object.getPrototypeOf(o), Object.getOwnPropertyDescriptors(o))</code>.</p>
</section>
<section class="sheet-section">
<h2>Prototype pollution</h2>
<p><code>JSON.parse(&#39;{&quot;__proto__&quot;:{&quot;admin&quot;:1}}&#39;)</code> only makes an own key. A recursive merge <code>t[k] ??= {}; merge(t[k], s[k])</code> with that key writes into <code>t.__proto__</code> = <code>Object.prototype</code>: every object now has <code>admin</code>. <code>Object.assign(t, s)</code> <em>sets</em>, so the key replaces <code>t</code>’s prototype; <code>{...s}</code> defines a plain key. Defend: null-prototype objects or <code>Map</code>, <code>Object.hasOwn</code>, reject <code>__proto__</code>, <code>constructor</code>, <code>prototype</code> keys, Node <code>--disable-proto=throw</code>.</p>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap"><code>F.prototype.tags = []</code>: one array shared by every instance — use a field.</li>
</ul>
<figure class="sheet-figure"><img src="js-prototypes-objects-classes-fig2.svg" width="303" height="55" alt="Prototypes, objects and classes — figure 2" loading="lazy"></figure>
</section>
<section class="sheet-section">
<h2>Classes — what is not sugar</h2>
<pre class="sheet-code"><code class="hljs language-plaintext">class Counter extends Base {
  static #made = 0;         // ES2022: fields, #private, static
  static { /* runs once, in order; may use #private */ }
  #n = 0;                   // per instance; NOT a property
  step = 1;                 // own data property, defined
  inc = () =&gt; this.#n += this.step;  // one closure per instance
  get value() { return this.#n; }    // on Counter.prototype
  static is(o) { return #n in o; }   // brand check
}</code></pre>
<ul>
<li><strong>Not sugar</strong>: <code>new</code>-only (else TypeError); strict body; TDZ like <code>let</code>;  methods non-enumerable, not constructible; <code>extends Array</code>/<code>Error</code>/<code>Map</code>  makes real built-in instances — magic <code>length</code>, <code>[[MapData]]</code> (ES5’s  <code>Array.call(this)</code> could not); <code>map</code> on an <code>Array</code> subclass returns the  subclass (<code>Symbol.species</code>).</li>
<li><strong>Fields</strong>: base before its body, derived right after <code>super()</code> (drawing 2).  They <em>define</em>: a base setter of the same name is not called (<code>this.x = 1</code> in a  constructor would call it).</li>
<li><strong><code>#private</code></strong>: a lexical name, not a key — invisible to <code>Reflect.ownKeys</code>,  <code>JSON</code>, proxies, <code>structuredClone</code>; <code>o.#n</code> on an object without it <span class="math">→</span>  TypeError; <code>#n in o</code> cannot be faked, <code>instanceof</code> can; <code>delete this.#n</code>  is a SyntaxError. A base constructor that returns <code>obj</code> lets a subclass stamp  <code>#fields</code> on it, even non-extensible (Stage 3 “Non-extensible Applies to  Private” makes that a TypeError). <code>static #x</code> read via <code>this</code> in a subclass  <span class="math">→</span> TypeError.</li>
<li><strong><code>super</code></strong> comes from the method’s <code>[[HomeObject]]</code>, fixed where it is  written: <code>super.m()</code> calls <code>getPrototypeOf(Home).m</code> on the current <code>this</code>; a  copied method keeps it; <code>super.x = v</code> sets on <code>this</code>. <strong>Mixin</strong>:  <code>B =&gt; class extends B {…}</code>, then <code>extends Ser(Stamped(Model))</code>.</li>
<li><strong>Decorators</strong> (<code>@dec</code>; <code>accessor x = 1</code> = get/set over a private slot):  Stage 3 in Mar 2022, <strong>back to Stage 2.7</strong> on 19 May 2026 with Decorator Metadata  — in no ES edition. TypeScript <span class="math">≥</span> 5.0 compiles them (no parameter decorators;  <code>experimentalDecorators</code> is an older, different dialect).</li>
</ul>
</section>
<section class="sheet-section">
<h2>Proxy + Reflect</h2>
<pre class="sheet-code"><code class="hljs language-plaintext">const logged = t =&gt; new Proxy(t, {
  get(t, k, r) { log(&#x27;get&#x27;, k); return Reflect.get(t, k, r); },
  set(t, k, v, r) { return Reflect.set(t, k, v, r); } });</code></pre>
<p><table class="sheet-table">
<thead>
<tr><th><code><strong>internal method</strong></code></th><th><code><strong>trap = Reflect.…</strong></code></th><th><code><strong>internal</strong></code></th><th><code><strong>trap</strong></code></th></tr>
</thead>
<tbody>
<tr><td><code>GetPrototypeOf</code></td><td><code>getPrototypeOf</code></td><td><code>Get</code></td><td><code>get</code></td></tr>
<tr><td><code>SetPrototypeOf</code></td><td><code>setPrototypeOf</code></td><td><code>Set</code></td><td><code>set</code></td></tr>
<tr><td><code>IsExtensible</code></td><td><code>isExtensible</code></td><td><code>HasProperty</code></td><td><code>has</code></td></tr>
<tr><td><code>PreventExtensions</code></td><td><code>preventExtensions</code></td><td><code>Delete</code></td><td><code>deleteProperty</code></td></tr>
<tr><td><code>GetOwnProperty</code></td><td><code>getOwnPropertyDescriptor</code></td><td><code>Call<sup>*</sup></code></td><td><code>apply</code></td></tr>
<tr><td><code>DefineOwnProperty</code></td><td><code>defineProperty</code></td><td><code>Construct<sup>*</sup></code></td><td><code>construct</code></td></tr>
<tr><td><code>OwnPropertyKeys</code></td><td><code>ownKeys</code></td><td colspan="2"><code><sup>*</sup>functions only</code></td></tr>
</tbody>
</table>
 <code>Reflect.x</code> = trap <code>x</code>’s default; <code>false</code> where <code>Object.x</code> throws. <code>r</code> = receiver: inherited getters see the proxy as <code>this</code>; a <code>set</code> trap’s <code>false</code> throws in strict code. <strong>Invariants</strong>: no lying about a non-configurable property or a non-extensible target (<span class="math">→</span> TypeError). <strong>Not forwarded</strong>: <code>#private</code>, internal slots (<code>new Proxy(new Map, {}).size</code> <span class="math">→</span> TypeError); <code>proxy !== target</code>. Vue 3 <code>reactive()</code>: <code>get</code> tracks, <code>set</code> triggers (Vue 2’s getters missed added keys).</p>
</section>
<section class="sheet-section">
<h2>Symbols, iterators, generators</h2>
<p><code>Symbol(&#39;d&#39;)</code>: a unique key; <code>Symbol.for(&#39;k&#39;)</code>: one registry for all realms. The 13 well-known symbols are protocol hooks — <code>iterator</code>, <code>asyncIterator</code>, <code>hasInstance</code>, <code>toPrimitive</code>, <code>toStringTag</code>, <code>species</code>, …; Stage 4 for ES2027: <code>dispose</code> (<code>using</code>). <strong>Iterator</strong>: <code>[Symbol.iterator]()</code> <span class="math">→</span> <code>next()</code> <span class="math">→</span> <code>{value, done}</code>; <code>for…of</code> calls <code>return()</code> on <code>break</code>. A generator is a two-way iterator:</p>
<pre class="sheet-code"><code class="hljs language-plaintext">function* g() { const a = yield 1; const b = yield a + 1; return a + b; }
const it = g();  // runs nothing yet
it.next(&#x27;x&#x27;);  // {value: 1, done: false}   first argument ignored
it.next(10);   // a = 10 -&gt; {value: 11, done: false}
it.next(5);    // b = 5  -&gt; {value: 15, done: true}</code></pre>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<p><strong>Own first, then the chain · writes shadow unless a setter or read-only says no · fields
define, assignments set · freeze is shallow · <code>Reflect.x</code> is trap <code>x</code>’s default.</strong></p>
</section>
