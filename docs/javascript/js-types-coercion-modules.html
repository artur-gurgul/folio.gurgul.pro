<p class="sheet-oneliner"><strong>In one line:</strong> Seven primitive types (immutable, by value) + <strong>Object</strong> (by identity). Implicit
conversions are built from <strong>ToPrimitive</strong>, <strong>ToNumber</strong>, <strong>ToString</strong>,
<strong>ToBoolean</strong>, so every “WAT” traces. ES modules <strong>link</strong> the whole graph before
any code runs and imports are <strong>live bindings</strong>; <code>require</code> runs a file and returns an object.</p>

<section class="sheet-section">
<h2>Types and the four conversions</h2>
<ul>
<li>Primitives: <code>undefined null boolean number string</code>, <code>symbol</code> (ES2015),  <code>bigint</code> (ES2020). All else is an <strong>object</strong>: arrays, functions, wrappers  (<code>new Boolean(false)</code> is truthy). <code>&quot;a&quot;.length</code> goes through a temporary wrapper.  Assignment and arguments copy the value; for an object that value is a reference —  mutating a parameter shows in the caller, reassigning it does not.</li>
<li><code>typeof</code> on an undeclared name <span class="math">→</span> <code>&quot;undefined&quot;</code>; on a <code>let</code>/<code>const</code> in  its TDZ <span class="math">→</span> ReferenceError. Browsers’ <code>document.all</code> (Annex B) is the one object  with <code>typeof</code> <code>&quot;undefined&quot;</code>, falsy and <code>== null</code>. Better tests:  <code>x == null</code> · <code>Array.isArray</code> (cross-realm, unlike <code>instanceof</code>) ·  <code>Object.prototype.toString.call(null)</code> <span class="math">→</span> <code>&quot;[object Null]&quot;</code> ·  <code>Number.isNaN</code> (<code>isNaN(&quot;abc&quot;)</code> is <code>true</code>).</li>
</ul>
<p><table class="sheet-table">
<thead>
<tr><th><code><strong>value</strong></code></th><th><code><strong>typeof</strong></code></th><th><code><strong>ToBoolean</strong></code></th><th><code><strong>ToNumber (+x)</strong></code></th><th><code><strong>ToString (<code>`${x}`</code>)</strong></code></th></tr>
</thead>
<tbody>
<tr><td><code>undefined</code></td><td><code>&quot;undefined&quot;</code></td><td><code>false</code></td><td><code>NaN</code></td><td><code>&quot;undefined&quot;</code></td></tr>
<tr><td><code>null</code></td><td><code>&quot;object&quot;</code></td><td><code>false</code></td><td><code>0</code></td><td><code>&quot;null&quot;</code></td></tr>
<tr><td><code>true</code></td><td><code>&quot;boolean&quot;</code></td><td><code>true</code></td><td><code>1</code></td><td><code>&quot;true&quot;</code></td></tr>
<tr><td><code>-0 · NaN</code></td><td><code>&quot;number&quot;</code></td><td><code>false</code></td><td><code>-0 · NaN</code></td><td><code>&quot;0&quot; · &quot;NaN&quot;</code></td></tr>
<tr><td><code>1e21</code></td><td><code>&quot;number&quot;</code></td><td><code>true</code></td><td><code>1e21</code></td><td><code>&quot;1e+21&quot;</code></td></tr>
<tr><td><code>0n</code></td><td><code>&quot;bigint&quot;</code></td><td><code>false</code></td><td><code>TypeError†</code></td><td><code>&quot;0&quot;</code></td></tr>
<tr><td><code>&quot;&quot; · &quot; 12\n&quot;</code></td><td><code>&quot;string&quot;</code></td><td><code>false · true</code></td><td><code>0 · 12</code></td><td><code><em>itself</em></code></td></tr>
<tr><td><code>&quot;0x1F&quot; · &quot;-0x1F&quot;</code></td><td><code>&quot;string&quot;</code></td><td><code>true</code></td><td><code>31 · NaN</code></td><td></td></tr>
<tr><td><code>&quot;1_000&quot; · &quot;1e3&quot;</code></td><td><code>&quot;string&quot;</code></td><td><code>true</code></td><td><code>NaN · 1000</code></td><td></td></tr>
<tr><td><code>&quot;Infinity&quot; · &quot;0b11&quot;</code></td><td><code>&quot;string&quot;</code></td><td><code>true</code></td><td><code>Infinity · 3</code></td><td></td></tr>
<tr><td><code>Symbol(&quot;s&quot;)</code></td><td><code>&quot;symbol&quot;</code></td><td><code>true</code></td><td><code>TypeError</code></td><td><code>TypeError†</code></td></tr>
<tr><td><code>[] · [7]</code></td><td><code>&quot;object&quot;</code></td><td><code>true</code></td><td><code>0 · 7</code></td><td><code>&quot;&quot; · &quot;7&quot;</code></td></tr>
<tr><td><code>[1,2] · [null]</code></td><td><code>&quot;object&quot;</code></td><td><code>true</code></td><td><code>NaN · 0</code></td><td><code>&quot;1,2&quot; · &quot;&quot;</code></td></tr>
<tr><td><code>{}</code></td><td><code>&quot;object&quot;</code></td><td><code>true</code></td><td><code>NaN</code></td><td><code>&quot;[object Object]&quot;</code></td></tr>
<tr><td><code>() =&gt; 1</code></td><td><code>&quot;function&quot;</code></td><td><code>true</code></td><td><code>NaN</code></td><td><code>its source text</code></td></tr>
<tr><td><code>new Date(0)</code></td><td><code>&quot;object&quot;</code></td><td><code>true</code></td><td><code>0</code></td><td><code>local date text</code></td></tr>
</tbody>
</table></p>
<p>Falsy: <code>false 0 -0 0n &quot;&quot; null undefined NaN</code>; <code>&quot;0&quot;</code>, <code>&quot; &quot;</code>, <code>[]</code>, <code>{}</code> are truthy. A string must parse whole after trimming white space; sign only on decimals, no <code>_</code>, no <code>n</code>. Arrays join with commas, <code>null</code>/<code>undefined</code> as <code>&quot;&quot;</code>. †<code>Number(10n)</code> <span class="math">→</span> <code>10</code> and <code>String(Symbol(&quot;s&quot;))</code> <span class="math">→</span> <code>&quot;Symbol(s)&quot;</code> work; <code>+10n</code>, <code>&quot;&quot; + sym</code>, <code>`${sym}`</code> throw.</p>
</section>
<section class="sheet-section">
<h2>Four equalities</h2>
<p><table class="sheet-table">
<thead>
<tr><th><code><strong>pair</strong></code></th><th class="center"><code>==</code></th><th class="center"><code>===</code></th><th class="center"><code>Object.is</code></th><th class="center"><strong>SameValueZero</strong></th></tr>
</thead>
<tbody>
<tr><td><code>NaN, NaN</code></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td><td class="center"><span class="c-sheetgreen">✓</span></td><td class="center"><span class="c-sheetgreen">✓</span></td></tr>
<tr><td><code>+0, -0</code></td><td class="center"><span class="c-sheetgreen">✓</span></td><td class="center"><span class="c-sheetgreen">✓</span></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td><td class="center"><span class="c-sheetgreen">✓</span></td></tr>
<tr><td><code>1, &quot;1&quot; · 1n, 1</code></td><td class="center"><span class="c-sheetgreen">✓</span></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td></tr>
<tr><td><code>null, undefined</code></td><td class="center"><span class="c-sheetgreen">✓</span></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td><td class="center"><span class="c-sheetred"><span class="math">×</span></span></td></tr>
<tr><td><code>used by</code></td><td class="center">—</td><td class="center"><code>switch</code>, <code>indexOf</code></td><td class="center"><code>Object.is</code></td><td class="center"><code>includes</code>, <code>Map</code>/<code>Set</code> keys</td></tr>
</tbody>
</table></p>
<p><strong><code>x == y</code></strong>, in order: same type <span class="math">→</span> <code>===</code> · <code>null</code>/<code>undefined</code> equal each other only · number vs string <span class="math">→</span> ToNumber(string) · bigint vs string <span class="math">→</span> StringToBigInt (fails <span class="math">→</span> false) · a boolean <span class="math">→</span> ToNumber <em>first</em> · object vs primitive <span class="math">→</span> ToPrimitive, no hint · bigint vs number <span class="math">→</span> same mathematical value · else false. Not transitive: <code>&quot;0&quot; == 0</code>, <code>0 == &quot;&quot;</code>, yet <code>&quot;0&quot; == &quot;&quot;</code> is false; <code>null == 0</code> is false. <strong><code>&lt; &gt; &lt;= &gt;=</code></strong>: both sides ToPrimitive(number); two strings compare by UTF-16 code unit (<code>&quot;10&quot; &lt; &quot;9&quot;</code>, <code>&quot;Z&quot; &lt; &quot;a&quot;</code>), else as numbers. <code>a &lt;= b</code> is “not <code>b &lt; a</code>”: <code>null &gt;= 0</code> is true, <code>null &gt; 0</code> false; NaN <span class="math">→</span> false in all four. <code>3 &gt; 2 &gt; 1</code> is <code>true &gt; 1</code>: false.</p>
</section>
<section class="sheet-section">
<h2>Operator puzzles, traced</h2>
<p><table class="sheet-table">
<thead>
<tr><th><code><strong>expression</strong></code></th><th><code><strong>result</strong></code></th><th><strong>why</strong></th></tr>
</thead>
<tbody>
<tr><td><code>[] + {}</code></td><td><code>&quot;[object Object]&quot;</code></td><td>a string operand: <code>+</code> concatenates</td></tr>
<tr><td><code>{} + []</code></td><td><code>0</code></td><td>as a statement: block, <code>+[]</code></td></tr>
<tr><td><code>[1,2] + [3] · &quot;5&quot; - 2</code></td><td><code>&quot;1,23&quot; · 3</code></td><td><code>-</code> is numeric only</td></tr>
<tr><td><code>[] + null + 1</code></td><td><code>&quot;null1&quot;</code></td><td><code>&quot;&quot; + null</code> is a string</td></tr>
<tr><td><code>[10, 1, 2].sort()</code></td><td><code>[1, 10, 2]</code></td><td>default sort compares strings</td></tr>
<tr><td><code>[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;].map(parseInt)</code></td><td><code>[1, NaN, NaN]</code></td><td>index is the radix</td></tr>
<tr><td><code>parseInt(0.0000005)</code></td><td><code>5</code></td><td><code>String</code> gives <code>&quot;5e-7&quot;</code></td></tr>
<tr><td><code>&quot;b&quot;+&quot;a&quot;+ +&quot;a&quot;+&quot;a&quot;</code></td><td><code>&quot;baNaNa&quot;</code></td><td><code>+&quot;a&quot;</code> is NaN</td></tr>
</tbody>
</table></p>
<p>Seeing the hint: with <code>o = {[Symbol.toPrimitive]: h =&gt; h == &quot;number&quot; ? 42 : h}</code>, <code>+o</code> <span class="math">→</span> <code>42</code>, <code>`${o}`</code> <span class="math">→</span> <code>&quot;string&quot;</code>, <code>o + &quot;&quot;</code> <span class="math">→</span> <code>&quot;default&quot;</code>, <code>o == &quot;default&quot;</code> <span class="math">→</span> <code>true</code>.</p>
</section>
<section class="sheet-section">
<h2>Numbers and BigInt</h2>
<ul>
<li><code>number</code> = IEEE-754 double: integers exact to <code>MAX_SAFE_INTEGER</code> <span class="math">= 2<sup>53</sup>-1</span>  <span class="math">= 9007199254740991</span>; <code>2**53 + 1 === 2**53</code>. <code>0.1 + 0.2</code> <span class="math">→</span>  <code>0.30000000000000004</code>. <code>Number.EPSILON</code> <span class="math">= 2<sup>-52</sup></span>, the gap after 1 — scale it.</li>
<li><code>-0 === 0</code>, but <code>1/-0</code> <span class="math">→</span> <code>-Infinity</code>, <code>Object.is(-0, 0)</code> false,  <code>String(-0)</code> <code>&quot;0&quot;</code>. <code>Math.round</code> ties go to <span class="math">+∞</span>: <code>2.5</code> <span class="math">→</span> 3,  <code>-2.5</code> <span class="math">→</span> <code>-2</code>. Bitwise ops use ToInt32 (<code>&gt;&gt;&gt;</code>: ToUint32): <code>2**31 | 0</code> <span class="math">→</span>  <code>-2147483648</code>; <code>-1 &gt;&gt;&gt; 0</code> <span class="math">→</span> <code>4294967295</code>.</li>
<li><code>BigInt</code> (<code>10n</code>, ES2020): <code>1n + 1</code>, <code>+1n</code>, <code>Math.max(1n)</code> throw  TypeError, but <code>1n &lt; 1.5</code> and <code>1n == 1</code> work. <code>/</code> truncates  (<code>-7n / 2n</code> <span class="math">→</span> <code>-3n</code>); <code>BigInt(1.5)</code> RangeError. <code>JSON.stringify(1n)</code>  throws; ES2026: <code>JSON.rawJSON(String(v))</code> writes it, reviver <code>{source}</code> reads it.</li>
</ul>
</section>
<section class="sheet-section">
<h2><code>??</code>, <code>||</code>, <code>?.</code> and defaults</h2>
<ul>
<li><code>a || d</code> takes <code>d</code> for <em>any</em> falsy <code>a</code> (<code>0</code>, <code>&quot;&quot;</code> lost);  <code>a ?? d</code> only for <code>null</code>/<code>undefined</code> (ES2020, like <code>?.</code>); <code>a ?? b || c</code>  without parentheses is a SyntaxError. Parameter and destructuring defaults fire only  for <code>undefined</code>: <code>f(null)</code> keeps <code>null</code>.</li>
<li>One <code>?.</code> short-circuits the <em>whole</em> chain: <code>a?.b.c.d</code>; <code>(a?.b).c</code>  throws. <code>a?.b = 1</code>, <code>new a?.()</code> are SyntaxErrors.  <code>x ||= d</code>, <code>&amp;&amp;=</code>, <code>??=</code> (ES2021) assign only when needed.</li>
</ul>
</section>

<section class="sheet-section">
<h2>ES modules — load, link, evaluate</h2>
<ul>
<li><strong>Load</strong> parses the whole graph; <strong>Link</strong> binds every import to an export —  a missing name is a SyntaxError before any module of the graph runs; functions are  ready, <code>let</code>/<code>const</code>/<code>class</code> not; <strong>Evaluate</strong> runs dependencies  first, each module once. Always strict; top-level <code>this</code> is <code>undefined</code>.</li>
<li><code>import * as ns</code>: null prototype, sorted keys, tag <code>&quot;Module&quot;</code>, assigning  throws. Cached per URL (Node: new <code>?query</code>, new instance); browser: deferred, CORS.</li>
<li><code>import(expr)</code> (ES2020) works in scripts and CommonJS too; a promise of the  namespace. <strong>ES2025</strong>: <code>import c from &quot;./c.json&quot; with { type: &quot;json&quot; }</code>  (default export only; <code>import(p, { with: {...} })</code>).</li>
<li><strong>Cycles</strong>: CJS hands the requirer the <em>unfinished</em> <code>exports</code> (missing  keys <code>undefined</code>); ESM links fine, but reading a <code>let</code>/<code>const</code>/<code>class</code>  export before its module ran throws ReferenceError; functions already work.</li>
</ul>

<section class="sheet-section">
<h2>Node.js: CommonJS <span class="math">↔</span> ESM (docs v26)</h2>
<ul>
<li><code>.mjs</code> ESM · <code>.cjs</code> CJS · <code>.js</code> <span class="math">→</span> nearest <code>package.json</code>  <code>&quot;type&quot;</code>, else syntax detection (default since 22.7; slower — set <code>&quot;type&quot;</code>).</li>
<li><strong>import CJS</strong>: default is <em>always</em> <code>module.exports</code>; named imports only  where static analysis finds them. Compiled <code>__esModule</code> code: the real default  sits at <code>x.default</code>.</li>
<li><strong><code>require(esm)</code></strong>: the namespace (<code>.default</code>; <code>__esModule: true</code> added  when a default exists); <code>export { v as &quot;module.exports&quot; }</code> returns <code>v</code>. Unflagged  22.12, stable 25.4; top-level await in its graph <span class="math">→</span> <code>ERR_REQUIRE_ASYNC_MODULE</code>.</li>
<li>ESM: no <code>require</code>/<code>__dirname</code> — <code>import.meta.dirname</code> (stable 24.0),  <code>createRequire(import.meta.url)</code>; extensions mandatory; <code>assert {}</code> gone (22.0).  Separate <code>import</code>/<code>require</code> entry files: <strong>dual package hazard</strong>.</li>
</ul>
</section>
