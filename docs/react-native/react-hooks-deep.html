icle class="sheet">
<p class="sheet-kicker">react-native · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> Hooks are <strong>slots on the fiber</strong>, matched by <strong>call order</strong>. Each render is
a <strong>snapshot</strong> its closures capture. Effects sync with the outside world <em>after</em>
commit; memo hooks keep <strong>identity</strong>. Most bugs: an old snapshot, or a dep with a new
identity every render.</p>
<p class="sheet-tools"><a class="sheet-download" href="react-hooks-deep.pdf" download>Download PDF</a> <a href="react-hooks-deep.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/react-native/react-hooks-deep.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="react-hooks-deep-fig1.svg" width="629" height="138" class="wide" alt="React hooks — the mechanisms — figure 1" loading="lazy"></figure>
</section>
<section class="sheet-section">
<h2>State</h2>
<ul>
<li><code>useState(init)</code>: <code>init</code> used on mount only — pass a function for  costly work. Setter is <strong>stable</strong>; <code>Object.is(new, old)</code> <span class="math">→</span> no render.  Updates queue: <code>set(c =&gt; c+1)</code> twice = +2, <code>set(c+1)</code> twice = +1.</li>
<li><code>useReducer</code>: next = pure <code>(state, action)</code>; stable <code>dispatch</code>  to pass down. Pick it when fields change together. Never mutate:  <code>arr.push(x); set(arr)</code> = same reference = no render.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Effects — timing, deps, cleanup</h2>
<ul>
<li><code>useEffect</code>: <strong>after commit, normally after paint</strong>. Deps by  <code>Object.is</code>; none = every render; <code>[]</code> = mount only.</li>
<li><strong>Cleanup</strong> runs before the next run (old closure) and on unmount. Child  effects run before the parent’s<span class="unverified">(unverified)</span>.</li>
<li><code>useLayoutEffect</code>: <strong>before paint</strong>, sync — measure and fix without  flicker (Fabric: layout readable). Blocks the frame.</li>
<li><strong>Races</strong>: fast id changes <span class="math">→</span> out-of-order responses. Cleanup cancels  (<code>AbortController</code>) or ignores (<code>let stale = true</code>).</li>
<li><strong>StrictMode</strong> (dev): mount <span class="math">→</span> cleanup <span class="math">→</span> mount; double subscriptions =  missing cleanup. Derived values belong in render, event work in handlers — not effects.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Refs</h2>
<p><code>useRef</code> = the same <code>{current}</code> box every render; writing it does <strong>not</strong> re-render (timers, latest value). On a host component: the native instance (<code>focus()</code>, <code>measure()</code>) — an <code>IBOutlet</code>. Not read during render.</p>
</section>
<section class="sheet-section">
<h2>Example — fetch without races</h2>
<pre class="sheet-code"><code class="hljs language-typescript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">useUser</span>(<span class="hljs-params"><span class="hljs-attr">id</span>: <span class="hljs-built_in">string</span></span>) {
  <span class="hljs-keyword">const</span> [user, setUser] = useState&lt;<span class="hljs-title class_">User</span> | <span class="hljs-literal">null</span>&gt;(<span class="hljs-literal">null</span>);
  <span class="hljs-title function_">useEffect</span>(<span class="hljs-function">() =&gt;</span> {
    <span class="hljs-keyword">const</span> ac = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();
    <span class="hljs-title function_">fetch</span>(<span class="hljs-string">`<span class="hljs-subst">${API}</span>/users/<span class="hljs-subst">${id}</span>`</span>, { <span class="hljs-attr">signal</span>: ac.<span class="hljs-property">signal</span> })
      .<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">r</span> =&gt;</span> r.<span class="hljs-title function_">json</span>()).<span class="hljs-title function_">then</span>(setUser)
      .<span class="hljs-title function_">catch</span>(<span class="hljs-function"><span class="hljs-params">e</span> =&gt;</span> { <span class="hljs-keyword">if</span> (e.<span class="hljs-property">name</span> !== <span class="hljs-string">&#x27;AbortError&#x27;</span>) <span class="hljs-title function_">setErr</span>(e); });
    <span class="hljs-keyword">return</span> <span class="hljs-function">() =&gt;</span> ac.<span class="hljs-title function_">abort</span>();  <span class="hljs-comment">// before next id + on unmount</span>
  }, [id]);                   <span class="hljs-comment">// omit id -&gt; wrong user forever</span>
  <span class="hljs-keyword">return</span> user;
}</code></pre>
</section>
<section class="sheet-section">
<h2>React 19 (RN 0.78+)</h2>
<p><code>use(promise | context)</code> — suspends on a promise; the one hook allowed in conditions. <code>useActionState</code>, <code>useOptimistic</code>: async <em>Actions</em> with pending/optimistic state. <code>ref</code> is a plain prop (no <code>forwardRef</code>).</p>
</section>
<section class="sheet-section">
<h2>Memoisation — identity, not speed</h2>
<ul>
<li><code>useMemo(fn, deps)</code> caches a value; <code>useCallback(fn, deps)</code> =  <code>useMemo(() =&gt; fn, deps)</code>; <code>React.memo(C)</code> skips a render on  shallow-equal props.</li>
<li><strong>Helps</strong> only when identity is <em>consumed</em>: prop of a <code>memo</code>’d child  (heavy <code>FlatList</code> row), dep of another hook, context <code>value</code> — or a  truly expensive computation. Otherwise <strong>waste</strong>; one inline  object/arrow/<code>children</code> defeats <code>memo</code>.</li>
<li><strong>React Compiler</strong> memoises at build time; manual memo gets rare.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Context &amp; external stores</h2>
<ul>
<li><code>useContext</code>: <strong>every consumer re-renders</strong> when <code>value</code> changes  (<code>Object.is</code>); <code>memo</code> cannot block it. Memoise <code>value</code>, split  contexts (state / dispatch), or use a store with selectors.</li>
<li><code>useSyncExternalStore(subscribe, getSnapshot)</code>: tear-free reads of a  non-React store (Zustand, Redux). <code>getSnapshot</code> must return a cached value  — a new object per call loops forever.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Rules of Hooks — why</h2>
<figure class="sheet-figure"><img src="react-hooks-deep-fig2.svg" width="285" height="44" alt="React hooks — the mechanisms — figure 2" loading="lazy"></figure>
<ul>
<li>Top level only — no conditions, loops, or hooks after an early <code>return</code>.  No names or keys: <em>order</em> is identity.</li>
<li><strong>Custom hook</strong> (<code>useX</code>) shares <em>logic</em>, not state.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap"><code>useCallback</code> with no <code>memo</code>’d consumer only adds cost.</li>
<li class="trap">Object/array deps built in render <span class="math">→</span> effect every render (or a loop).</li>
<li class="trap"><code>useEffect(async () =&gt; …)</code> returns a promise, not a cleanup.</li>
<li class="trap">Silencing <code>exhaustive-deps</code> hides stale closures — restructure.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<h3 class="sheet-hd">Order = identity. Render = snapshot. Effects sync; refs remember.</h3>
</section>
