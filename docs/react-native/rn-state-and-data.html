<p class="sheet-kicker">react-native · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> “Which state library?” is the wrong question. Classify first — <strong>server</strong>,
<strong>navigation</strong>, <strong>local UI</strong>, <strong>shared client</strong>, <strong>form</strong>, <strong>persisted</strong>
(<em>secret</em>?) — each has a best-fit tool; most bugs are one kind kept in another’s tool.</p>

<section class="sheet-section">
<h2>Server state — TanStack Query (v5)</h2>
<ul>
<li>Cache keyed by <code>queryKey</code> (<code>[&#39;todo&#39;, id]</code>); dedupes requests;  <strong>stale-while-revalidate</strong>: show cached, refetch behind.</li>
<li><code>staleTime</code> (default <strong>0</strong>) — how long data is fresh (no refetch on  mount/focus). <code>gcTime</code> (default <strong>5 min</strong>; v4 <code>cacheTime</code>) —  how long an <em>unused</em> entry stays in memory.</li>
<li><code>invalidateQueries</code> after a mutation: mark stale, refetch active.  <code>retry</code>: 3, exponential backoff.</li>
<li>RN wiring: <code>focusManager</code> ← <code>AppState</code>, <code>onlineManager</code> ←  NetInfo. Offline, queries pause; persist the cache with  <code>PersistQueryClientProvider</code>.</li>
<li>RTK Query: the same inside Redux — <code>createApi</code>, <code>providesTags</code> /  <code>invalidatesTags</code>.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Example — optimistic update with rollback</h2>

<section class="sheet-section">
<h2>Context vs stores — re-render mechanics</h2>
<ul>
<li><strong>Context</strong> re-renders <em>every</em> consumer when the value identity  changes — no selectors. Low-frequency values only; split state from dispatch,  <code>useMemo</code> the value.</li>
<li><strong>Redux Toolkit</strong>: <code>createSlice</code> (reducers “mutate” a draft,  <strong>Immer</strong> makes the immutable copy), <code>configureStore</code>,  <code>createAsyncThunk</code>. <code>useSelector</code> re-renders when its result  changes by reference; derive with memoised <code>createSelector</code>.</li>
<li><strong>Zustand</strong>: <code>create(fn)</code>, no provider; <code>useStore(selector)</code>  subscribes to one slice; object selectors need <code>useShallow</code>;  <code>persist</code> middleware.</li>
<li><strong>Jotai</strong>: atoms, bottom-up; derived atoms re-run only for their readers.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Forms</h2>
<p><strong>react-hook-form</strong>: values live outside React state — a keystroke does not re-render the form; RN inputs go through <code>Controller</code>; validate with a zod resolver.</p>
</section>
<section class="sheet-section">
<h2>Persistence — beyond the picture</h2>
<ul>
<li>AsyncStorage on Android is SQLite with a default size cap<span class="unverified">(unverified)</span>; MMKV’s sync reads  let settings load at launch without a spinner — its encryption key belongs in  the Keychain. Secure stores hold <em>small</em> values (tokens), not data.</li>
<li>Persist client state selectively and <strong>version + migrate</strong> its shape.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Offline-first &amp; normalisation</h2>
<ul>
<li>Local DB is the source of truth; the UI reads it; sync is background.</li>
<li>Writes go to an <strong>outbox</strong>, replayed on reconnect with  <strong>idempotency keys</strong> (a retried POST must not double-charge).</li>
<li>Conflict rule per entity: last-write-wins, server-wins, or field merge.</li>
<li><strong>Normalise</strong> shared entities (<code>{ids, entities}</code>, RTK  <code>createEntityAdapter</code>): one update reaches every screen. Query caches  are per key, <em>not</em> normalised — <code>setQueryData</code> or invalidate.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap">Copying fetched data into Redux/<code>useState</code>: two sources of truth, stale  forever. Server state belongs in the query cache.</li>
<li class="trap">Tokens in AsyncStorage (plain file/SQLite) — use Keychain/Keystore.</li>
<li class="trap"><code>staleTime: 0</code> + many mounts = refetch storms; <code>gcTime</code> is  <em>not</em> freshness.</li>
<li class="trap"><code>useStore()</code> without a selector re-renders on every change.</li>
<li class="trap">Whole objects as route params — stale copies, broken deep links.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<p><strong>Server <span class="math">→</span> query cache · screen <span class="math">→</span> route · local <span class="math">→</span> useState · rare
global <span class="math">→</span> Context · hot shared <span class="math">→</span> store · secret <span class="math">→</span> Keychain.</strong></p>
</section>
