linejoin="round"></path></svg></summary></details></nav></div><div class="scroll"></div></div></template><noscript id="page"><div class="content folio-page"><h1 class="title">Linux security — credentials, permissions, capabilities, LSMs, sudo, SSH</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">linux · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> The kernel decides every access from the calling thread’s <strong>credentials</strong>:
<strong>seccomp</strong> filters the syscall at entry, <strong>DAC</strong> (mode bits + ACL, against the
<em>fsuid</em>) says yes or no, a <strong>capability</strong> may override a DAC “no”, and the
<strong>LSMs</strong> (SELinux, AppArmor, Landlock, Yama …) can, by design, mostly only add a “no”. Root
is uid 0 <em>plus</em> a full capability set — both can be taken away. sudo, run0, PAM and sshd are
the user-space doors that hand them out.</p>
<p class="sheet-tools"><a class="sheet-download" href="linux-security-permissions.pdf" download>Download PDF</a> <a href="linux-security-permissions.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/linux/linux-security-permissions.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="linux-security-permissions-fig1.svg" width="632" height="196" class="wide" alt="Linux security — credentials, permissions, capabilities, LSMs, sudo, SSH — figure 1" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">Credentials</span></h3>
<ul>
<li><strong>real</strong> uid = who owns the process · <strong>effective</strong> = privileges · <strong>saved</strong>  = euid copied at <code>execve</code> (drop, then regain) · <strong>fsuid</strong> (Linux-only) follows  euid, used for files. <code>/proc/&lt;pid&gt;/status</code> <code>Uid:</code> real, effective, saved, fs.</li>
<li><code>setuid(2)</code> with <code>CAP_SETUID</code> sets real + saved too — no way back (<code>seteuid</code>  drops for a while); without it euid may only become real or saved. Check its return value.</li>
<li>Groups are set at login and inherited: a new membership reaches new logins only.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Mode bits, umask, special bits</span></h3>
<ul>
<li><strong>One class decides</strong>: fsuid = owner <span class="math">→</span> owner bits only; else a group matches  <span class="math">→</span> group bits; else other. Mode <code>0077</code> locks the <em>owner</em> out.</li>
<li>Directory: <code>r</code> list · <code>w</code> create / delete / rename (with <code>x</code>) · <code>x</code> search.  <strong>Deleting needs <code>w</code>+<code>x</code> on the directory</strong>, nothing on the file.</li>
<li><strong>umask</strong> clears bits from the <code>open</code> / <code>mkdir</code> mode: 0666 &amp; ~022  = 0644, dirs 0755; 077 <span class="math">→</span> 600 / 700; ignored under a default ACL; <code>Umask:</code> in status.</li>
<li><strong>setuid</strong> 4000: exec runs with the file owner’s euid — <strong>ignored</strong> for scripts,  on <code>nosuid</code> mounts, under <code>no_new_privs</code>, when ptraced. <code>AT_SECURE</code> exec:  <code>LD_LIBRARY_PATH</code> stripped, <code>LD_PRELOAD</code> only setuid libs from standard dirs.</li>
<li><strong>setgid</strong> 2000: exec <span class="math">→</span> egid; on a dir, new files take its group, new subdirs  keep the bit. <strong>sticky</strong> 1000 on a dir: only the file’s owner, the dir’s owner or  a privileged process may rename / delete (<code>/tmp</code>).</li>
<li>An unprivileged <code>write</code> clears setuid / setgid; <code>chown</code> clears them, root too.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">POSIX ACLs</span></h3>
<p><code>user::</code> · <code>user:alice:</code> · <code>group::</code> · <code>group:dev:</code> · <code>mask::</code> · <code>other::</code>; checked owner <span class="math">→</span> named user <span class="math">→</span> groups <span class="math">→</span> other, users + groups <strong>ANDed with the
mask</strong>. <code>ls -l</code>’s group bits <em>are</em> the mask (<code>chmod g=</code> edits it). A dir’s <strong>default</strong> ACL is copied to new entries.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Capabilities — root in 41 pieces (0–40)</span></h3>
<p>Per thread: <strong>P</strong>ermitted (ceiling) · <strong>E</strong>ffective (checked) · <strong>I</strong>nheritable · <strong>B</strong>ounding (drop-only limit) · <strong>A</strong>mbient (4.3: kept across exec of a plain program). Files: P, I + an effective bit in the <code>security.capability</code> xattr. At <code>execve</code>:</p>
<figure class="sheet-figure"><img src="linux-security-permissions-fig2.svg" width="231" height="72" alt="Linux security — credentials, permissions, capabilities, LSMs, sudo, SSH — figure 2" loading="lazy"></figure>
<p><strong>Root</strong>: the file’s I, P count as all ones, E set <span class="math">⇒</span> full set (<code>SECBIT_NOROOT</code> stops it). <code>NET_BIND_SERVICE</code>: ports below <code>ip_unprivileged_port_start</code> (per netns, 1024; 0 = none privileged) · <code>DAC_OVERRIDE</code>: skip rwx (exec still needs an <code>x</code> bit) · <code>DAC_READ_SEARCH</code>: read files, search dirs · <code>FOWNER</code>: act as owner, ignore sticky · <code>SYS_ADMIN</code>: “plausibly called <em>the new
root</em>”. <code>getcap</code>, <code>capsh --decode=</code>, <code>CapEff:</code> in status.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Self-sandboxing: no_new_privs (NNP), seccomp-bpf, Landlock</span></h3>
<ul>
<li><code>prctl(PR_SET_NO_NEW_PRIVS)</code>: <code>execve</code> can no longer <em>grant</em> — setuid,  setgid, file caps ignored; inherited, <strong>never unset</strong>. Needed for unprivileged  seccomp and Landlock.</li>
<li><strong>seccomp-bpf</strong>: classic BPF over <code>nr</code>, <code>arch</code>, ip, 6 raw args — no pointer  reads; “isn’t a sandbox”. Precedence: <code>KILL_PROCESS</code> <span class="math">&gt;</span> <code>KILL_THREAD</code> <span class="math">&gt;</span>  <code>TRAP</code> <span class="math">&gt;</span> <code>ERRNO</code> <span class="math">&gt;</span> <code>USER_NOTIF</code> <span class="math">&gt;</span> <code>TRACE</code> <span class="math">&gt;</span> <code>LOG</code> <span class="math">&gt;</span> <code>ALLOW</code>;  of several filters the highest wins. Inherited, kept across exec; filters only  accumulate. Check <code>arch</code> — and a deny-list must cover x32 numbers too.</li>
<li><strong>Landlock</strong>: unprivileged LSM — a ruleset (paths, ports, scopes) +  <code>landlock_restrict_self()</code> binds the process and its children; <span class="math">≤</span>16 layers.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">LSMs — who restricts whom</span></h3>
<p><table class="sheet-table">
<tbody>
<tr><td><strong>SELinux</strong></td><td><strong>labels</strong> <code>user:role:type:level</code> in an xattr, type enforcement by
 admin policy; enforcing · permissive (or per domain). RHEL, Fedora, Android (enforced since 5.0),
 openSUSE Tumbleweed (Feb 2025). Runtime disable gone (6.4): <code>selinux=0</code> at boot.
 <code>ls -Z</code> · <code>ausearch -m AVC</code> · <code>semanage fcontext</code> + <code>restorecon</code> · <code>setsebool -P</code></td></tr>
<tr><td><strong>AppArmor</strong></td><td>per-program <strong>profiles</strong> attached by <strong>path</strong>; enforce · complain ·
 kill · unconfined · prompt. Ubuntu, Debian (default since 10). Ubuntu 24.04: unprivileged user
 namespaces get no caps unless a profile allows <code>userns</code>. <code>aa-status</code> · <code>aa-logprof</code></td></tr>
<tr><td><strong>Yama</strong></td><td><code>ptrace_scope</code>: 0 same uid · 1 descendants · 2 <code>CAP_SYS_PTRACE</code> · 3 none,
 until reboot</td></tr>
<tr><td><strong>lockdown</strong></td><td>blocks <code>/dev/mem</code>, unsigned kexec + modules, kprobes, BPF kernel reads</td></tr>
</tbody>
</table></p>
<p><strong>capability</strong> first, then minor LSMs, at most one “major”: <code>/sys/kernel/security/lsm</code>, order via <code>lsm=</code>. Also Landlock, BPF (eBPF on hooks), Smack, TOMOYO.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">sudo, sudo-rs, run0</span></h3>
<ul>
<li><code>visudo</code> edits <code>/etc/sudoers</code> + <code>sudoers.d/</code>: <code>user host=(runas) cmds</code>;  <strong>the last matching entry wins</strong>, not the most specific. <code>env_reset</code> on,  <code>use_pty</code> on (1.9.14), <code>secure_path</code> off upstream. <code>sudo -l</code>: your rights.</li>
<li>NOPASSWD on an editor, pager, <code>find</code>, <code>tar</code>, an interpreter = a root shell  (GTFOBins). Wildcards match spaces; <code>ALL, !/bin/sh</code> “rarely works”.  <strong>sudoedit</strong>: edits a user-owned temp copy, copies it back.</li>
<li>CVE-2021-3156 “Baron Samedit”: heap overflow, any local user <span class="math">→</span> root, no sudoers  entry needed (to 1.9.5p1). CVE-2025-32463: <code>-R</code> chroot + a planted  <code>nsswitch.conf</code> <span class="math">→</span> root (1.9.14–1.9.17; chroot deprecated).</li>
<li><strong>sudo-rs</strong> (Rust) is <code>sudo</code> on Ubuntu 25.10 + 26.04 LTS; the original is  <code>sudo.ws</code>. <strong>run0</strong> (systemd 256, Jun 2024): no setuid — polkit authorises, the  service manager starts a transient unit with a fresh context and pty.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">PAM</span></h3>
<p><code>/etc/pam.d/&lt;service&gt;</code>: stacks <code>auth</code> · <code>account</code> · <code>password</code> · <code>session</code>. <code>required</code> = fail, but run the rest · <code>requisite</code> = fail now · <code>sufficient</code> = succeed now if no earlier <code>required</code> failed · <code>optional</code> = counts only if alone · <code>include</code>, <code>substack</code>; or <code>[success=ok default=bad]</code>. <code>pam_faillock</code>: 3 failures / 15 min <span class="math">→</span> 10 min lock, root only with <code>even_deny_root</code> (<code>pam_tally2</code> removed, Linux-PAM 1.5.0, 2020). Hashes in <code>/etc/shadow</code>: <code>$y$</code> yescrypt (Debian default since 11) · <code>$6$</code> acceptable · <code>$1$</code> not for new hashes.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">OpenSSH server</span></h3>
<p><strong>First obtained value wins</strong>: Debian/Ubuntu <code>Include sshd_config.d/*.conf</code> at the top, so a drop-in beats the main file. <code>sshd -t</code> checks; <code>sshd -T -C user=…</code> prints the effective config. Defaults: <code>PermitRootLogin prohibit-password</code>, <code>PasswordAuthentication yes</code>, <code>KbdInteractiveAuthentication yes</code>.</p>
<p><table class="sheet-table">
<tbody>
<tr><td>9.5 2023-10</td><td><code>ssh-keygen</code> makes Ed25519 keys by default</td></tr>
<tr><td>9.8 2024-07</td><td>fixes CVE-2024-6387 “regreSSHion” (8.5p1–9.7p1: signal race, root RCE, glibc
 Linux); <code>sshd-session</code> split; <code>PerSourcePenalties</code> on</td></tr>
<tr><td>10.0 2025-04</td><td>DSA removed; <strong><code>mlkem768x25519-sha256</code></strong> default key exchange;
 <code>sshd-auth</code> split; no finite-field DH in sshd</td></tr>
<tr><td>10.1 2025-10</td><td>client warns on non-post-quantum key exchange</td></tr>
<tr><td>10.6 2026-10</td><td>sshd logs it too (<code>WarnWeakCrypto</code>); <code>ssh-mldsa44-ed25519</code> signatures enabled</td></tr>
</tbody>
</table></p>
<h3 class="sheet-hd"><span class="c-sheetblue">Audit</span></h3>
<p><code>auditd</code> <span class="math">→</span> <code>/var/log/audit/audit.log</code>; <code>ausearch -k</code>, <code>aureport</code>. <code>-a always,exit -F arch=b64 -S execve -k exec</code>; watch files as <code>-F path=… -F perm=wa</code> (<code>-w</code> is deprecated: slow). <strong>auid</strong> = login uid from <code>pam_loginuid</code>, unchanged by sudo / su — who really did it. <code>-e 2</code> locks rules until reboot.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap"><code>mv</code> keeps the SELinux label (<code>user_home_t</code> in <code>/var/www</code> <span class="math">→</span> denied); <code>cp</code>  takes the target’s default. <code>restorecon</code>, never <code>setenforce 0</code>.</li>
</ul>
