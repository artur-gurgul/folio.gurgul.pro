s="content folio-page"><h1 class="title">Secure randomness — entropy, DRBGs, platform APIs, nonces, UUIDs, failures</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">crypto · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> A few hundred bits of real <strong>entropy</strong> seed a <strong>DRBG</strong> that expands them into an
unlimited, unpredictable stream. Take every key, nonce, IV and token from the <strong>OS generator</strong>
(<code>getrandom</code>, <code>SecRandomCopyBytes</code>, <code>SecureRandom</code>, <code>crypto.getRandomValues</code>); the
dangerous moment is <em>before</em> it is seeded, or after its state was copied.</p>
<p class="sheet-tools"><a class="sheet-download" href="secure-randomness.pdf" download>Download PDF</a> <a href="secure-randomness.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/crypto/secure-randomness.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="secure-randomness-fig1.svg" width="624" height="145" class="wide" alt="Secure randomness — entropy, DRBGs, platform APIs, nonces, UUIDs, failures — figure 1" loading="lazy"></figure>
</section>
<section class="sheet-section">
<h2>PRNG · CSPRNG · TRNG</h2>
<ul>
<li><strong>PRNG</strong>: a fast deterministic function of its state, built for statistics. Mersenne  Twister (Python <code>random</code>, <code>mt19937</code>): state = 624 words, output tempering is  invertible, so 624 outputs give every later one. V8’s <code>Math.random</code> (Chrome 49+) is xorshift128+ —  “still not cryptographically secure”; Go <code>math/rand/v2</code> “might be easily predictable”.</li>
<li><strong>CSPRNG / DRBG</strong>: next bit unguessable from all earlier output; <strong>backtracking
 resistance</strong> — a stolen state does not reveal past output; <strong>prediction resistance</strong>  — a stolen state stops predicting the future — only by reseeding with fresh entropy.</li>
<li><strong>TRNG / entropy source</strong>: physical noise; slow, biased, may fail silently — tested,  conditioned, used only to <em>seed</em>.</li>
<li>Once seeded with 256 bits a generator does not “run out”. Linux 5.6 removed the blocking  pool: the CRNG output is “good enough to use even for key generation”.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Linux — what blocks, today</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>call</strong></th><th><strong>before CRNG ready</strong></th><th><strong>after</strong></th></tr>
</thead>
<tbody>
<tr><td><code>getrandom(b,n,0)</code></td><td>blocks</td><td>CSPRNG bytes</td></tr>
<tr><td>+ <code>GRND_NONBLOCK</code></td><td><span class="math">-1</span>, <code>EAGAIN</code></td><td>same</td></tr>
<tr><td>+ <code>GRND_INSECURE</code> (5.6)</td><td>returns anyway — not for secrets</td><td>same</td></tr>
<tr><td>+ <code>GRND_RANDOM</code></td><td>no-op since 5.6 (was the blocking pool)</td><td>same</td></tr>
<tr><td><code>/dev/random</code></td><td>blocks (pre-5.6 also whenever the estimate ran low)</td><td>same</td></tr>
<tr><td><code>/dev/urandom</code></td><td>never blocks (= <code>GRND_INSECURE</code>; tries jitter first)</td><td>same</td></tr>
</tbody>
</table></p>
<p>Reads <span class="math">≤</span>256 B are never cut short by a signal. <code>random(7)</code> (man-pages 6.19, 2026) still describes the pre-5.6 blocking pool.</p>
</section>
<section class="sheet-section">
<h2>When seeding goes wrong</h2>
<ul>
<li><strong>First boot, headless</strong>: no disk, keyboard or mouse noise; keys generated before the  pool is seeded (routers, 2012 below).</li>
<li><strong>Cloned VM / restored snapshot</strong>: two machines, one generator state. VM generation ID  (5.18) forces a reseed; WireGuard wipes its keys on VM fork.</li>
<li><strong><code>fork()</code></strong>: the child inherits a user-space generator’s state — Rust  <code>ThreadRng</code> (ChaCha12, reseeds every 64 kB) does not reseed on fork; call <code>reseed()</code>.</li>
<li><strong>Microcontrollers</strong>: ESP-IDF <code>esp_random()</code> is true random only while Wi-Fi or  Bluetooth runs (or <code>bootloader_random_enable()</code>), else pseudo-random — seed an mbedTLS  DRBG from it.</li>
</ul>
</section>
<section class="sheet-section">
<h2>UUIDs — identifiers, not secrets (RFC 9562)</h2>
<figure class="sheet-figure"><img src="secure-randomness-fig2.svg" width="301" height="75" alt="Secure randomness — entropy, DRBGs, platform APIs, nonces, UUIDs, failures — figure 2" loading="lazy"></figure>
<p>May 2024, obsoletes RFC 4122; “SHOULD utilize UUIDv7 instead of UUIDv1 and UUIDv6”. v4 has “poor database-index locality”; v7 sorts by creation (ms) and <em>reveals</em> it; a counter or sub-ms time in <code>rand_a</code> costs random bits. “SHOULD NOT assume that UUIDs are hard to guess”, “MUST NOT be used as security capabilities” — no reset tokens, no share links. CSPRNG “SHOULD” generate them.</p>
</section>
<section class="sheet-section">
<h2>Modulo bias</h2>
<figure class="sheet-figure"><img src="secure-randomness-fig3.svg" width="308" height="34" alt="Secure randomness — entropy, DRBGs, platform APIs, nonces, UUIDs, failures — figure 3" loading="lazy"></figure>
<p><code>byte % 10</code>: digits 0–5 have 26/256, 6–9 have 25/256 — 4 % likelier. Reject the red tail and redraw, or call <code>Int.random(in:)</code>, <code>arc4random_uniform</code>, <code>randomInt</code>, <code>secrets.randbelow</code>.</p>
<pre class="sheet-code"><code class="hljs language-typescript"><span class="hljs-keyword">const</span> lim = <span class="hljs-number">2</span>**<span class="hljs-number">32</span> - <span class="hljs-number">2</span>**<span class="hljs-number">32</span> % n;  <span class="hljs-comment">// largest multiple of n; u = new Uint32Array(1)</span>
<span class="hljs-keyword">do</span> crypto.<span class="hljs-title function_">getRandomValues</span>(u); <span class="hljs-keyword">while</span> (u[<span class="hljs-number">0</span>] &gt;= lim); <span class="hljs-keyword">return</span> u[<span class="hljs-number">0</span>] % n;</code></pre>
</section>
<section class="sheet-section">
<h2>Which call, per platform</h2>
<p><table class="sheet-table">
<thead>
<tr><th></th><th><strong>use</strong></th><th><strong>know</strong></th></tr>
</thead>
<tbody>
<tr><td>Apple</td><td><code>SecRandomCopyBytes</code>; <code>Int.random(in:)</code>; CryptoKit <code>SymmetricKey(size:)</code></td><td>check <code>errSecSuccess</code>; <code>random(in:)</code> is unbiased (Lemire); GameplayKit sources “not cryptographically robust”</td></tr>
<tr><td>Java, Android</td><td><code>new SecureRandom()</code> — no seed, no provider (JDK on Linux: NativePRNG, <code>/dev/urandom</code>)</td><td>JDK <code>getInstanceStrong()</code> = NativePRNGBlocking (<code>/dev/random</code>); “Crypto” SHA1PRNG provider gone in Android 9; <code>java.util.Random</code> not crypto</td></tr>
<tr><td>Browser</td><td><code>crypto.getRandomValues</code>, <code>crypto.randomUUID</code></td><td><span class="math">≤</span>65 536 B a call, else <code>QuotaExceededError</code>; integer arrays only; <code>randomUUID</code> needs a secure context</td></tr>
<tr><td>Node</td><td><code>randomBytes</code>, <code>randomInt</code>, <code>randomUUID</code></td><td><code>randomInt</code>: max<span class="math">-</span>min <span class="math">&lt;2<sup>48</sup></span>; <code>randomUUID</code> caches entropy for 128 UUIDs</td></tr>
<tr><td>React Native</td><td><code>react-native-get-random-values</code> (imported first, before <code>uuid</code>) or <code>expo-crypto</code></td><td>bridges to <code>SecRandomCopyBytes</code> / <code>SecureRandom</code>; Expo <code>getRandomBytes</code> <span class="math">≤</span>1024 B and falls back to <code>Math.random</code> in development</td></tr>
<tr><td>Python</td><td><code>secrets.token_urlsafe()</code> etc. (3.6)</td><td>default 32 B — “sufficient” as of 2015; <code>random</code> is for “modelling and simulation”</td></tr>
<tr><td>Go</td><td><code>crypto/rand.Read</code>, <code>rand.Text()</code></td><td>1.24: <code>Read</code> never returns an error (crashes instead); <code>Text</code> = base32, <span class="math">≥</span>128 bits</td></tr>
<tr><td>Windows</td><td><code>ProcessPrng</code>, <code>BCryptGenRandom</code></td><td>what Go and Swift call</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Keys, nonces, IVs, tokens</h2>
<p><table class="sheet-table">
<tbody>
<tr><td>symmetric key</td><td>128 / 256 bits straight from the CSPRNG, or a KDF of a secret — never a password or the time</td></tr>
<tr><td>CBC IV</td><td><em>unpredictable</em>: fresh random 16 B per message (SP 800-38A)</td></tr>
<tr><td>GCM nonce</td><td><em>unique</em> per key: a counter, or random 96-bit for <span class="math">≤2<sup>32</sup></span> messages per key (SP 800-38D); XChaCha20 takes a random 192-bit nonce</td></tr>
<tr><td>ECDSA <span class="math">k</span></td><td>a repeated or guessable <span class="math">k</span> gives away the key — RFC 6979 derives it deterministically; Ed25519 (RFC 8032) is deterministic by design</td></tr>
<tr><td>access token, reset link</td><td>OAuth: guessing <span class="math">≤2<sup>-128</sup></span> (MUST), <span class="math">≤2<sup>-160</sup></span> (SHOULD) — i.e. <span class="math">≥</span>128 bits of CSPRNG output, base64url</td></tr>
<tr><td>session ID</td><td>OWASP: <span class="math">≥</span>64 bits of entropy (<span class="math">≥</span>16 hex chars) — 585 years at 10 000 guesses/s vs 100 000 live sessions</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Failures — one weak generator, every key</h2>
<p><table class="sheet-table">
<tbody>
<tr><td>2006–08 Debian</td><td>a Debian-only OpenSSL patch (0.9.8c-1, Sep 2006) left the PID as the only input: 32 767 keys per architecture, size and type. SSH, OpenVPN, DNSSEC, X.509 keys; every DSA key <em>used</em> there (CVE-2008-0166)</td></tr>
<tr><td>2012 Ps &amp; Qs</td><td>routers, firewalls seeded at boot <span class="math">→</span> shared RSA primes, batch GCD: keys of 0.50 % of TLS and 0.03 % of SSH hosts; DSA keys of 1.03 % of SSH hosts by repeated <span class="math">k</span></td></tr>
<tr><td>2013 Android</td><td>Harmony <code>SHA1PRNG</code> bug + unseeded OpenSSL PRNG (<span class="math">≤</span>4.3, CVE-2013-7372) <span class="math">→</span> Bitcoin wallets repeated ECDSA <span class="math">k</span>, coins stolen; fixed in 4.4</td></tr>
<tr><td>2013–15 Dual_EC</td><td>whoever knows <span class="math">e</span> with <span class="math">P = eQ</span> predicts all later output; NIST advised against it in Sep 2013. Juniper ScreenOS (Dec 2015): intruders swapped <span class="math">Q</span> <span class="math">→</span> passive VPN decryption</td></tr>
<tr><td>2023 Milk Sad</td><td><code>bx seed</code> (Libbitcoin Explorer 3.x): <code>mt19937</code> seeded with 32 bits of time <span class="math">→</span> <span class="math">2<sup>32</sup></span> wallets, drained in the wild (CVE-2023-39910)</td></tr>
<tr><td>2025 Zen 5</td><td>16/32-bit <code>RDSEED</code> returns 0 while signalling success (AMD-SB-7055); Linux disables it on unfixed microcode</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap">Ignoring <code>SecRandomCopyBytes</code>’ status: on failure whatever the buffer held — usually  zeros — becomes the key.</li>
<li class="trap">Seeding any generator with the time, the PID or a test constant — 32 bits is <span class="math">2<sup>32</sup></span> guesses.</li>
<li class="trap">Hashing the output of a weak PRNG: SHA-256 of 32 bits of entropy is still 32 bits.</li>
<li class="trap">A 6-digit OTP holds <span class="math">log<sub>2</sub> 10<sup>6</sup> ≈20</span> bits — safe only with rate limits and expiry,  never as a bearer token.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<p><strong>Entropy seeds, the DRBG expands, the OS serves. Keys random, nonces unique, IVs
unpredictable, tokens <span class="math">≥</span>128 bits. Watch first boot, clones and forks — UUIDs identify, never
authorise.</strong></p>
</section>
