ptic curves</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">crypto · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> A <strong>trapdoor</strong>: cheap one way, infeasible back without a secret. <strong>RSA</strong>:
<strong>factoring</strong> <span class="math">n = pq</span>. <strong>DH</strong>: the <strong>discrete log</strong> of <span class="math">g<sup>a</sup></span> mod <span class="math">p</span>. <strong>ECC</strong>:
<span class="math">k</span> from <span class="math">kG</span>; only <em>generic</em> <span class="math">√(n)</span> attacks are known, so a 256-bit curve matches
3072-bit RSA. Shor’s algorithm breaks all three.</p>
<p class="sheet-tools"><a class="sheet-download" href="public-key-maths.pdf" download>Download PDF</a> <a href="public-key-maths.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/crypto/public-key-maths.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="public-key-maths-fig1.svg" width="622" height="181" class="wide" alt="Public-key maths — RSA, Diffie–Hellman, elliptic curves — figure 1" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">RSA — keys and operations</span></h3>
<ul>
<li><strong>Keygen</strong>: equal-size primes <span class="math">p, q</span> (1536 bits each for RSA-3072); <span class="math">n = pq</span>;  <span class="math">λ= lcm(p-1, q-1)</span> (RFC 8017; <span class="math">φ</span> also works, larger <span class="math">d</span>);  <span class="math">e</span> = <strong>65537</strong> = 2<span class="math"><sup>16</sup></span>+1; <span class="math">d = e<sup>-1</sup></span> mod <span class="math">λ</span> by extended Euclid.</li>
<li><strong>FIPS 186-5</strong>: <span class="math">n ≥2048</span>; <span class="math">e</span> odd, <span class="math">2<sup>16</sup> &lt; e &lt; 2<sup>256</sup></span> (<span class="math">e = 3</span> is out);  <span class="math">|p - q| &gt; 2<sup>nlen/2-100</sup></span> (else Fermat’s method factors <span class="math">n</span>); <span class="math">2<sup>nlen/2</sup> &lt; d &lt; λ</span>.</li>
<li><strong>Encrypt</strong> <span class="math">c = m<sup>e</sup></span>, <strong>decrypt</strong> <span class="math">m = c<sup>d</sup></span>; <strong>sign</strong> <span class="math">s = EM<sup>d</sup></span>,  <strong>verify</strong> <span class="math">s<sup>e</sup></span> = EM (all mod <span class="math">n</span>; EM = padded <span class="math">H(m)</span>). <span class="math">e</span> = 65537: 16 squarings + 1 product.</li>
<li><strong>CRT</strong> (RFC 8017 key <span class="math">p, q, dP, dQ, qInv</span>): two half-size powers, <span class="math">≈</span>4<span class="math">×</span>  faster. Toy: <span class="math">dP</span> = 53, <span class="math">dQ</span> = 49, <span class="math">qInv</span> = 38; <span class="math">m<sub>1</sub></span> = 45<span class="math"><sup>53</sup></span> mod 61 = 4, <span class="math">m<sub>2</sub></span> =  34<span class="math"><sup>49</sup></span> mod 53 = 12, <span class="math">h = (m<sub>1</sub> - m<sub>2</sub>) qInv</span> mod <span class="math">p</span> = 1, <span class="math">m = m<sub>2</sub> + qh</span> = <strong>65</strong>.</li>
<li>Factoring gives <span class="math">d</span>; “breaking RSA <span class="math">⇒</span> factoring” is unproven.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Padding — textbook RSA is broken</span></h3>
<p><table class="sheet-table">
<tbody>
<tr><td>deterministic</td><td>same <span class="math">m</span> <span class="math">→</span> same <span class="math">c</span>: guess, encrypt, compare</td></tr>
<tr><td>malleable</td><td><span class="math">c ·2<sup>e</sup></span> mod <span class="math">n</span> decrypts to <span class="math">2m</span></td></tr>
<tr><td><span class="math">e = 3</span>, <span class="math">m<sup>3</sup> &lt; n</span></td><td><span class="math">c</span> is a plain cube: take the integer cube root</td></tr>
<tr><td>v1.5 encryption</td><td>a 1-bit “padding OK?” oracle decrypts or signs in <span class="math">∼</span>2<span class="math"><sup>20</sup></span> queries
(Bleichenbacher); ROBOT: 27 of the top 100 domains; Marvin: timing alone</td></tr>
</tbody>
</table></p>
<p>Fix: <strong>OAEP</strong> (encryption) and <strong>PSS</strong> (signatures), REQUIRED for new applications by RFC 8017. NIST disallowed v1.5 key transport after 2023; v1.5 <em>signatures</em> survive in certificates and JWT <code>RS256</code>. OAEP carries <span class="math">≤k - 2h<sub>Len</sub> - 2</span> bytes: RSA-2048 + SHA-256 = <strong>190 B</strong> <span class="math">→</span> wrap a key (hybrid), never bulk data.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Factoring cost — sub-exponential</span></h3>
<p>GNFS <span class="math">≈exp(1.923 (lnn)<sup>1/3</sup>(lnlnn)<sup>2/3</sup>)</span> <span class="math">→</span> 3072 bits for 128-bit security. Records: RSA-250 (829 bits, <span class="math">∼</span>2700 core-years); RSA-260 (862 bits, Sep 2026, <span class="math">∼</span>4900 GPU-days <span class="math">≈</span> $400k, “essentially no algorithmic advancements”; RSA-1024 put at <span class="math">∼</span>$30M, RSA-2048 <span class="math">∼</span>10<span class="math"><sup>9</sup>×</span> harder).</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Diffie–Hellman and the discrete log</span></h3>
<ul>
<li>Each side sends <span class="math">g<sup>x</sup></span> mod <span class="math">p</span>; both reach <span class="math">g<sup>ab</sup></span>; unauthenticated, so sign the transcript.  The NFS solves the <strong>DLP</strong> in <span class="math"><strong>Z</strong><sub>p</sub><sup>*</sup></span> sub-exponentially too <span class="math">→</span> RSA-like  sizes (3072-bit <span class="math">p</span>, 256-bit subgroup).</li>
<li>RFC 7919 safe-prime groups ffdhe2048…8192, <span class="math">g = 2</span> (2048 rated <span class="math">≈</span>103 bits);  peers MUST check <span class="math">1 &lt; Y &lt; p - 1</span>, else <span class="math">Y = p - 1</span> forces a 2-element subgroup.</li>
<li><strong>Logjam</strong>: NFS precomputation depends only on <span class="math">p</span>. 512-bit export DH fell per  connection (8.4 % of top-1M domains); breaking the commonest 1024-bit prime would expose  18 % of top-1M HTTPS.</li>
</ul>
<h3 class="sheet-hd"><span class="c-sheetblue">Comparable strength — SP 800-57 Pt 1 Rev 5, Table 2</span></h3>
<p><table class="sheet-table">
<thead>
<tr><th><strong>bits</strong></th><th><strong>symmetric</strong></th><th><strong>RSA/DH</strong></th><th><strong>ECC (|n|)</strong></th><th><strong>ratio</strong></th><th><strong>NIST (IR 8547 draft)</strong></th></tr>
</thead>
<tbody>
<tr><td><span class="math">≤</span>80</td><td>2TDEA</td><td>1024</td><td>160–223</td><td>—</td><td>insufficient</td></tr>
<tr><td>112</td><td>3TDEA</td><td>2048</td><td>224–255</td><td>9<span class="math">×</span></td><td>deprecated after 2030</td></tr>
<tr><td><strong>128</strong></td><td><strong>AES-128</strong></td><td><strong>3072</strong></td><td><strong>256–383</strong></td><td><strong>12<span class="math">×</span></strong></td><td>disallowed after 2035</td></tr>
<tr><td>192</td><td>AES-192</td><td>7680</td><td>384–511</td><td>20<span class="math">×</span></td><td>disallowed after 2035</td></tr>
<tr><td>256</td><td>AES-256</td><td>15360</td><td>512+</td><td>30<span class="math">×</span></td><td>disallowed after 2035</td></tr>
</tbody>
</table></p>
<p>IR 8547 treats RSA, ECDSA, EdDSA, DH, ECDH alike: Shor solves factoring and both discrete logs in polynomial time; Gidney 2025: RSA-2048 in <span class="math">&lt;</span>1 week on <span class="math">&lt;</span>1 M noisy qubits.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Elliptic curves — the group</span></h3>
<p>Points on <span class="math">y<sup>2</sup> = x<sup>3</sup> + ax + b</span> over <span class="math"><strong>F</strong><sub>p</sub></span>, plus <span class="math">O</span>. Chord <span class="math">λ= y<sub>2</sub> - y<sub>1</sub>/x<sub>2</sub> - x<sub>1</sub></span>, tangent <span class="math">λ= 3x<sub>1</sub><sup>2</sup> + a/2y<sub>1</sub></span>; <span class="math">x<sub>3</sub> = λ<sup>2</sup> - x<sub>1</sub> - x<sub>2</sub></span>, <span class="math">y<sub>3</sub> = λ(x<sub>1</sub> - x<sub>3</sub>) - y<sub>1</sub></span>; <span class="math">-P = (x, -y)</span>; divide = multiply by the inverse mod <span class="math">p</span>. <span class="math">kG</span> by <strong>double-and-add</strong>. <strong>ECDLP</strong> (<span class="math">k</span> from <span class="math">kG</span>): best known for good curves is Pollard’s rho, <span class="math">∼√(n)</span> steps <span class="math">→</span> 256-bit <span class="math">n</span> = 128-bit security. Hasse: <span class="math">#E ∈p + 1 ±2√(p)</span>; cofactor <span class="math">h = #E/n</span>.</p>
<figure class="sheet-figure"><img src="public-key-maths-fig2.svg" width="313" height="143" alt="Public-key maths — RSA, Diffie–Hellman, elliptic curves — figure 2" loading="lazy"></figure>
<h3 class="sheet-hd"><span class="c-sheetblue">Curves in use</span></h3>
<p><table class="sheet-table">
<thead>
<tr><th><strong>curve</strong></th><th><strong>equation · field</strong></th><th><strong>h</strong></th><th><strong>used for</strong></th></tr>
</thead>
<tbody>
<tr><td>P-256</td><td><span class="math">y<sup>2</sup> = x<sup>3</sup> - 3x + b</span>, <span class="math">p = 2<sup>256</sup> - 2<sup>224</sup> + 2<sup>192</sup> + 2<sup>96</sup> - 1</span>; <span class="math">b</span> from a seed</td><td>1</td><td>TLS 1.3 MUST; ES256, APNs</td></tr>
<tr><td>secp256k1</td><td><span class="math">y<sup>2</sup> = x<sup>3</sup> + 7</span>, <span class="math">p = 2<sup>256</sup> - 2<sup>32</sup> - 977</span></td><td>1</td><td>Bitcoin</td></tr>
<tr><td>Curve25519</td><td><span class="math">v<sup>2</sup> = u<sup>3</sup> + 486662u<sup>2</sup> + u</span>, <span class="math">p = 2<sup>255</sup> - 19</span>, <span class="math">u = 9</span>; clamp: low 3 bits 0, bit 255 = 0, bit 254 = 1</td><td>8</td><td>X25519 (TLS SHOULD)</td></tr>
<tr><td>Ed25519</td><td><span class="math">-x<sup>2</sup> + y<sup>2</sup> = 1 + dx<sup>2</sup>y<sup>2</sup></span>, <span class="math">d = -121665/121666</span>: same curve, Edwards form</td><td>8</td><td>SSH default</td></tr>
</tbody>
</table></p>
<h3 class="sheet-hd"><span class="c-sheetblue">ECDSA vs Ed25519 — the nonce</span></h3>
<p><table class="sheet-table">
<thead>
<tr><th></th><th><strong>ECDSA</strong> (FIPS 186-5)</th><th><strong>Ed25519</strong> (RFC 8032)</th></tr>
</thead>
<tbody>
<tr><td>nonce</td><td>random <span class="math">k</span>, or RFC 6979 (deterministic)</td><td><span class="math">r</span> = SHA-512(prefix <span class="math">‖</span> M) mod <span class="math">L</span></td></tr>
<tr><td>sign</td><td><span class="math">r = (kG)<sub>x</sub></span>, <span class="math">s = k<sup>-1</sup>(z + r d)</span> mod <span class="math">n</span></td><td><span class="math">R = rB</span>, <span class="math">S = r + H(R ‖A ‖M)  s</span> mod <span class="math">L</span></td></tr>
<tr><td>bytes</td><td><span class="math">r ‖s</span> = 64 (JWS), DER <span class="math">≤</span> 72</td><td>64; reject <span class="math">S ≥L</span></td></tr>
<tr><td>malleable</td><td>yes: <span class="math">(r, n - s)</span> verifies</td><td>no</td></tr>
</tbody>
</table></p>
<p><strong>Nonce reuse</strong>: same <span class="math">k</span> <span class="math">⇒</span> same <span class="math">r</span>; <span class="math">k = z<sub>1</sub> - z<sub>2</sub>/s<sub>1</sub> - s<sub>2</sub></span>, <span class="math">d = s<sub>1</sub> k - z<sub>1</sub>/r</span> (mod <span class="math">n</span>): the key from two signatures. Sony signed PS3 code with one fixed <span class="math">k</span>; LadderLeak took OpenSSL ECDSA keys from <span class="math">&lt;</span>1 bit of nonce leak per signature.</p>
<h3 class="sheet-hd"><span class="c-sheetblue">Traps</span></h3>
<ul>
<li class="trap">“Signing = encrypting with the private key” — only in textbook RSA.</li>
<li class="trap">“256-bit ECC = 256-bit security” — it is 128.</li>
<li class="trap">A starved RNG at key generation repeats a prime: <span class="math">gcd(n<sub>1</sub>, n<sub>2</sub>) = p</span> (gcd(3233, 61·59)  = 61). A batch GCD factored the RSA keys of 0.50 % of TLS and 0.03 % of SSH hosts.</li>
<li class="trap">Square-and-multiply branches on secret bits; timing leaks the key (Kocher) <span class="math">→</span>  constant-time ladder, blinding.</li>
<li class="trap">ECDH without an on-curve check: invalid points leaked keys from 2 of 8 TLS libraries.  X25519 accepts any 32 bytes by design.</li>
</ul>
