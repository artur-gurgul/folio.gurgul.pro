folio-page"><h1 class="title">Block cipher modes — ECB, CBC, CTR, GCM, padding oracles</h1><div id="post"><article class="sheet">
<p class="sheet-kicker">crypto · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> <strong>AES</strong> is a keyed <em>permutation</em> of one 16-byte block; a <strong>mode</strong> makes it
a message cipher. <strong>ECB</strong> shows equal blocks, <strong>CBC</strong> chains (unpredictable IV + padding),
<strong>CTR</strong> is a stream cipher (unique counters), <strong>GCM</strong> = CTR + a GF(2<sup>128</sup>) MAC
= <strong>AEAD</strong>. No confidentiality-only mode protects integrity; a repeated or predictable IV breaks them.</p>
<p class="sheet-tools"><a class="sheet-download" href="block-cipher-modes.pdf" download>Download PDF</a> <a href="block-cipher-modes.svg" title="The sheet as printed, one page">Print view</a> <a href="https://github.com/artur-gurgul/folio.gurgul.pro/blob/main/src/crypto/block-cipher-modes.tex">LaTeX source</a></p>
<section class="sheet-section">
<figure class="sheet-figure"><img src="block-cipher-modes-fig1.svg" width="626" height="159" class="wide" alt="Block cipher modes — ECB, CBC, CTR, GCM, padding oracles — figure 1" loading="lazy"></figure>
</section>
<section class="sheet-section">
<h2>How it works</h2>
<ul>
<li><strong>AES</strong> (FIPS 197, 2001; the 2023 update is editorial only): 128-bit block; 128/192/256-bit  key <span class="math">→</span> 10/12/14 rounds of SubBytes · ShiftRows · MixColumns · AddRoundKey (no MixColumns  in the last). Same key + same block <span class="math">→</span> same output, always — the rest is the mode. NIST  proposed (Dec 2024) adding <strong>Rijndael-256</strong>: 256-bit block, one 256-bit key, for bulk data.</li>
<li><strong>Padding</strong> (ECB, CBC): PKCS#7 (RFC 5652) appends <span class="math">n</span> bytes of value <span class="math">n</span>, 1–16 — a whole  block of <code>0x10</code> if already aligned. Ciphertext stealing (CBC-CS1/2/3, SP 800-38A addendum,  2010) needs none; nor do CTR, GCM, ChaCha20: <span class="math">|C| = |P|</span>.</li>
<li><strong>IV vs nonce</strong> (SP 800-38A App. C): a CBC/CFB IV must be <em>unpredictable</em> — RBG  output, or E<span class="math"><sub>K</sub></span>(nonce); an OFB IV and the CTR counter blocks need only be <em>unique</em>.  Both are public. TLS 1.0 used the last ciphertext block as the next IV: BEAST (2011);  TLS 1.1 (2006) had already switched to explicit IVs.</li>
<li><strong>Birthday bound</strong>: after <span class="math">∼</span>2<span class="math"><sup>b/2</sup></span> blocks, ciphertext collisions leak plaintext  XORs. 64-bit blocks (3DES, Blowfish): 2<span class="math"><sup>32</sup></span> blocks = 32 GB; Sweet32 (2016) took a two-block  HTTPS cookie with 785 GB. NIST then capped 3DES at 2<span class="math"><sup>20</sup></span> blocks per key (2017); TDEA encryption  is disallowed since 2024. AES: rekey well before 2<span class="math"><sup>64</sup></span> blocks.</li>
</ul>
</section>
<section class="sheet-section">
<h2>The SP 800-38A modes</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>mode</strong></th><th><strong>IV</strong></th><th><strong>parallel enc/dec</strong></th><th><strong>1 bit flipped in C<span class="math"><sub>j</sub></span></strong></th><th><strong>IV repeated</strong></th></tr>
</thead>
<tbody>
<tr><td>ECB</td><td>none</td><td>yes/yes</td><td>P<span class="math"><sub>j</sub></span> random</td><td>equal blocks always show</td></tr>
<tr><td>CBC</td><td>unpredictable</td><td>no/yes</td><td>P<span class="math"><sub>j</sub></span> random, <strong>same bit</strong> in P<span class="math"><sub>j+1</sub></span></td><td>equal prefixes show</td></tr>
<tr><td>CFB</td><td>unpredictable</td><td>no/yes</td><td>same bit in P<span class="math"><sub>j</sub></span>, next <span class="math">b/s</span> segments random</td><td>first segments’ XOR leaks</td></tr>
<tr><td>OFB</td><td>unique</td><td>no/no (precompute)</td><td>same bit in P<span class="math"><sub>j</sub></span></td><td>two-time pad</td></tr>
<tr><td>CTR</td><td>unique counters</td><td>yes/yes</td><td>same bit in P<span class="math"><sub>j</sub></span></td><td>two-time pad</td></tr>
</tbody>
</table></p>
<p>Random = each bit wrong with probability 1/2; same bit = exactly the flipped position — the attacker’s steering wheel. <strong>NIST, Oct 2026</strong>: 38A is being revised (decided 2023) to limit ECB to uses other NIST rules allow — one-block jobs like IV generation, challenge–response, QUIC header protection; the SP 800-131A Rev. 3 <em>draft</em> (2024; Rev. 2 still in force) disallows ECB for encryption. CBC…CTR stay acceptable, the CTS addendum folds into 38A, and NIST may deprecate these modes once a wide-block “accordion” (IR 8552) is approved.</p>
</section>
<section class="sheet-section">
<h2>AEAD constructions</h2>
<p><table class="sheet-table">
<thead>
<tr><th><strong>construction</strong></th><th><strong>nonce</strong></th><th><strong>max message</strong></th><th><strong>if the nonce repeats</strong></th></tr>
</thead>
<tbody>
<tr><td>AES-GCM</td><td>96 bit, unique</td><td>2<span class="math"><sup>39</sup>-256</span> bits (<span class="math">≈</span>64 GiB)</td><td>two-time pad + H recovered <span class="math">→</span> forgeries</td></tr>
<tr><td>AES-CCM</td><td>7–13 B, unique</td><td><span class="math">&lt;2<sup>8L</sup></span> B, <span class="math">L = 15 - |N|</span></td><td>two-time pad</td></tr>
<tr><td>ChaCha20-Poly1305</td><td>96 bit, unique</td><td>274 877 906 880 B (<span class="math">≈</span>256 GB)</td><td>two-time pad + one-time Poly1305 key reused</td></tr>
<tr><td>XChaCha20-Poly1305</td><td>192 bit, random OK</td><td><span class="math">∼</span>2<span class="math"><sup>64</sup></span> B</td><td>as ChaCha20 — collisions negligible</td></tr>
<tr><td>AES-GCM-SIV</td><td>96 bit</td><td>2<span class="math"><sup>36</sup></span> B</td><td>leaks only <em>whether</em> two messages were equal</td></tr>
<tr><td>Ascon-AEAD128</td><td>128 bit, unique</td><td>2<span class="math"><sup>54</sup></span> B per key</td><td>“shall be distinct” (SP 800-232 R3)</td></tr>
</tbody>
</table></p>
<p>CCM (CBC-MAC, then CTR; two passes) runs BLE’s link layer with a 4-byte MIC and 13-byte nonce, so <span class="math">L = 2</span>: payloads <span class="math">&lt;</span>64 KiB. ChaCha20 is <span class="math">∼</span>3<span class="math">×</span> AES on chips without AES instructions; libsodium ships AES-GCM only for chips with them (x86 AES-NI, ARM Crypto extensions).</p>
</section>
<section class="sheet-section">
<h2>Malleability, worked (CTR, no MAC)</h2>
<p>Known plaintext <code>amount=100</code>. XOR the ciphertext byte under <code>1</code> with <code>&quot;1&quot;</code> <span class="math">⊕</span> <code>&quot;9&quot;</code> (= <code>0x08</code>) — no key, no decryption — and the server reads <code>amount=900</code>. Encryption hid the value; it never protected it.</p>
</section>
<section class="sheet-section">
<h2>Example — the CBC padding oracle</h2>
<p>Vaudenay (2002): “bad padding” answered unlike “bad MAC” (status, text, <em>timing</em>). P<span class="math"><sub>i</sub></span> = D<span class="math"><sub>K</sub></span>(C<span class="math"><sub>i</sub></span>) <span class="math">⊕</span> C<span class="math"><sub>i-1</sub></span>, so edit C<span class="math"><sub>i-1</sub></span>: <span class="math">≤</span>256 tries a byte, no key.</p>
<pre class="sheet-code"><code class="hljs language-plaintext">def last_byte(prev, block):            # recover P[15] of block
  for g in range(256):
    fake = prev[:15] + bytes([g])      # we control C(i-1)
    if oracle(fake + block) == &quot;padding ok&quot;:   # P&#x27;[15] is 0x01
      d = g ^ 0x01                     # d = D_K(block)[15]
      return d ^ prev[15]   # then force 0x02 0x02 for byte 14 ...</code></pre>
<p>Then: TLS by timing (2003) · ASP.NET (MS10-070, 2010: <code>web.config</code>) · <strong>Lucky 13</strong> (2013): MAC-then-encrypt timing; 13 = 5 header + 8 sequence bytes in the MAC · <strong>POODLE</strong> (2014): SSL 3.0 padding is neither deterministic nor MAC-ed — a moved block passes 1 time in 256. Fix: <strong>verify a MAC over IV + ciphertext before decrypting</strong>, or use AEAD.</p>
</section>
<section class="sheet-section">
<h2>GCM, inside (SP 800-38D)</h2>
<ul>
<li>J<span class="math"><sub>0</sub></span> = IV <span class="math">‖</span> 0<span class="math"><sup>31</sup></span> <span class="math">‖</span> 1 for a 96-bit IV (others are GHASHed; NIST  recommends 96 only); data from inc<span class="math"><sub>32</sub></span>(J<span class="math"><sub>0</sub></span>); T = MSB<span class="math"><sub>t</sub></span>(E<span class="math"><sub>K</sub></span>(J<span class="math"><sub>0</sub></span>) <span class="math">⊕</span> GHASH).</li>
<li>P(IV repeats under a key) <span class="math">≤</span> 2<span class="math"><sup>-32</sup></span>: deterministic IV = 32-bit <strong>fixed field</strong>  (device) <span class="math">‖</span> 64-bit <strong>invocation counter</strong>, or random <span class="math">≥</span>96 bits and  <span class="math">≤</span><strong>2<span class="math"><sup>32</sup></span> messages per key</strong>. TLS 1.3: nonce = static IV <span class="math">⊕</span> record number.  <strong>Power loss must not repeat an IV</strong>.</li>
<li>Tags 128…96 bits; 64/32 only under App. C’s caps. Targeted forgery <span class="math">≈n/2<sup>t</sup></span> for <span class="math">n</span>  blocks, each success leaks H (Ferguson 2005). Rev. 1 (decided Mar 2024): no tags <span class="math">&lt;</span>96, TLS  1.3 IVs approved; pre-draft (Jun 2026): wGCM for Rijndael-256.</li>
<li><strong>Nonce reuse</strong>: XOR of two tags = a known polynomial in H; its roots give H (Joux,  “forbidden attack”, 2006) <span class="math">→</span> tags for any ciphertext. 2016: 184 HTTPS servers repeated  GCM nonces.</li>
</ul>
<p><table class="sheet-table">
<thead>
<tr><th><strong>rekey before</strong></th><th><strong>limit per key</strong></th></tr>
</thead>
<tbody>
<tr><td>TLS 1.3 AES-GCM (RFC 8446)</td><td>2<span class="math"><sup>24.5</sup></span> full-size records</td></tr>
<tr><td>QUIC AES-GCM · AES-CCM (RFC 9001)</td><td>2<span class="math"><sup>23</sup></span> · 2<span class="math"><sup>21.5</sup></span> packets</td></tr>
<tr><td>QUIC ChaCha20-Poly1305</td><td>2<span class="math"><sup>36</sup></span> failed forgeries (no confidentiality limit)</td></tr>
<tr><td>AES-GCM-SIV, random nonces</td><td>2<span class="math"><sup>32</sup></span> msgs of 8 GiB, or 2<span class="math"><sup>48</sup></span> of 32 MiB</td></tr>
</tbody>
</table></p>
</section>
<section class="sheet-section">
<h2>Cipher + MAC: the order</h2>
<p><strong>Encrypt-then-MAC</strong> — C, MAC(IV <span class="math">‖</span> C) — rejects forgeries before decrypting: IPsec ESP, TLS RFC 7366 (2014), OpenSSH <code>-etm</code> MACs (6.2). <strong>MAC-then-encrypt</strong> (TLS <span class="math">≤</span>1.2 CBC) must decrypt first <span class="math">→</span> Lucky 13, POODLE. <strong>Encrypt-and-MAC</strong> (SSH, RFC 4253: MAC over sequence number + plaintext): a MAC need not hide its input. Bellare–Namprempre (2000): only EtM is secure for <em>every</em> secure cipher + MAC pair. Separate keys. GCM, ChaCha20-Poly1305 MAC the ciphertext; TLS 1.3: AEAD only.</p>
</section>
<section class="sheet-section">
<h2>Beyond the basic modes</h2>
<p><strong>GCM-SIV</strong> (RFC 8452): the tag (POLYVAL) is the CTR IV, keys per nonce — misuse-resistant, two passes. <strong>XTS</strong> (SP 800-38E): XEX tweakable cipher + ciphertext stealing, tweak = data-unit number; no expansion, so <strong>no tag</strong>; storage only; data unit <span class="math">≤</span>2<span class="math"><sup>20</sup></span> blocks; Rev. 1 draft (Sep 2026) cites IEEE 1619-2025. <strong>Ascon-AEAD128</strong> (SP 800-232, Aug 2025): no block cipher — a 320-bit permutation; 128-bit key, nonce, tag. <strong>Not key-committing</strong>: a GCM or ChaCha20-Poly1305 ciphertext can open under two keys — invisible salamanders (2018), partitioning oracles (2021, Shadowsocks).</p>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap"><code>CCCrypt</code>: default <strong>CBC</strong>, no IV <span class="math">→</span> <strong>all-zero IV</strong>. Java SunJCE  <code>getInstance(&quot;AES&quot;)</code> = <strong>ECB</strong>/PKCS5Padding (Google Play flags it). Go: no ECB,  OFB/CFB deprecated (1.24).</li>
<li class="trap">IV from the key, a constant IV, a counter reset on reinstall or shared by two devices;  plaintext released before the tag check.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Remember</h2>
<h3 class="sheet-hd">ECB leaks · CBC chains · CTR streams · GCM = CTR + tag · verify, then decrypt.</h3>
</section>
