<p class="sheet-kicker">typescript · folio</p>
<p class="sheet-oneliner"><strong>In one line:</strong> Type parameters are <strong>solved by inference</strong> at each call and bounded by
<code>extends</code>. <strong>Conditional</strong>, <strong>mapped</strong> and <strong>template-literal</strong> types add a
small pure functional language — if, pattern-bind, map over keys, recurse — that the checker runs
at compile time and erases from the JavaScript, inside fixed depth and union-size limits.</p>

<section class="sheet-section">
<h2>Type parameters &amp; inference</h2>
<ul>
<li><strong>Constraint</strong> <code>&lt;T extends HasId&gt;</code>: an upper bound, met by shape; in the body  only the constraint’s members exist. <code>K extends keyof T</code> ties one parameter to  another. <strong>Default</strong> <code>&lt;T = string&gt;</code> (2.3): used when inference finds no  candidate; it must satisfy the constraint; no required parameter after a defaulted one.</li>
<li><strong>Inference</strong> gathers candidates from every argument: <code>combine&lt;T&gt;(a: T[], b: T[])</code>  on <code>([1, 2, 3], [&quot;hello&quot;])</code> fails with <em>Type ’string’ is not assignable to type
 ’number’</em> — pass <code>&lt;string | number&gt;</code> explicitly.</li>
<li><strong>Literal candidates</strong> are kept, not widened (<code>1</code> <span class="math">→</span> <code>number</code>), when the  constraint includes a primitive or literal type: <code>f&lt;T extends number&gt;(x: T, y: T): T[]</code>  makes <code>f(1, 2)</code> a <code>(1 | 2)[]</code>; without the constraint <code>number[]</code> (2.1, PR #10676).</li>
<li><code>&lt;const T&gt;</code> (5.0): infers as if the argument were written <code>as const</code>  (<code>readonly [&quot;a&quot;, &quot;b&quot;]</code>), but only for literals written in the call — a variable  stays <code>string[]</code>. A mutable constraint gives a mutable tuple: <code>const T extends
 string[]</code> infers <code>[&quot;a&quot;, &quot;b&quot;]</code> (5.3, PR #55229; 5.0–5.2 fell back to <code>string[]</code>).</li>
<li><code>NoInfer&lt;T&gt;</code> (5.4, <code>= intrinsic</code>): the position is checked but yields no  candidates — the other arguments decide <code>T</code>.</li>
<li><strong>Instantiation expression</strong> (4.7): <code>const ErrorMap = Map&lt;string, Error&gt;</code> fixes  the type arguments of a value; <code>new ErrorMap()</code> is a <code>Map&lt;string, Error&gt;</code>.</li>
<li>Handbook rules: a type parameter should <strong>appear twice</strong>, or it relates nothing;  <strong>push it down</strong> — <code>&lt;T extends any[]&gt;(arr: T)</code> returning <code>arr[0]</code> is inferred  as <code>any</code>, <code>&lt;T&gt;(arr: T[])</code> as <code>T</code>; use as few as possible.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Operators on types</h2>
<p><code>keyof T</code>: the union of its keys — a <code>string</code> index signature gives <code>string | number</code> (<code>obj[0]</code> is <code>obj[&quot;0&quot;]</code>), a <code>number</code> one <code>number</code>; <code>keyof any</code> = <code>string | number | symbol</code> (<code>PropertyKey</code>). <code>typeof v</code>: a value’s type. <code>T[K]</code>: indexed access; <code>T[number]</code>: the element type of an array or tuple; a tuple declares <code>length</code> as a literal (<code>[string, number][&quot;length&quot;]</code> is <code>2</code>). Variadic tuples (4.0): a spread may be generic and sit anywhere — <code>concat(a: T, b: U): [...T, ...U]</code> keeps both tuples’ elements. 7.0 sorts types by content, so a printed union lists its members in one fixed order (6.0: <code>--stableTypeOrdering</code>).</p>
</section>
<section class="sheet-section">
<h2>Conditional types &amp; <code>infer</code> (2.8)</h2>
<ul>
<li><code>T extends U ? X : Y</code> <strong>resolves</strong> to <code>Y</code> when the most permissive <code>T</code> is  not assignable to <code>U</code>, to <code>X</code> when it definitely is — otherwise it is  <strong>deferred</strong> and stays generic until <code>T</code> is known.</li>
<li><code>infer R</code> binds a piece of the match, and is allowed only in the <code>extends</code> clause.  One name in several <strong>co</strong>variant spots <span class="math">→</span> a union; in <strong>contra</strong>variant  spots (parameters) <span class="math">→</span> an intersection.</li>
<li>Inferring from an overloaded function uses its <strong>last</strong> signature only — for  <code>ReturnType</code> too.</li>
<li><code>infer S extends string</code> (4.7) filters in place; 4.8 parses literals:  <code>&quot;100&quot; extends `${infer N extends number}`</code> gives <code>100</code>, but <code>&quot;1.0&quot;</code> gives  <code>number</code> (it does not round-trip).</li>
</ul>
</section>
<section class="sheet-section">
<h2>Traps</h2>
<ul>
<li class="trap">Returning a new object where <code>T</code> was promised: <em>’{ length: number; }’ is
 assignable to the constraint of type ’Type’, but ’Type’ could be instantiated with a
 different subtype of constraint …</em> — the caller may hold a richer <code>T</code>.</li>
<li class="trap"><code>Omit</code>/<code>Pick</code> on a union: <code>keyof (A | B)</code> has only the shared keys, so  branch-only members vanish. <code>Omit</code> (3.5) does not distribute, by design (#31501):  write <code>T extends any ? Omit&lt;T, K&gt; : never</code>.</li>
<li class="trap"><code>T extends never ? …</code> on <code>never</code> gives <code>never</code> (#23182): test  <code>[T] extends [never]</code>.</li>
<li class="trap">A <code>return</code> under a declared <code>T extends string ? A : B</code> does not narrow by the  branch taken — each needs a cast. A fix was in the 5.8 beta (#56941), reverted  (#61136); the retry (#61359) closed unmerged in Dec 2025.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Mapped &amp; template literal types</h2>
<ul>
<li><code>keyof T</code> may hold <code>number</code>/<code>symbol</code> keys: remap via <code>Capitalize&lt;string &amp; K&gt;</code>.</li>
<li><strong>Template literal types</strong> (4.1) cross-multiply the unions in their holes:  <code>`${&quot;one&quot; | &quot;two&quot; | &quot;red&quot; | &quot;blue&quot;} fish`</code> has 4 members. A union must stay below  <strong>100 000</strong> members, else TS2590 <em>Expression produces a union type that is too
 complex to represent</em>.</li>
<li><strong>Matching</strong> <code>S extends `…${infer X}…`</code>: a hole followed by literal text takes  characters up to that text’s <strong>first</strong> occurrence; a hole followed by another hole  takes <strong>one</strong> character; the last takes the rest. 7.0 counts code points: an emoji  is one character, not two surrogate halves.</li>
<li><code>Uppercase</code>, <code>Lowercase</code>, <code>Capitalize</code>, <code>Uncapitalize</code> are declared  <code>intrinsic</code> in the lib: built into the compiler.</li>
</ul>
</section>
<section class="sheet-section">
<h2>Recursion &amp; limits</h2>
<ul>
<li>3.7 resolves type arguments lazily, so an alias may recurse through an array or  generic: <code>type Json = string | number | boolean | null | Json[] | { [k: string]: Json }</code>.  4.1: conditional types may recurse — “responsibly and sparingly”.</li>
<li><strong>100</strong> nested instantiations, or <strong>5 000 000</strong> in all, end in TS2589  <em>Type instantiation is excessively deep and possibly infinite</em>. Depth was 50 until  4.5 (PR #45711); not configurable; 7.0 keeps both (team, Sep 2026).</li>
<li><strong>Tail position</strong> (4.5): a branch that <em>is</em> another conditional is evaluated in  a loop, up to <strong>1000</strong> rounds. <code>Char | GetChars&lt;Rest&gt;</code> is not tail; an  accumulator <code>Helper&lt;Rest, Char | Acc&gt;</code> is.</li>
<li><code>in</code>/<code>out</code> also speed up deeply recursive types: the checker compares type  arguments instead of whole structures.</li>
</ul>
</section>
<section class="sheet-section">
<h2>The lib (es5.d.ts), condensed</h2>
<pre class="sheet-code"><code class="hljs language-plaintext">type Partial&lt;T&gt;  = { [P in keyof T]?: T[P] };
type Required&lt;T&gt; = { [P in keyof T]-?: T[P] };
type Readonly&lt;T&gt; = { readonly [P in keyof T]: T[P] };
type Pick&lt;T, K extends keyof T&gt; = { [P in K]: T[P] };
type Record&lt;K extends keyof any, T&gt; = { [P in K]: T };
type Exclude&lt;T, U&gt; = T extends U ? never : T;
type Extract&lt;T, U&gt; = T extends U ? T : never;
type Omit&lt;T, K extends keyof any&gt; = Pick&lt;T, Exclude&lt;keyof T, K&gt;&gt;;
type NonNullable&lt;T&gt; = T &amp; {};        // 4.8; was a conditional
type Parameters&lt;T extends (...args: any) =&gt; any&gt; =
  T extends (...args: infer P) =&gt; any ? P : never;
type ReturnType&lt;T extends (...args: any) =&gt; any&gt; =
  T extends (...args: any) =&gt; infer R ? R : any;
type Awaited&lt;T&gt; = T extends null | undefined ? T :
  T extends object &amp; { then(onfulfilled: infer F, ...args: infer _): any }
    ? F extends ((value: infer V, ...args: infer _) =&gt; any) ? Awaited&lt;V&gt; : never
    : T;
type Uppercase&lt;S extends string&gt; = intrinsic;  // NoInfer&lt;T&gt; too</code></pre>
</section>
<section class="sheet-section">
<h2>Worked types</h2>
<pre class="sheet-code"><code class="hljs language-plaintext">type Foo&lt;T&gt; = T extends { a: infer U; b: infer U } ? U : never;
type F1 = Foo&lt;{ a: string; b: number }&gt;;      // string | number
type Bar&lt;T&gt; = T extends { f: (x: infer U) =&gt; void;
                          g: (x: infer U) =&gt; void } ? U : never;
type B1 = Bar&lt;{ f: (x: { a: 1 }) =&gt; void;
                g: (x: { b: 2 }) =&gt; void }&gt;;  // { a: 1 } &amp; { b: 2 }
type Handlers&lt;E&gt; = {
  [K in keyof E as `on${Capitalize&lt;string &amp; K&gt;}`]: (e: E[K]) =&gt; void };
type H = Handlers&lt;{ login: { id: string }; logout: undefined }&gt;;
// { onLogin: (e: { id: string }) =&gt; void; onLogout: (e: undefined) =&gt; void }
type Params&lt;S&gt; = S extends `${string}:${infer P}/${infer R}`
  ? P | Params&lt;`/${R}`&gt;
  : S extends `${string}:${infer P}` ? P : never;
type P1 = Params&lt;&quot;/u/:id/post/:pid&quot;&gt;;          // &quot;id&quot; | &quot;pid&quot;
function light&lt;C extends string&gt;(all: C[], start: NoInfer&lt;C&gt;) {}
light([&quot;red&quot;, &quot;green&quot;], &quot;blue&quot;);  // error: Argument of type
// &#x27;&quot;blue&quot;&#x27; is not assignable to parameter of type &#x27;&quot;red&quot; | &quot;green&quot;&#x27;.</code></pre>
</section>
